<body><main><header><img src="assets/danzstak-d-icon.png" alt=""><div><span>DANZSTAK TOUR MANAGER</span><h1>Reply to this booking pitch</h1></div></header><p>Your reply goes only to the artist who contacted you. You do not need a DanzStak account.</p><form id="replyForm"><label>Response<select id="replyAction"><option value="reply">Reply</option><option value="interested">Interested</option><option value="offer_date">Offer a date</option><option value="pass">Pass</option></select></label><label id="dateLabel" hidden>Proposed date<input id="proposedDate" type="date"></label><label>Message<textarea id="replyContent" maxlength="4000" rows="7" required placeholder="Write your reply to the artist"></textarea></label><button type="submit">Send reply to artist</button></form><p id="replyStatus" role="status" aria-live="polite"></p><p class="privacy">DanzStak stores this reply with the artist's private booking conversation. Do not include private residential addresses or sensitive personal information.</p></main><script src="assets/booking-reply.js?v=1"></script></body></html>
