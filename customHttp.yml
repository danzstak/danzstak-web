customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(self), microphone=(self), geolocation=(), payment=(), usb=()'
  - pattern: '/messages.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
  - pattern: '/'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/index.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/feed.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/profile.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/privacy.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/terms.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
