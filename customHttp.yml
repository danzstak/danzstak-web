customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()'
      - key: 'Cache-Control'
        value: 'public, max-age=300, must-revalidate'
  - pattern: '/messages.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
  - pattern: '/plans-review.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; connect-src 'self' https://cognito-idp.us-west-1.amazonaws.com https://dr3dwdkzqb.execute-api.us-west-1.amazonaws.com; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
  - pattern: '/'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/index.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/feed.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/profile.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/privacy.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/terms.html'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
