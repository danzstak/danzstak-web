<body>
  <header><a href="booking.html" aria-label="Back to the booking agent" data-app-back>&larr;</a><h1>Trusted contacts</h1></header>
  <main>
    <p class="lede">Promoters, crews and bookers you know. Artists with an EPK see them when they plan a show nearby. Never public.</p>
    <form id="contactForm" novalidate>
      <label>Name<input name="name" maxlength="120" required autocomplete="off"></label>
      <label>Type<select name="kind"><option value="promoter">Promoter</option><option value="crew">Free tekno crew</option><option value="club">Club booker</option></select></label>
      <label>Towns<input name="towns" placeholder="Tacoma, WA; Bremerton, WA; Seattle, WA" required autocomplete="off"></label>
      <label>Venues they book<input name="venues" placeholder="Airport Tavern" autocomplete="off"></label>
      <label>Genres<input name="genres" placeholder="punk, metal" autocomplete="off"></label>
      <label>Phone<input name="phone" type="tel" inputmode="tel" autocomplete="off"></label>
      <label>Email<input name="email" type="email" autocomplete="off"></label>
      <label>Website<input name="website" type="url" placeholder="https://" autocomplete="off"></label>
      <label>Notes<input name="notes" maxlength="400" autocomplete="off"></label>
      <label class="check"><input name="consent" type="checkbox"> They agreed to be contacted by artists</label>
      <button type="submit">Add contact</button>
      <p id="formStatus" role="status" aria-live="polite"></p>
    </form>
    <h2 id="countHeading">Contacts</h2>
    <ul id="contactList"></ul>
  </main>
  <script src="assets/friendly-error.js?v=1" defer></script>
  <script src="assets/trusted-contacts.js?v=2" defer></script>
</body>
</html>
