          async function createStory(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}if(body.contentType)return mediaUpload(event,user);if(body.action==='reel'&&body.rightsCertified!==true||!body.action&&body.originalContentCertified!==true)return json(400,{error:'Certification required'});const content=String(body.content||'').trim(),mediaKey=String(body.mediaKey||''),mediaType=String(body.mediaType||''),audience=['public','friends','private'].includes(body.audience)?body.audience:'public',createdAt=new Date().toISOString(),storyId=randomUUID();if(body.action==='reel'){let url;try{url=new URL(String(body.url||''));}catch{return json(400,{error:'Valid Reel required'});}const host=url.hostname.replace(/^www\./,'').toLowerCase(),hosts=['tiktok.com','facebook.com','fb.watch','instagram.com','youtube.com','youtu.be','vimeo.com','twitch.tv','dailymotion.com','dai.ly','streamable.com'],trusted=hosts.some(x=>host===x||host.endsWith('.'+x)),direct=/\.(mp4|webm|mov|m4v)$/i.test(url.pathname);if(url.protocol!=='https:'||url.username||url.password||(!trusted&&!direct))return json(400,{error:'Unsupported Reel'});await db.send(new PutItemCommand({TableName:process.env.STORIES_TABLE,Item:{storyId:{S:storyId},userEmail:{S:user.email},kind:{S:'reel'},content:{S:url.href},createdAt:{S:createdAt},expiresAt:{N:String(now()+315360000)}}}));return json(201,{reel:{id:storyId,url:url.href,sharedAt:createdAt,isOwner:true}});}if(body.action==='view'&&mediaKey.startsWith(`users/${ownerPrefix(user)}/`)&&/^users\/[a-f0-9]{24}\/[a-f0-9-]{36}\.(jpg|png|webp|gif|mp4|webm|mov)$/.test(mediaKey)&&['image','video'].includes(mediaType))return json(200,{mediaUrl:signedMediaUrl('GET',mediaKey,3600),mediaType});if(content.length>5000||!['image','video'].includes(mediaType)||!mediaKey.startsWith(`users/${ownerPrefix(user)}/`))return json(400,{error:'Valid Story media required'});const expiresAt=now()+86400;await db.send(new PutItemCommand({TableName:process.env.STORIES_TABLE,Item:{storyId:{S:storyId},userEmail:{S:user.email},content:{S:content||'Story'},audience:{S:audience},mediaKey:{S:mediaKey},mediaType:{S:mediaType},dedicated:{BOOL:body.dedicatedMedia===true},createdAt:{S:createdAt},expiresAt:{N:String(expiresAt)}}}));return json(201,{storyId,content,audience,mediaKey,mediaType,mediaUrl:signedMediaUrl('GET',mediaKey,3600),createdAt,expiresAt});}
          async function getStories(user){const [out,links]=await Promise.all([db.send(new ScanCommand({TableName:process.env.STORIES_TABLE,FilterExpression:'expiresAt > :n',ExpressionAttributeValues:{':n':{N:String(now())}},Limit:100})),db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:user.email}},Limit:100}))]),items=out.Items||[],friends=new Set((links.Items||[]).filter(x=>x.status.S==='friends').map(x=>x.friendEmail.S)),stories=items.filter(x=>x.mediaKey?.S&&x.mediaType?.S&&(x.userEmail.S===user.email||(x.audience?.S||'public')==='public'||(x.audience?.S==='friends'&&friends.has(x.userEmail.S)))).map(x=>({storyId:x.storyId.S,userEmail:x.userEmail.S,content:x.content?.S||'Story',audience:x.audience?.S||'public',mediaType:x.mediaType.S,mediaUrl:signedMediaUrl('GET',x.mediaKey.S,3600),createdAt:x.createdAt.S,isOwner:x.userEmail.S===user.email})).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),reels=items.filter(x=>x.kind?.S==='reel'&&x.content?.S).map(x=>({id:x.storyId.S,url:x.content.S,sharedAt:x.createdAt.S,isOwner:x.userEmail.S===user.email})).sort((a,b)=>b.sharedAt.localeCompare(a.sharedAt));return json(200,{stories,reels});}
          async function deleteStory(event,user){const storyId=String(event.pathParameters?.storyId||'');if(!/^[a-f0-9-]{36}$/.test(storyId))return json(400,{error:'Valid Story required'});const found=await db.send(new GetItemCommand({TableName:process.env.STORIES_TABLE,Key:{storyId:{S:storyId}},ConsistentRead:true}));if(!found.Item)return json(404,{error:'Story not found'});if(found.Item.userEmail?.S!==user.email)return json(403,{error:'Only the owner can delete'});const mediaKey=found.Item.mediaKey?.S;if(mediaKey&&found.Item.dedicated?.BOOL){if(!mediaKey.startsWith(`users/${ownerPrefix(user)}/`))return json(409,{error:'Media ownership failed'});await s3.send(new DeleteObjectCommand({Bucket:process.env.MEDIA_BUCKET,Key:mediaKey}));}await db.send(new DeleteItemCommand({TableName:process.env.STORIES_TABLE,Key:{storyId:{S:storyId}}}));return json(200,{deleted:true});}
          async function refreshSession(event){const raw=cookie(event,'__Host-danzstak_session');if(!/^[a-f0-9]{64}$/.test(raw))return json(401,{error:'Authentication required'});const sessionId=createHash('sha256').update(raw).digest('hex'),expiresAt=now()+7200;try{await db.send(new UpdateItemCommand({TableName:process.env.SESSIONS_TABLE,Key:{sessionId:{S:sessionId}},UpdateExpression:'SET expiresAt = :e',ConditionExpression:'#t = :user AND expiresAt > :n',ExpressionAttributeNames:{'#t':'type'},ExpressionAttributeValues:{':e':{N:String(expiresAt)},':n':{N:String(now())},':user':{S:'user_session'}}}));}catch{return json(401,{error:'Authentication required'});}return {statusCode:200,headers:{'content-type':'application/json','cache-control':'no-store'},cookies:[`__Host-danzstak_session=${raw}; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=7200`],body:JSON.stringify({authenticated:true,idleTimeoutSeconds:7200})};}
          async function postVisibility(event,user){const key={userEmail:{S:user.email}},fields={hidden:'hiddenPosts',pinned:'pinnedPosts',saved:'savedPosts',muted:'mutedPosts'};if(event.requestContext.http.method==='GET'){const out=await db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:key,ConsistentRead:true})),item=out.Item||{};return json(200,{postIds:item.hiddenPosts?.SS||[],hidden:item.hiddenPosts?.SS||[],pinned:item.pinnedPosts?.SS||[],saved:item.savedPosts?.SS||[],muted:item.mutedPosts?.SS||[]});}let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const id=String(body.postId||''),preference=String(body.preference||'hidden'),field=fields[preference];if(!/^[\w-]{1,100}$/.test(id))return json(400,{error:'Valid post required'});if(!field)return json(400,{error:'Valid post preference required'});const enabled=Object.prototype.hasOwnProperty.call(body,'enabled')?body.enabled===true:body.hidden!==false;await db.send(new UpdateItemCommand({TableName:process.env.SETTINGS_TABLE,Key:key,UpdateExpression:(enabled?'ADD':'DELETE')+' #field :p',ExpressionAttributeNames:{'#field':field},ExpressionAttributeValues:{':p':{SS:[id]}}}));return json(200,{preference,enabled});}
          const decodeXml=value=>value.replace(/<!\[CDATA\[|\]\]>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          async function news(event){const interest=String(event.queryStringParameters?.interest||'music').toLowerCase();const topics={music:['music industry','new music releases','hip hop music','electronic music','live music','music business'],top:['top stories'],entertainment:['entertainment'],technology:['technology'],sports:['sports'],business:['business']};if(!topics[interest])return json(400,{error:'Unsupported news interest'});const load=query=>new Promise((resolve,reject)=>{const feedUrl='https://news.google.com/rss/search?q='+encodeURIComponent(query)+'&hl=en-US&gl=US&ceid=US:en';const request=https.get(feedUrl,{headers:{'user-agent':'DanzStak/1.0'}},response=>{let data='';response.setEncoding('utf8');response.on('data',chunk=>{if(data.length<1048576)data+=chunk;});response.on('end',()=>response.statusCode===200?resolve(data):reject(new Error('News upstream failed')));});request.setTimeout(5000,()=>request.destroy(new Error('News timeout')));request.on('error',reject);});const feeds=await Promise.allSettled(topics[interest].map(load));const seen=new Set(),items=[];for(const result of feeds){if(result.status!=='fulfilled')continue;for(const match of result.value.matchAll(/<item>([\s\S]*?)<\/item>/g)){const block=match[1],read=tag=>decodeXml((block.match(new RegExp('<'+tag+'>([\\s\\S]*?)<\\/'+tag+'>'))||[])[1]||'');const title=read('title').replace(/\s+-\s+[^-]+$/,'').trim(),source=read('source').trim(),url=read('link').trim(),key=title.toLowerCase();if(!title||!/^https:\/\//.test(url)||seen.has(key))continue;seen.add(key);items.push({title:title.slice(0,240),source:source.slice(0,100),url});if(items.length>=50)break;}if(items.length>=50)break;}return {statusCode:200,headers:{'content-type':'application/json','cache-control':'private, max-age=300'},body:JSON.stringify({interest,items})};}          exports.handler=async event=>{try{const key=event.requestContext?.http?.method+' '+event.rawPath;if(key==='POST /auth/refresh')return await refreshSession(event);const user=await identity(event);if(!user)return json(401,{error:'Authentication required'});if(key==='GET /news')return await news(event);if(key==='GET /push/key')return json(200,{publicKey:await getVapidPublicKey()});if(key==='POST /push/subscribe')return await savePushSubscription(event,user);if(key==='DELETE /push/subscribe')return await removePushSubscription(event,user);if(key.endsWith(' /settings/posts'))return await postVisibility(event,user);if(key==='POST /calls/signal')return await send(event,user);if(key==='GET /calls/inbox')return await inbox(user);if(key==='POST /calls/ack')return await ack(event,user);if(key==='POST /calls/presence')return await presence(user);if(key==='GET /calls/directory')return await directory(user);if(key==='GET /settings/presence')return await getPresenceSetting(user);if(key==='POST /settings/presence')return await setPresenceSetting(event,user);if(key==='POST /friends/request')return await friendRequest(event,user);if(key==='POST /friends/respond')return await friendRespond(event,user);if(key==='GET /friends')return await getFriends(user);if(key==='GET /profiles')return await getProfile(event,user);if(key==='POST /profiles')return await updateProfile(event,user);if(key==='GET /notifications')return await notifications(user);if(key==='POST /messages')return await sendMessage(event,user);if(key==='GET /messages')return await getMessages(event,user);if(key==='POST /messages/delete')return await deleteConversation(event,user);if(key==='GET /conversations')return await getConversations(user);if(key==='POST /groups/membership')return await groupMembership(event,user);if(key==='POST /stories')return await createStory(event,user);if(key==='GET /stories')return await getStories(user);if(key.startsWith('DELETE /stories/'))return await deleteStory(event,user);return json(404,{error:'Not found'});}catch(error){console.error(error);return json(500,{error:'Service unavailable'});}};
