          };
  ActivityPushStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ActivityPushOutboxTable.StreamArn
      FunctionName: !Ref SignalingFunction
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      MaximumRetryAttempts: 8
      BisectBatchOnFunctionError: true
      FunctionResponseTypes: [ReportBatchItemFailures]
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"status":{"S":["pending"]}}}}'
  StoryCleanupRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: A scheduled worker removes expired Story records and their dedicated media without receiving access to member messaging or profile data.
        must: [Keep permissions limited to scanning/deleting Stories and deleting Story media.]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DanzStakExpiredStoryCleanup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt StoriesTable.Arn
              - Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub '${MediaBucket.Arn}/stories/*'
  StoryCleanupFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: DynamoDB TTL can be delayed; this worker enforces Story record and media cleanup every 15 minutes while preserving Reels.
        must: [Never delete Reel records., Never delete media outside the stories prefix.]
    Properties:
      FunctionName: DANZSTAK-Expired-Story-Cleanup
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt StoryCleanupRole.Arn
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          STORIES_TABLE: !Ref StoriesTable
          MEDIA_BUCKET: !Ref MediaBucket
      Code:
        ZipFile: |
          const {DynamoDBClient,ScanCommand,DeleteItemCommand}=require('@aws-sdk/client-dynamodb');
          const {S3Client,DeleteObjectCommand}=require('@aws-sdk/client-s3');
          const db=new DynamoDBClient({}),s3=new S3Client({});
          exports.handler=async()=>{const current=Math.floor(Date.now()/1000),expired=[];let ExclusiveStartKey;do{const page=await db.send(new ScanCommand({TableName:process.env.STORIES_TABLE,ProjectionExpression:'storyId,kind,createdAt,expiresAt,mediaKey',ConsistentRead:true,ExclusiveStartKey}));for(const item of page.Items||[]){if(item.kind?.S==='reel'||!item.mediaKey?.S)continue;const created=Date.parse(item.createdAt?.S||''),expiry=Number(item.expiresAt?.N||0)||(Number.isFinite(created)?Math.floor(created/1000)+86400:0);if(expiry<=current)expired.push(item);}ExclusiveStartKey=page.LastEvaluatedKey;}while(ExclusiveStartKey);for(let offset=0;offset<expired.length;offset+=10)await Promise.all(expired.slice(offset,offset+10).map(async item=>{await db.send(new DeleteItemCommand({TableName:process.env.STORIES_TABLE,Key:{storyId:{S:item.storyId.S}}}));if(item.mediaKey.S.startsWith('stories/'))await s3.send(new DeleteObjectCommand({Bucket:process.env.MEDIA_BUCKET,Key:item.mediaKey.S}));}));return {cleaned:expired.length};};
  StoryCleanupRule:
    Type: AWS::Events::Rule
    Metadata:
      com.aws.cloudformation.Context:
        why: Runs Story cleanup independently of feed visits.
        must: [Keep the schedule limited to the dedicated Story cleanup worker.]
    Properties:
      Description: Remove expired DanzStak Stories and their dedicated media.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt StoryCleanupFunction.Arn
          Id: DanzStakStoryCleanup
  StoryCleanupInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StoryCleanupFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StoryCleanupRule.Arn
  SignalingIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SignalingFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000
  SignalRoute: {Type: AWS::ApiGatewayV2::Route, Properties: {ApiId: !Ref ApiId, RouteKey: POST /calls/signal, Target: !Sub 'integrations/${SignalingIntegration}'}}
