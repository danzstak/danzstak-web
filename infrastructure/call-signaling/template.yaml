          const coreHandler=exports.handler;
          exports.handler=async event=>{
            if(Array.isArray(event.Records)&&event.Records.some(record=>record.eventSource==='aws:dynamodb'))return activityPushBatch(event);
            if(!String(event.rawPath||'').startsWith('/plans'))return coreHandler(event);
            try{
              const method=event.requestContext?.http?.method,origin=event.headers?.origin||event.headers?.Origin||'';
              if(['POST','PATCH','DELETE'].includes(method)&&!['https://danzstak.com','https://www.danzstak.com'].includes(origin))return json(403,{error:'Forbidden origin'});
              const user=await identity(event);if(!user)return json(401,{error:'Authentication required'});
