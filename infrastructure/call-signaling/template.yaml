          async function callerInvites(user,sinceSeconds){return queryAll({TableName:process.env.CALL_INVITES_TABLE,IndexName:'ByCaller',KeyConditionExpression:'callerEmail = :c AND createdAt >= :since',ExpressionAttributeValues:{':c':{S:user.email},':since':{N:String(now()-sinceSeconds)}}},200);}
          async function createCallInvite(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const kind=body.kind==='video'?'video':'audio';if(!(await authenticatedCallingDevice(event,user)))return json(403,{error:'Register this device to invite someone to a call.',code:'CALL_DEVICE_REGISTRATION_REQUIRED'});const recent=await callerInvites(user,86400);if(recent.length>=INVITES_PER_DAY)return json(429,{error:'You sent 20 call invites today. Try again tomorrow.',code:'CALL_INVITE_DAILY_LIMIT'});if(recent.filter(inviteOpen).length>=OPEN_INVITES)return json(429,{error:'You already have 10 open call invites. Cancel one first.',code:'CALL_INVITE_OPEN_LIMIT'});const token=randomBytes(32).toString('base64url'),created=now(),inviteId=inviteTokenHash(token);await db.send(new PutItemCommand({TableName:process.env.CALL_INVITES_TABLE,Item:{inviteId:{S:inviteId},callerEmail:{S:user.email},callerId:{S:user.userId},kind:{S:kind},status:{S:'open'},createdAt:{N:String(created)},expiresAt:{N:String(created+INVITE_RING_SECONDS)},purgeAt:{N:String(created+INVITE_KEEP_SECONDS)}},ConditionExpression:'attribute_not_exists(inviteId)'}));return json(201,{inviteId,kind,url:'https://danzstak.com/answer.html?i='+token,expiresAt:isoAt(created+INVITE_RING_SECONDS)});}
