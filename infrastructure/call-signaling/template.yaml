Description: DanzStak social messaging and call signaling with server-side sessions and per-contact authorization.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  ApiId:
    Type: String
    Default: 0872gqal4m
  SessionsTable:
    Type: String
    Default: DANZSTAK-Sessions
  UserPoolId:
    Type: String
    Default: us-east-1_qA4B46ilc
  PostsTable:
    Type: String
    Default: DANZSTAK-Posts
Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDedicatedStoryMedia
            Status: Enabled
            Prefix: stories/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['content-type']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['https://danzstak.com', 'https://www.danzstak.com']
            ExposedHeaders: [ETag]
            MaxAge: 3600
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}
  CallSignalsTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      guard:
        SuppressedRules: [DYNAMODB_PITR_ENABLED]
      com.aws.cloudformation.Context:
        why: Ephemeral call signals and presence expire automatically and must not be restored as current activity.
        must: [Keep TTL expiration enabled.]
    Properties:
      TableName: DANZSTAK-CallSignals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipientEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: recipientEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  PresenceTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      guard:
        SuppressedRules: [DYNAMODB_PITR_ENABLED]
      com.aws.cloudformation.Context:
        why: Ephemeral call signals and presence expire automatically and must not be restored as current activity.
        must: [Keep TTL expiration enabled.]
    Properties:
      TableName: DANZSTAK-Presence
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-PushSubscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: endpointHash
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: endpointHash
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  ActivityPushOutboxTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Durable activity events keep in-app notifications and optional phone alerts consistent without exposing post text on a lock screen.
        must:
          - Keep point-in-time recovery and encryption enabled.
          - Treat stream delivery as at-least-once and retain endpoint-level deduplication.
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-ActivityPushOutbox
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  CallingDevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Registered calling installations are member security records and must survive stack updates.
        must: [Keep point-in-time recovery and encryption enabled., Keep registration tokens hashed and account-scoped.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-CallingDevices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: deviceId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  VapidSigningKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: DanzStak Web Push VAPID signing key
      Enabled: true
      EnableKeyRotation: false
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAMPolicies
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: kms:*
            Resource: '*'
  VapidSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/danzstak-web-push-vapid
      TargetKeyId: !Ref VapidSigningKey
  FriendsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-Friends
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: friendEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: friendEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  StoriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Story and Reel records share storage; Stories expire after 24h while Reels remain until owner deletion.
        must: [Keep point-in-time recovery and encryption enabled., Keep TTL enabled and preserve the 24h Story-only cleanup boundary.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-Stories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: storyId
          AttributeType: S
      KeySchema:
        - AttributeName: storyId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  GroupMembersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-GroupMembers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: groupId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DanzStak-Messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: messageId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  MessageReactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DanzStak-MessageReactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: reactionId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: reactionId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DanzStak-Conversations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: contactEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: contactEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  PlansTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Private two-person plans and RSVP history must survive application releases.
        must: [Keep point-in-time recovery and encryption enabled., Keep participant authorization in the Lambda.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DanzStak-Plans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: planId
          AttributeType: S
        - AttributeName: participantEmail
          AttributeType: S
        - AttributeName: updatedKey
          AttributeType: S
      KeySchema:
        - AttributeName: planId
          KeyType: HASH
        - AttributeName: participantEmail
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ParticipantIndex
          KeySchema:
            - AttributeName: participantEmail
              KeyType: HASH
            - AttributeName: updatedKey
              KeyType: RANGE
          Projection: {ProjectionType: ALL}
      SSESpecification:
        SSEEnabled: true
  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DanzStak-UserSettings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  ProfileNamesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Case-insensitive public-name reservations prevent impersonation and confusing duplicate accounts.
        must: [Keep reservations atomic with profile saves and retain the table during stack changes.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DanzStak-ProfileNames
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: claim
          AttributeType: S
      KeySchema:
        - AttributeName: claim
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  SignalingRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Saved history and message reactions require individual record reads as well as conversation queries.
        must:
          - Scope data access to the named application tables.
          - Keep contact authorization in the Lambda before exposing history or accepting call signals.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DanzstakCallSignalingData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SessionsTable}
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt CallSignalsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt PresenceTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt PushSubscriptionsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt ActivityPushOutboxTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PostsTable}
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/DANZSTAK-EngagementNotifications
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:ListStreams]
                Resource: !GetAtt ActivityPushOutboxTable.StreamArn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt CallingDevicesTable.Arn
              - Effect: Allow
                Action: [kms:GetPublicKey, kms:Sign]
                Resource: !GetAtt VapidSigningKey.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt FriendsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt GroupMembersTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt MessagesTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt MessageReactionsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt ConversationsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource:
                  - !GetAtt PlansTable.Arn
                  - !Sub '${PlansTable.Arn}/index/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan, dynamodb:UpdateItem]
                Resource: !GetAtt UserSettingsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt ProfileNamesTable.Arn
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt UserSettingsTable.Arn
                  - !GetAtt ProfileNamesTable.Arn
                  - !GetAtt CallingDevicesTable.Arn
                  - !GetAtt CallSignalsTable.Arn
                  - !GetAtt PlansTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt StoriesTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${MediaBucket.Arn}/*'
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:us-east-1:${AWS::AccountId}:userpool/${UserPoolId}
  SignalingFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Upload purpose separates permanent media from Stories; opaque member links avoid putting email addresses in shared profile URLs.
        must:
          - Derive media ownership from the authenticated account.
          - Keep Story discard limited to temporary Story keys.
          - Do not fail committed profile saves when old media cleanup fails.
          - Preserve friend and shared-group authorization when resolving member links.
          - Preserve tagging consent when older clients omit it.
          - Reject non-site origins before processing state-changing requests.
          - Use public profile names or a neutral member label in all user-facing API fields, call copy, and push copy; keep account email addresses internal to routing and authorization.
          - Keep Story and Reel display labels aligned with saved public profile names or Cognito public names; never derive labels from email addresses.
          - Member discovery may expose only public profile names, public handles, avatars, opaque member IDs, relationship state, and privacy-respecting presence; never expose account email addresses.
    Properties:
      FunctionName: DANZSTAK-Call-Signaling
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SignalingRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          CALLS_TABLE: !Ref CallSignalsTable
          PRESENCE_TABLE: !Ref PresenceTable
          PUSH_SUBSCRIPTIONS_TABLE: !Ref PushSubscriptionsTable
          CALLING_DEVICES_TABLE: !Ref CallingDevicesTable
          VAPID_KEY_ID: !GetAtt VapidSigningKey.Arn
          FRIENDS_TABLE: !Ref FriendsTable
          GROUPS_TABLE: !Ref GroupMembersTable
          MESSAGES_TABLE: !Ref MessagesTable
          MESSAGE_REACTIONS_TABLE: !Ref MessageReactionsTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          PLANS_TABLE: !Ref PlansTable
          SETTINGS_TABLE: !Ref UserSettingsTable
          ACTIVITY_PUSH_OUTBOX_TABLE: !Ref ActivityPushOutboxTable
          ENGAGEMENT_NOTIFICATIONS_TABLE: DANZSTAK-EngagementNotifications
          POSTS_TABLE: !Ref PostsTable
          PROFILE_NAMES_TABLE: !Ref ProfileNamesTable
          STORIES_TABLE: !Ref StoriesTable
          MEDIA_BUCKET: !Ref MediaBucket
          SESSIONS_TABLE: !Ref SessionsTable
          USER_POOL_ID: !Ref UserPoolId
      Code:
        ZipFile: |
          const {createCipheriv,createECDH,createHash,createHmac,randomBytes,randomUUID,timingSafeEqual}=require('node:crypto');
          const https=require('node:https');
          const {DynamoDBClient,GetItemCommand,PutItemCommand,QueryCommand,DeleteItemCommand,ScanCommand,UpdateItemCommand,TransactWriteItemsCommand}=require('@aws-sdk/client-dynamodb');
          const {CognitoIdentityProviderClient,ListUsersCommand}=require('@aws-sdk/client-cognito-identity-provider');
          const {S3Client,DeleteObjectCommand}=require('@aws-sdk/client-s3');
          const {KMSClient,GetPublicKeyCommand,SignCommand}=require('@aws-sdk/client-kms');
          const db=new DynamoDBClient({});
          const cognito=new CognitoIdentityProviderClient({region:'us-east-1'});
          const s3=new S3Client({});
          const kms=new KMSClient({});
          const securityHeaders={'strict-transport-security':'max-age=63072000; includeSubDomains; preload','x-content-type-options':'nosniff','x-frame-options':'DENY','referrer-policy':'no-referrer'};
          const json=(status,body)=>({statusCode:status,headers:{...securityHeaders,'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify(body)});
          const now=()=>Math.floor(Date.now()/1000);
          async function scanAll(input,maximumItems=5000){const items=[];let ExclusiveStartKey;do{const page=await db.send(new ScanCommand({...input,ExclusiveStartKey}));items.push(...(page.Items||[]));ExclusiveStartKey=page.LastEvaluatedKey;}while(ExclusiveStartKey&&items.length<maximumItems);return items.slice(0,maximumItems);}
          async function queryAll(input,maximumItems=5000){const items=[];let ExclusiveStartKey;do{const page=await db.send(new QueryCommand({...input,ExclusiveStartKey}));items.push(...(page.Items||[]));ExclusiveStartKey=page.LastEvaluatedKey;}while(ExclusiveStartKey&&items.length<maximumItems);return items.slice(0,maximumItems);}
          async function mapLimit(items,limit,work){const results=new Array(items.length);let next=0;async function runner(){while(next<items.length){const index=next++;results[index]=await work(items[index],index);}}await Promise.all(Array.from({length:Math.min(limit,items.length)},runner));return results;}
          const b64url=value=>Buffer.from(value).toString('base64').replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
          const fromB64url=value=>Buffer.from(String(value).replace(/-/g,'+').replace(/_/g,'/'),'base64');
          const hkdfExpand=(prk,info,length)=>createHmac('sha256',prk).update(Buffer.concat([info,Buffer.from([1])])).digest().subarray(0,length);
          let vapidPublicKey='';
          async function getVapidPublicKey(){if(vapidPublicKey)return vapidPublicKey;const result=await kms.send(new GetPublicKeyCommand({KeyId:process.env.VAPID_KEY_ID})),point=Buffer.from(result.PublicKey).subarray(-65);if(point.length!==65||point[0]!==4)throw new Error('Invalid VAPID public key');vapidPublicKey=b64url(point);return vapidPublicKey;}
          function derToJose(input){const der=Buffer.from(input);let offset=der[1]&128?2+(der[1]&127):2;if(der[offset++]!==2)throw new Error('Invalid ECDSA signature');const rLength=der[offset++],r=der.subarray(offset,offset+rLength);offset+=rLength;if(der[offset++]!==2)throw new Error('Invalid ECDSA signature');const sLength=der[offset++],s=der.subarray(offset,offset+sLength),fixed=value=>{const trimmed=value[0]===0?value.subarray(1):value;if(trimmed.length>32)throw new Error('Invalid ECDSA integer');return Buffer.concat([Buffer.alloc(32-trimmed.length),trimmed]);};return Buffer.concat([fixed(r),fixed(s)]);}
          async function vapidAuthorization(endpoint){const publicKey=await getVapidPublicKey(),header=b64url(JSON.stringify({typ:'JWT',alg:'ES256'})),claims=b64url(JSON.stringify({aud:new URL(endpoint).origin,exp:now()+43200,sub:'mailto:support@danzstak.com'})),unsigned=`${header}.${claims}`,signed=await kms.send(new SignCommand({KeyId:process.env.VAPID_KEY_ID,Message:Buffer.from(unsigned),MessageType:'RAW',SigningAlgorithm:'ECDSA_SHA_256'}));return {authorization:`vapid t=${unsigned}.${b64url(derToJose(signed.Signature))}, k=${publicKey}`};}
          function encryptPush(subscription,payload){const clientPublic=fromB64url(subscription.keys.p256dh),auth=fromB64url(subscription.keys.auth);if(clientPublic.length!==65||auth.length!==16)throw new Error('Invalid push subscription keys');const ecdh=createECDH('prime256v1');ecdh.generateKeys();const serverPublic=ecdh.getPublicKey(),shared=ecdh.computeSecret(clientPublic),keyPrk=createHmac('sha256',auth).update(shared).digest(),keyInfo=Buffer.concat([Buffer.from('WebPush: info\0'),clientPublic,serverPublic]),ikm=hkdfExpand(keyPrk,keyInfo,32),salt=randomBytes(16),prk=createHmac('sha256',salt).update(ikm).digest(),cek=hkdfExpand(prk,Buffer.from('Content-Encoding: aes128gcm\0'),16),nonce=hkdfExpand(prk,Buffer.from('Content-Encoding: nonce\0'),12),plaintext=Buffer.concat([Buffer.from(JSON.stringify(payload)),Buffer.from([2])]),cipher=createCipheriv('aes-128-gcm',cek,nonce),encrypted=Buffer.concat([cipher.update(plaintext),cipher.final(),cipher.getAuthTag()]),recordSize=Buffer.alloc(4);recordSize.writeUInt32BE(4096);return Buffer.concat([salt,recordSize,Buffer.from([serverPublic.length]),serverPublic,encrypted]);}
          const pushEndpointAllowed=endpoint=>{try{const url=new URL(endpoint);return url.protocol==='https:'&&(['fcm.googleapis.com','updates.push.services.mozilla.com','web.push.apple.com'].includes(url.hostname)||url.hostname.endsWith('.notify.windows.com'));}catch{return false;}};
