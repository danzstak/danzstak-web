AWSTemplateFormatVersion: '2010-09-09'
Description: Authenticated DANZSTAK WebRTC call signaling
Parameters:
  ApiId:
    Type: String
    Default: 0872gqal4m
  SessionsTable:
    Type: String
    Default: DANZSTAK-Sessions
  UserPoolId:
    Type: String
    Default: us-east-1_qA4B46ilc
Resources:
  CallSignalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-CallSignals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipientEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: recipientEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  PresenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Presence
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  FriendsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Friends
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: friendEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: friendEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  StoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Stories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: storyId
          AttributeType: S
      KeySchema:
        - AttributeName: storyId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  GroupMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-GroupMembers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: groupId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  SignalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DanzstakCallSignalingData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SessionsTable}
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt CallSignalsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan]
                Resource: !GetAtt PresenceTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt FriendsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt GroupMembersTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan]
                Resource: !GetAtt StoriesTable.Arn
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:us-east-1:${AWS::AccountId}:userpool/${UserPoolId}
  SignalingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DANZSTAK-Call-Signaling
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SignalingRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          CALLS_TABLE: !Ref CallSignalsTable
          PRESENCE_TABLE: !Ref PresenceTable
          FRIENDS_TABLE: !Ref FriendsTable
          GROUPS_TABLE: !Ref GroupMembersTable
          STORIES_TABLE: !Ref StoriesTable
          SESSIONS_TABLE: !Ref SessionsTable
          USER_POOL_ID: !Ref UserPoolId
      Code:
        ZipFile: |
          const {createHash,randomUUID}=require('node:crypto');
          const {DynamoDBClient,GetItemCommand,PutItemCommand,QueryCommand,DeleteItemCommand,ScanCommand,UpdateItemCommand}=require('@aws-sdk/client-dynamodb');
          const {CognitoIdentityProviderClient,ListUsersCommand}=require('@aws-sdk/client-cognito-identity-provider');
          const db=new DynamoDBClient({});
          const cognito=new CognitoIdentityProviderClient({region:'us-east-1'});
          const json=(status,body)=>({statusCode:status,headers:{'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify(body)});
          const now=()=>Math.floor(Date.now()/1000);
          const attr=(user,name)=>user?.Attributes?.find(x=>x.Name===name)?.Value||'';
          function cookie(event,name){const all=[...(event.cookies||[])];if(event.headers?.cookie)all.push(...event.headers.cookie.split(';'));for(const part of all){const [key,...rest]=part.trim().split('=');if(key===name)return decodeURIComponent(rest.join('='));}return '';}
          async function identity(event){const raw=cookie(event,'__Host-danzstak_session');if(!/^[a-f0-9]{64}$/.test(raw))return null;const sessionId=createHash('sha256').update(raw).digest('hex');const found=await db.send(new GetItemCommand({TableName:process.env.SESSIONS_TABLE,Key:{sessionId:{S:sessionId}},ConsistentRead:true}));const item=found.Item;if(!item||item.type?.S!=='user_session'||Number(item.expiresAt?.N||0)<=now())return null;const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`sub = "${item.userId.S}"`,Limit:1}));const user=users.Users?.[0];const email=attr(user,'email').trim().toLowerCase();return email?{email,userId:item.userId.S}:null;}
          async function registered(email){const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1}));return Boolean(users.Users?.length);}
          async function groupIds(email){const out=await db.send(new QueryCommand({TableName:process.env.GROUPS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:email}},Limit:100,ConsistentRead:true}));return new Set((out.Items||[]).map(x=>x.groupId.S));}
          async function canContact(sender,recipient){const friendship=await db.send(new GetItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:sender},friendEmail:{S:recipient}},ConsistentRead:true}));if(friendship.Item?.status?.S==='friends')return true;const [a,b]=await Promise.all([groupIds(sender),groupIds(recipient)]);return [...a].some(id=>b.has(id));}
          async function send(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const recipientEmail=String(body.recipientEmail||'').trim().toLowerCase();const mode=String(body.mode||'');const signalType=String(body.signalType||'');const callId=String(body.callId||'');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipientEmail)||recipientEmail.length>254)return json(400,{error:'Valid recipient required'});if(recipientEmail===user.email)return json(400,{error:'Choose another account'});if(!['text','phone','video'].includes(mode)||!['offer','answer','hangup'].includes(signalType)||!/^[a-f0-9-]{36}$/.test(callId))return json(400,{error:'Invalid call signal'});if(!(await canContact(user.email,recipientEmail)))return json(403,{error:'Only friends or members of the same group can message or call'});const payload=body.payload??null;const serialized=JSON.stringify(payload);if(serialized.length>110000)return json(413,{error:'Signal too large'});if(!(await registered(recipientEmail)))return json(404,{error:'DANZSTAK user not found'});const eventId=`${String(Date.now()).padStart(13,'0')}#${randomUUID()}`;await db.send(new PutItemCommand({TableName:process.env.CALLS_TABLE,Item:{recipientEmail:{S:recipientEmail},eventId:{S:eventId},senderEmail:{S:user.email},callId:{S:callId},mode:{S:mode},signalType:{S:signalType},payload:{S:serialized},createdAt:{S:new Date().toISOString()},expiresAt:{N:String(now()+120)}}}));return json(202,{accepted:true,eventId});}
          async function inbox(user){const out=await db.send(new QueryCommand({TableName:process.env.CALLS_TABLE,KeyConditionExpression:'recipientEmail = :r',ExpressionAttributeValues:{':r':{S:user.email}},Limit:20,ScanIndexForward:true,ConsistentRead:true}));return json(200,{events:(out.Items||[]).map(x=>({eventId:x.eventId.S,senderEmail:x.senderEmail.S,callId:x.callId.S,mode:x.mode.S,signalType:x.signalType.S,payload:JSON.parse(x.payload.S),createdAt:x.createdAt.S}))});}
          async function ack(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const ids=Array.isArray(body.eventIds)?body.eventIds.slice(0,20):[];for(const eventId of ids){if(typeof eventId==='string'&&eventId.length<100)await db.send(new DeleteItemCommand({TableName:process.env.CALLS_TABLE,Key:{recipientEmail:{S:user.email},eventId:{S:eventId}}}));}return json(200,{acknowledged:ids.length});}
          async function presence(user){await db.send(new PutItemCommand({TableName:process.env.PRESENCE_TABLE,Item:{email:{S:user.email},updatedAt:{N:String(now())},expiresAt:{N:String(now()+75)}}}));return json(200,{online:true});}
          async function directory(user){const [online,links,myGroups]=await Promise.all([db.send(new ScanCommand({TableName:process.env.PRESENCE_TABLE,FilterExpression:'expiresAt > :n',ExpressionAttributeValues:{':n':{N:String(now())}},Limit:50})),db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:user.email}},Limit:100})),groupIds(user.email)]);const states=Object.fromEntries((links.Items||[]).map(x=>[x.friendEmail.S,x.status.S]));const emails=(online.Items||[]).map(x=>x.email.S).filter(email=>email!==user.email).sort();const users=await Promise.all(emails.map(async email=>{const theirs=await groupIds(email);return {email,friendStatus:states[email]||'none',sharedGroup:[...myGroups].some(id=>theirs.has(id))};}));return json(200,{users});}
          async function groupMembership(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const groupId=String(body.groupId||'').trim();if(!/^[a-zA-Z0-9_-]{1,80}$/.test(groupId))return json(400,{error:'Valid group required'});if(body.joined===true){await db.send(new PutItemCommand({TableName:process.env.GROUPS_TABLE,Item:{userEmail:{S:user.email},groupId:{S:groupId},joinedAt:{S:new Date().toISOString()}}}));return json(200,{joined:true});}await db.send(new DeleteItemCommand({TableName:process.env.GROUPS_TABLE,Key:{userEmail:{S:user.email},groupId:{S:groupId}}}));return json(200,{joined:false});}
          async function friendRequest(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const target=String(body.email||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(target)||target===user.email)return json(400,{error:'Choose another user'});if(!(await registered(target)))return json(404,{error:'DANZSTAK user not found'});const createdAt=new Date().toISOString();await Promise.all([db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:user.email},friendEmail:{S:target},status:{S:'outgoing'},createdAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:target},friendEmail:{S:user.email},status:{S:'incoming'},createdAt:{S:createdAt}}}))]);return json(202,{requested:true});}
          async function friendRespond(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const requester=String(body.email||'').trim().toLowerCase();const accept=body.accept===true;if(!requester)return json(400,{error:'Requester required'});if(accept){const createdAt=new Date().toISOString();await Promise.all([db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:user.email},friendEmail:{S:requester},status:{S:'friends'},createdAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:requester},friendEmail:{S:user.email},status:{S:'friends'},createdAt:{S:createdAt}}}))]);}else{await Promise.all([db.send(new DeleteItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:user.email},friendEmail:{S:requester}}})),db.send(new DeleteItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:requester},friendEmail:{S:user.email}}}))]);}return json(200,{accepted:accept});}
          async function notifications(user){const out=await db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',FilterExpression:'#s = :incoming',ExpressionAttributeNames:{'#s':'status'},ExpressionAttributeValues:{':u':{S:user.email},':incoming':{S:'incoming'}},Limit:100,ConsistentRead:true}));return json(200,{notifications:(out.Items||[]).map(x=>({type:'friend_request',email:x.friendEmail.S,createdAt:x.createdAt?.S||''})).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))});}
          async function createStory(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const content=String(body.content||'').trim();if(!content||content.length>5000)return json(400,{error:'Story content required'});const createdAt=new Date().toISOString(),storyId=randomUUID();await db.send(new PutItemCommand({TableName:process.env.STORIES_TABLE,Item:{storyId:{S:storyId},userEmail:{S:user.email},content:{S:content},createdAt:{S:createdAt},expiresAt:{N:String(now()+86400)}}}));return json(201,{storyId,content,createdAt,expiresAt:now()+86400});}
          async function getStories(){const out=await db.send(new ScanCommand({TableName:process.env.STORIES_TABLE,FilterExpression:'expiresAt > :n',ExpressionAttributeValues:{':n':{N:String(now())}},Limit:50}));const stories=(out.Items||[]).map(x=>({storyId:x.storyId.S,userEmail:x.userEmail.S,content:x.content.S,createdAt:x.createdAt.S})).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return json(200,{stories});}
          async function refreshSession(event){const raw=cookie(event,'__Host-danzstak_session');if(!/^[a-f0-9]{64}$/.test(raw))return json(401,{error:'Authentication required'});const sessionId=createHash('sha256').update(raw).digest('hex'),expiresAt=now()+7200;try{await db.send(new UpdateItemCommand({TableName:process.env.SESSIONS_TABLE,Key:{sessionId:{S:sessionId}},UpdateExpression:'SET expiresAt = :e',ConditionExpression:'#t = :user AND expiresAt > :n',ExpressionAttributeNames:{'#t':'type'},ExpressionAttributeValues:{':e':{N:String(expiresAt)},':n':{N:String(now())},':user':{S:'user_session'}}}));}catch{return json(401,{error:'Authentication required'});}return {statusCode:200,headers:{'content-type':'application/json','cache-control':'no-store'},cookies:[`__Host-danzstak_session=${raw}; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=7200`],body:JSON.stringify({authenticated:true,idleTimeoutSeconds:7200})};}
          exports.handler=async event=>{try{const key=event.requestContext?.http?.method+' '+event.rawPath;if(key==='POST /auth/refresh')return await refreshSession(event);const user=await identity(event);if(!user)return json(401,{error:'Authentication required'});if(key==='POST /calls/signal')return await send(event,user);if(key==='GET /calls/inbox')return await inbox(user);if(key==='POST /calls/ack')return await ack(event,user);if(key==='POST /calls/presence')return await presence(user);if(key==='GET /calls/directory')return await directory(user);if(key==='POST /friends/request')return await friendRequest(event,user);if(key==='POST /friends/respond')return await friendRespond(event,user);if(key==='GET /notifications')return await notifications(user);if(key==='POST /groups/membership')return await groupMembership(event,user);if(key==='POST /stories')return await createStory(event,user);if(key==='GET /stories')return await getStories();return json(404,{error:'Not found'});}catch(error){console.error(error);return json(500,{error:'Service unavailable'});}};
  SignalingIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SignalingFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000
  SignalRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /calls/signal
      Target: !Sub integrations/${SignalingIntegration}
  InboxRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /calls/inbox
      Target: !Sub integrations/${SignalingIntegration}
  AckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /calls/ack
      Target: !Sub integrations/${SignalingIntegration}
  PresenceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /calls/presence
      Target: !Sub integrations/${SignalingIntegration}
  DirectoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /calls/directory
      Target: !Sub integrations/${SignalingIntegration}
  FriendRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /friends/request
      Target: !Sub integrations/${SignalingIntegration}
  FriendRespondRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /friends/respond
      Target: !Sub integrations/${SignalingIntegration}
  NotificationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /notifications
      Target: !Sub integrations/${SignalingIntegration}
  GroupMembershipRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /groups/membership
      Target: !Sub integrations/${SignalingIntegration}
  CreateStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /stories
      Target: !Sub integrations/${SignalingIntegration}
  GetStoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /stories
      Target: !Sub integrations/${SignalingIntegration}
  RefreshSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /auth/refresh
      Target: !Sub integrations/${SignalingIntegration}
  SignalingInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/calls/*
  FriendInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/friends/*
  GroupInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/groups/*
  NotificationsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/GET/notifications
  StoriesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/stories
  RefreshSessionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/auth/refresh
Outputs:
  SignalsTable:
    Value: !Ref CallSignalsTable
