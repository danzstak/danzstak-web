AWSTemplateFormatVersion: '2010-09-09'
Description: Authenticated DanzStak messaging and WebRTC signaling — encrypted persistent chats with friend or shared-group authorization
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  ApiId:
    Type: String
    Default: 0872gqal4m
  SessionsTable:
    Type: String
    Default: DANZSTAK-Sessions
  UserPoolId:
    Type: String
    Default: us-east-1_qA4B46ilc
Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['content-type']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['https://danzstak.com', 'https://www.danzstak.com']
            ExposedHeaders: [ETag]
            MaxAge: 3600
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}
  CallSignalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-CallSignals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipientEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: recipientEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  PresenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Presence
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  FriendsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DANZSTAK-Friends
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: friendEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: friendEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  StoriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DANZSTAK-Stories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: storyId
          AttributeType: S
      KeySchema:
        - AttributeName: storyId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  GroupMembersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DANZSTAK-GroupMembers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: groupId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DanzStak-Messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: messageId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DanzStak-Conversations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: contactEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: contactEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DanzStak-UserSettings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  SignalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DanzstakCallSignalingData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SessionsTable}
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt CallSignalsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt PresenceTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt FriendsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt GroupMembersTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt MessagesTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt ConversationsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt UserSettingsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt StoriesTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${MediaBucket.Arn}/*'
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:us-east-1:${AWS::AccountId}:userpool/${UserPoolId}
  SignalingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DANZSTAK-Call-Signaling
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SignalingRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          CALLS_TABLE: !Ref CallSignalsTable
          PRESENCE_TABLE: !Ref PresenceTable
          FRIENDS_TABLE: !Ref FriendsTable
          GROUPS_TABLE: !Ref GroupMembersTable
          MESSAGES_TABLE: !Ref MessagesTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          SETTINGS_TABLE: !Ref UserSettingsTable
          STORIES_TABLE: !Ref StoriesTable
          MEDIA_BUCKET: !Ref MediaBucket
          SESSIONS_TABLE: !Ref SessionsTable
          USER_POOL_ID: !Ref UserPoolId
      Code:
        ZipFile: |
          const {createHash,createHmac,randomUUID}=require('node:crypto');
          const https=require('node:https');
          const {DynamoDBClient,GetItemCommand,PutItemCommand,QueryCommand,DeleteItemCommand,ScanCommand,UpdateItemCommand}=require('@aws-sdk/client-dynamodb');
          const {CognitoIdentityProviderClient,ListUsersCommand}=require('@aws-sdk/client-cognito-identity-provider');
          const {S3Client,DeleteObjectCommand}=require('@aws-sdk/client-s3');
          const db=new DynamoDBClient({});
          const cognito=new CognitoIdentityProviderClient({region:'us-east-1'});
          const s3=new S3Client({});
          const securityHeaders={'strict-transport-security':'max-age=63072000; includeSubDomains; preload','x-content-type-options':'nosniff','x-frame-options':'DENY','referrer-policy':'no-referrer'};
          const json=(status,body)=>({statusCode:status,headers:{...securityHeaders,'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify(body)});
          const now=()=>Math.floor(Date.now()/1000);
          const mediaTypes={'image/jpeg':['image','jpg'],'image/png':['image','png'],'image/webp':['image','webp'],'image/gif':['image','gif'],'video/mp4':['video','mp4'],'video/webm':['video','webm'],'video/quicktime':['video','mov']};
          const enc=value=>encodeURIComponent(value).replace(/[!'()*]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());
          const hmac=(key,value,encoding)=>createHmac('sha256',key).update(value).digest(encoding);
          function signedMediaUrl(method,key,expires=900){const region=process.env.AWS_REGION,bucket=process.env.MEDIA_BUCKET,access=process.env.AWS_ACCESS_KEY_ID,secret=process.env.AWS_SECRET_ACCESS_KEY,token=process.env.AWS_SESSION_TOKEN,date=new Date(),stamp=date.toISOString().replace(/[:-]|\.\d{3}/g,''),day=stamp.slice(0,8),scope=`${day}/${region}/s3/aws4_request`,host=`${bucket}.s3.${region}.amazonaws.com`,uri='/'+key.split('/').map(enc).join('/'),query=[['X-Amz-Algorithm','AWS4-HMAC-SHA256'],['X-Amz-Credential',`${access}/${scope}`],['X-Amz-Date',stamp],['X-Amz-Expires',String(expires)],['X-Amz-Security-Token',token],['X-Amz-SignedHeaders','host']].sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>`${enc(k)}=${enc(v)}`).join('&'),canonical=`${method}\n${uri}\n${query}\nhost:${host}\n\nhost\nUNSIGNED-PAYLOAD`,toSign=`AWS4-HMAC-SHA256\n${stamp}\n${scope}\n${createHash('sha256').update(canonical).digest('hex')}`,signing=hmac(hmac(hmac(hmac('AWS4'+secret,day),region),'s3'),'aws4_request'),signature=hmac(signing,toSign,'hex');return `https://${host}${uri}?${query}&X-Amz-Signature=${signature}`;}
          const ownerPrefix=user=>createHash('sha256').update(user.email).digest('hex').slice(0,24);
          const attr=(user,name)=>user?.Attributes?.find(x=>x.Name===name)?.Value||'';
          async function publicProfile(email,account){const settings=await db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:email}},ConsistentRead:true})),item=settings.Item;return {name:item?.profileName?.S||attr(account,'name')||attr(account,'preferred_username')||email.split('@')[0],picture:item?.profileAvatarKey?.S?signedMediaUrl('GET',item.profileAvatarKey.S,3600):attr(account,'picture')};}
          function cookie(event,name){const all=[...(event.cookies||[])];if(event.headers?.cookie)all.push(...event.headers.cookie.split(';'));for(const part of all){const [key,...rest]=part.trim().split('=');if(key===name)return decodeURIComponent(rest.join('='));}return '';}
          async function identity(event){const raw=cookie(event,'__Host-danzstak_session');if(!/^[a-f0-9]{64}$/.test(raw))return null;const sessionId=createHash('sha256').update(raw).digest('hex');const found=await db.send(new GetItemCommand({TableName:process.env.SESSIONS_TABLE,Key:{sessionId:{S:sessionId}},ConsistentRead:true}));const item=found.Item;if(!item||item.type?.S!=='user_session'||Number(item.expiresAt?.N||0)<=now())return null;const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`sub = "${item.userId.S}"`,Limit:1}));const user=users.Users?.[0];const email=attr(user,'email').trim().toLowerCase();return email?{email,userId:item.userId.S}:null;}
          async function registered(email){const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1}));return Boolean(users.Users?.length);}
          async function groupIds(email){const out=await db.send(new QueryCommand({TableName:process.env.GROUPS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:email}},Limit:100,ConsistentRead:true}));return new Set((out.Items||[]).map(x=>x.groupId.S));}
          async function canContact(sender,recipient){const friendship=await db.send(new GetItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:sender},friendEmail:{S:recipient}},ConsistentRead:true}));if(friendship.Item?.status?.S==='friends')return true;const [a,b]=await Promise.all([groupIds(sender),groupIds(recipient)]);return [...a].some(id=>b.has(id));}
          async function send(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const recipientEmail=String(body.recipientEmail||'').trim().toLowerCase();const mode=String(body.mode||'');const signalType=String(body.signalType||'');const callId=String(body.callId||'');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipientEmail)||recipientEmail.length>254)return json(400,{error:'Valid recipient required'});if(recipientEmail===user.email)return json(400,{error:'Choose another account'});if(!['text','phone','video'].includes(mode)||!['offer','answer','hangup'].includes(signalType)||!/^[a-f0-9-]{36}$/.test(callId))return json(400,{error:'Invalid call signal'});if(!(await canContact(user.email,recipientEmail)))return json(403,{error:'Only friends or members of the same group can message or call'});const payload=body.payload??null;const serialized=JSON.stringify(payload);if(serialized.length>110000)return json(413,{error:'Signal too large'});if(!(await registered(recipientEmail)))return json(404,{error:'DanzStak user not found'});const eventId=`${String(Date.now()).padStart(13,'0')}#${randomUUID()}`;await db.send(new PutItemCommand({TableName:process.env.CALLS_TABLE,Item:{recipientEmail:{S:recipientEmail},eventId:{S:eventId},senderEmail:{S:user.email},callId:{S:callId},mode:{S:mode},signalType:{S:signalType},payload:{S:serialized},createdAt:{S:new Date().toISOString()},expiresAt:{N:String(now()+120)}}}));return json(202,{accepted:true,eventId});}
          async function inbox(user){const out=await db.send(new QueryCommand({TableName:process.env.CALLS_TABLE,KeyConditionExpression:'recipientEmail = :r',ExpressionAttributeValues:{':r':{S:user.email}},Limit:20,ScanIndexForward:true,ConsistentRead:true}));return json(200,{events:(out.Items||[]).map(x=>({eventId:x.eventId.S,senderEmail:x.senderEmail.S,callId:x.callId.S,mode:x.mode.S,signalType:x.signalType.S,payload:JSON.parse(x.payload.S),createdAt:x.createdAt.S}))});}
          async function ack(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const ids=Array.isArray(body.eventIds)?body.eventIds.slice(0,20):[];for(const eventId of ids){if(typeof eventId==='string'&&eventId.length<100)await db.send(new DeleteItemCommand({TableName:process.env.CALLS_TABLE,Key:{recipientEmail:{S:user.email},eventId:{S:eventId}}}));}return json(200,{acknowledged:ids.length});}
          async function presence(user){const setting=await db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:user.email}},ConsistentRead:true}));if(setting.Item?.onlineVisible?.BOOL===false){await db.send(new DeleteItemCommand({TableName:process.env.PRESENCE_TABLE,Key:{email:{S:user.email}}}));return json(200,{online:false,visible:false});}await db.send(new PutItemCommand({TableName:process.env.PRESENCE_TABLE,Item:{email:{S:user.email},updatedAt:{N:String(now())},expiresAt:{N:String(now()+75)}}}));return json(200,{online:true,visible:true});}
          async function getPresenceSetting(user){const setting=await db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:user.email}},ConsistentRead:true}));return json(200,{onlineVisible:setting.Item?.onlineVisible?.BOOL!==false});}
          async function setPresenceSetting(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}if(typeof body.onlineVisible!=='boolean')return json(400,{error:'Online visibility required'});await db.send(new UpdateItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:user.email}},UpdateExpression:'SET onlineVisible = :v, updatedAt = :u',ExpressionAttributeValues:{':v':{BOOL:body.onlineVisible},':u':{S:new Date().toISOString()}}}));if(!body.onlineVisible)await db.send(new DeleteItemCommand({TableName:process.env.PRESENCE_TABLE,Key:{email:{S:user.email}}}));return json(200,{onlineVisible:body.onlineVisible});}
          async function directory(user){const [online,links,myGroups,members]=await Promise.all([db.send(new ScanCommand({TableName:process.env.PRESENCE_TABLE,FilterExpression:'expiresAt > :n',ExpressionAttributeValues:{':n':{N:String(now())}},Limit:100})),db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:user.email}},Limit:100})),groupIds(user.email),db.send(new ScanCommand({TableName:process.env.GROUPS_TABLE,Limit:250}))]);const states=Object.fromEntries((links.Items||[]).map(x=>[x.friendEmail.S,x.status.S])),onlineEmails=new Set((online.Items||[]).map(x=>x.email.S)),emails=new Set([...onlineEmails,...(links.Items||[]).filter(x=>x.status.S==='friends').map(x=>x.friendEmail.S),...(members.Items||[]).filter(x=>myGroups.has(x.groupId.S)).map(x=>x.userEmail.S)]);emails.delete(user.email);const users=await Promise.all([...emails].sort().map(async email=>{const [theirs,accounts]=await Promise.all([groupIds(email),cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1}))]),profile=await publicProfile(email,accounts.Users?.[0]);return {email,...profile,online:onlineEmails.has(email),friendStatus:states[email]||'none',sharedGroup:[...myGroups].some(id=>theirs.has(id))};}));return json(200,{users});}          async function groupMembership(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}if(body.action==='list')return json(200,{groupIds:[...await groupIds(user.email)]});const groupId=String(body.groupId||'').trim();if(!/^[a-zA-Z0-9_-]{1,80}$/.test(groupId))return json(400,{error:'Valid group required'});if(body.joined===true){await db.send(new PutItemCommand({TableName:process.env.GROUPS_TABLE,Item:{userEmail:{S:user.email},groupId:{S:groupId},joinedAt:{S:new Date().toISOString()}}}));return json(200,{joined:true});}await db.send(new DeleteItemCommand({TableName:process.env.GROUPS_TABLE,Key:{userEmail:{S:user.email},groupId:{S:groupId}}}));return json(200,{joined:false});}
          async function friendRequest(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const target=String(body.email||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(target)||target===user.email)return json(400,{error:'Choose another user'});if(!(await registered(target)))return json(404,{error:'DanzStak user not found'});const createdAt=new Date().toISOString();await Promise.all([db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:user.email},friendEmail:{S:target},status:{S:'outgoing'},createdAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:target},friendEmail:{S:user.email},status:{S:'incoming'},createdAt:{S:createdAt}}}))]);return json(202,{requested:true});}
          async function friendRespond(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const requester=String(body.email||'').trim().toLowerCase();const accept=body.accept===true;if(!requester)return json(400,{error:'Requester required'});if(accept){const createdAt=new Date().toISOString();await Promise.all([db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:user.email},friendEmail:{S:requester},status:{S:'friends'},createdAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:requester},friendEmail:{S:user.email},status:{S:'friends'},createdAt:{S:createdAt}}}))]);}else{await Promise.all([db.send(new DeleteItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:user.email},friendEmail:{S:requester}}})),db.send(new DeleteItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:requester},friendEmail:{S:user.email}}}))]);}return json(200,{accepted:accept});}
          async function getFriends(user){const out=await db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',FilterExpression:'#s = :friends',ExpressionAttributeNames:{'#s':'status'},ExpressionAttributeValues:{':u':{S:user.email},':friends':{S:'friends'}},Limit:100,ConsistentRead:true}));const friends=await Promise.all((out.Items||[]).map(async x=>{const email=x.friendEmail.S,users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1})),profile=await publicProfile(email,users.Users?.[0]);return {email,...profile,connectedAt:x.createdAt?.S||''};}));return json(200,{friends:friends.sort((a,b)=>a.name.localeCompare(b.name))});}
          const profileString=(item,key,max='')=>String(item?.[key]?.S||'').slice(0,max||undefined);
          const profileMediaUrl=(item,key)=>item?.[key]?.S?signedMediaUrl('GET',item[key].S,3600):'';
          async function getProfile(event,user){const email=String(event.queryStringParameters?.email||user.email).trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return json(400,{error:'Valid user required'});if(email!==user.email&&!(await canContact(user.email,email)))return json(403,{error:'Profile available to friends and group members'});const [users,settings]=await Promise.all([cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1})),db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:email}},ConsistentRead:true}))]),account=users.Users?.[0],item=settings.Item;if(!account)return json(404,{error:'User not found'});return json(200,{profile:{cloudProfile:true,email,name:profileString(item,'profileName',80)||attr(account,'name')||attr(account,'preferred_username')||email.split('@')[0],handle:profileString(item,'profileHandle',24)||attr(account,'preferred_username')||email.split('@')[0],bio:profileString(item,'profileBio',160),location:profileString(item,'profileLocation',80),work:profileString(item,'profileWork',100),website:profileString(item,'profileWebsite',200),picture:profileMediaUrl(item,'profileAvatarKey')||attr(account,'picture'),cover:profileMediaUrl(item,'profileCoverKey'),avatarKey:email===user.email?profileString(item,'profileAvatarKey',200):undefined,coverKey:email===user.email?profileString(item,'profileCoverKey',200):undefined,coverX:Number(item?.profileCoverX?.N||50),coverY:Number(item?.profileCoverY?.N||50),coverFit:item?.profileCoverFit?.BOOL===true}});}
