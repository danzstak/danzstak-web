          exports.handler=async event=>{try{const method=event.requestContext?.http?.method,key=method+' '+event.rawPath;if(['POST','PUT','PATCH','DELETE'].includes(method)&&!['https://danzstak.com','https://www.danzstak.com'].includes(event.headers?.origin||event.headers?.Origin))return json(403,{error:'Forbidden origin'});if(key==='POST /auth/refresh')return await refreshSession(event);const user=await identity(event);if(!user)return json(401,{error:'Authentication required'});if(key==='GET /news')return await news(event);if(key==='GET /people')return await peopleSearch(event,user);if(key==='GET /push/key')return json(200,{publicKey:await getVapidPublicKey()});if(key==='POST /push/subscribe')return await savePushSubscription(event,user);if(key==='DELETE /push/subscribe')return await removePushSubscription(event,user);if(key.endsWith(' /settings/posts'))return await postVisibility(event,user);if(key==='POST /calls/devices/challenge')return await createDeviceChallenge(user);if(key==='POST /calls/devices/register')return await registerCallingDevice(event,user);if(key==='GET /calls/devices')return await listCallingDevices(event,user);if(key==='PATCH /calls/devices')return await updateCallingDevice(event,user);if(key==='DELETE /calls/devices')return await revokeCallingDevice(event,user);if(key==='POST /calls/signal')return await send(event,user);if(key==='GET /calls/inbox')return await inbox(event,user);if(key==='POST /calls/ack')return await ack(event,user);if(key==='POST /calls/presence')return await presence(user);if(key==='GET /calls/directory')return await directory(user);if(key==='GET /settings/presence')return await getPresenceSetting(user);if(key==='POST /settings/presence')return await setPresenceSetting(event,user);if(key==='POST /friends/request')return await friendRequest(event,user);if(key==='POST /friends/respond')return await friendRespond(event,user);if(key==='POST /friends/remove')return await friendRemove(event,user);if(key==='POST /friends/block')ret