Parameters:
  ApiId:
    Type: String
    Default: 0872gqal4m
  SessionsTable:
    Type: String
    Default: DANZSTAK-Sessions
  UserPoolId:
    Type: String
    Default: us-east-1_qA4B46ilc
Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['content-type']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['https://danzstak.com', 'https://www.danzstak.com']
            ExposedHeaders: [ETag]
            MaxAge: 3600
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}
  CallSignalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-CallSignals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipientEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: recipientEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  PresenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Presence
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DANZSTAK-PushSubscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: endpointHash
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: endpointHash
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  VapidSigningKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: DanzStak Web Push VAPID signing key
      Enabled: true
      EnableKeyRotation: false
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAMPolicies
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: kms:*
            Resource: '*'
  VapidSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/danzstak-web-push-vapid
      TargetKeyId: !Ref VapidSigningKey
  FriendsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DANZSTAK-Friends
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: friendEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: friendEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  StoriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DANZSTAK-Stories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: storyId
          AttributeType: S
      KeySchema:
        - AttributeName: storyId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  GroupMembersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DANZSTAK-GroupMembers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: groupId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DanzStak-Messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: messageId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  MessageReactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DanzStak-MessageReactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: reactionId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: reactionId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DanzStak-Conversations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: contactEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: contactEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DanzStak-UserSettings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  SignalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DanzstakCallSignalingData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SessionsTable}
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt CallSignalsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt PresenceTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt PushSubscriptionsTable.Arn
              - Effect: Allow
                Action: [kms:GetPublicKey, kms:Sign]
                Resource: !GetAtt VapidSigningKey.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt FriendsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt GroupMembersTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt MessagesTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt MessageReactionsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt ConversationsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt UserSettingsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt StoriesTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${MediaBucket.Arn}/*'
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:us-east-1:${AWS::AccountId}:userpool/${UserPoolId}
  SignalingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DANZSTAK-Call-Signaling
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SignalingRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          CALLS_TABLE: !Ref CallSignalsTable
          PRESENCE_TABLE: !Ref PresenceTable
          PUSH_SUBSCRIPTIONS_TABLE: !Ref PushSubscriptionsTable
          VAPID_KEY_ID: !GetAtt VapidSigningKey.Arn
          FRIENDS_TABLE: !Ref FriendsTable
          GROUPS_TABLE: !Ref GroupMembersTable
          MESSAGES_TABLE: !Ref MessagesTable
          MESSAGE_REACTIONS_TABLE: !Ref MessageReactionsTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          SETTINGS_TABLE: !Ref UserSettingsTable
          STORIES_TABLE: !Ref StoriesTable
          MEDIA_BUCKET: !Ref MediaBucket
          SESSIONS_TABLE: !Ref SessionsTable
          USER_POOL_ID: !Ref UserPoolId
      Code:
        ZipFile: |
          const {createCipheriv,createECDH,createHash,createHmac,randomBytes,randomUUID}=require('node:crypto');
          const https=require('node:https');
          const {DynamoDBClient,GetItemCommand,PutItemCommand,QueryCommand,DeleteItemCommand,ScanCommand,UpdateItemCommand}=require('@aws-sdk/client-dynamodb');
          const {CognitoIdentityProviderClient,ListUsersCommand}=require('@aws-sdk/client-cognito-identity-provider');
          const {S3Client,DeleteObjectCommand}=require('@aws-sdk/client-s3');
          const {KMSClient,GetPublicKeyCommand,SignCommand}=require('@aws-sdk/client-kms');
          const db=new DynamoDBClient({});
          const cognito=new CognitoIdentityProviderClient({region:'us-east-1'});
          const s3=new S3Client({});
          const kms=new KMSClient({});
          const securityHeaders={'strict-transport-security':'max-age=63072000; includeSubDomains; preload','x-content-type-options':'nosniff','x-frame-options':'DENY','referrer-policy':'no-referrer'};
          const json=(status,body)=>({statusCode:status,headers:{...securityHeaders,'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify(body)});
          const now=()=>Math.floor(Date.now()/1000);
          const b64url=value=>Buffer.from(value).toString('base64').replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
          const fromB64url=value=>Buffer.from(String(value).replace(/-/g,'+').replace(/_/g,'/'),'base64');
          const hkdfExpand=(prk,info,length)=>createHmac('sha256',prk).update(Buffer.concat([info,Buffer.from([1])])).digest().subarray(0,length);
          let vapidPublicKey='';
          async function getVapidPublicKey(){if(vapidPublicKey)return vapidPublicKey;const result=await kms.send(new GetPublicKeyCommand({KeyId:process.env.VAPID_KEY_ID})),point=Buffer.from(result.PublicKey).subarray(-65);if(point.length!==65||point[0]!==4)throw new Error('Invalid VAPID public key');vapidPublicKey=b64url(point);return vapidPublicKey;}
          function derToJose(input){const der=Buffer.from(input);let offset=der[1]&128?2+(der[1]&127):2;if(der[offset++]!==2)throw new Error('Invalid ECDSA signature');const rLength=der[offset++],r=der.subarray(offset,offset+rLength);offset+=rLength;if(der[offset++]!==2)throw new Error('Invalid ECDSA signature');const sLength=der[offset++],s=der.subarray(offset,offset+sLength),fixed=value=>{const trimmed=value[0]===0?value.subarray(1):value;if(trimmed.length>32)throw new Error('Invalid ECDSA integer');return Buffer.concat([Buffer.alloc(32-trimmed.length),trimmed]);};return Buffer.concat([fixed(r),fixed(s)]);}
          async function vapidAuthorization(endpoint){const publicKey=await getVapidPublicKey(),header=b64url(JSON.stringify({typ:'JWT',alg:'ES256'})),claims=b64url(JSON.stringify({aud:new URL(endpoint).origin,exp:now()+43200,sub:'mailto:support@danzstak.com'})),unsigned=`${header}.${claims}`,signed=await kms.send(new SignCommand({KeyId:process.env.VAPID_KEY_ID,Message:Buffer.from(unsigned),MessageType:'RAW',SigningAlgorithm:'ECDSA_SHA_256'}));return {authorization:`vapid t=${unsigned}.${b64url(derToJose(signed.Signature))}, k=${publicKey}`};}
          function encryptPush(subscription,payload){const clientPublic=fromB64url(subscription.keys.p256dh),auth=fromB64url(subscription.keys.auth);if(clientPublic.length!==65||auth.length!==16)throw new Error('Invalid push subscription keys');const ecdh=createECDH('prime256v1');ecdh.generateKeys();const serverPublic=ecdh.getPublicKey(),shared=ecdh.computeSecret(clientPublic),keyPrk=createHmac('sha256',auth).update(shared).digest(),keyInfo=Buffer.concat([Buffer.from('WebPush: info\0'),clientPublic,serverPublic]),ikm=hkdfExpand(keyPrk,keyInfo,32),salt=randomBytes(16),prk=createHmac('sha256',salt).update(ikm).digest(),cek=hkdfExpand(prk,Buffer.from('Content-Encoding: aes128gcm\0'),16),nonce=hkdfExpand(prk,Buffer.from('Content-Encoding: nonce\0'),12),plaintext=Buffer.concat([Buffer.from(JSON.stringify(payload)),Buffer.from([2])]),cipher=createCipheriv('aes-128-gcm',cek,nonce),encrypted=Buffer.concat([cipher.update(plaintext),cipher.final(),cipher.getAuthTag()]),recordSize=Buffer.alloc(4);recordSize.writeUInt32BE(4096);return Buffer.concat([salt,recordSize,Buffer.from([serverPublic.length]),serverPublic,encrypted]);}
          const pushEndpointAllowed=endpoint=>{try{const url=new URL(endpoint);return url.protocol==='https:'&&(['fcm.googleapis.com','updates.push.services.mozilla.com','web.push.apple.com'].includes(url.hostname)||url.hostname.endsWith('.notify.windows.com'));}catch{return false;}};
          async function savePushSubscription(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const endpoint=String(body.endpoint||''),p256dh=String(body.keys?.p256dh||''),auth=String(body.keys?.auth||'');if(!pushEndpointAllowed(endpoint)||endpoint.length>2048||fromB64url(p256dh).length!==65||fromB64url(auth).length!==16)return json(400,{error:'Valid browser push subscription required'});const endpointHash=createHash('sha256').update(endpoint).digest('hex');await db.send(new PutItemCommand({TableName:process.env.PUSH_SUBSCRIPTIONS_TABLE,Item:{userEmail:{S:user.email},endpointHash:{S:endpointHash},subscription:{S:JSON.stringify({endpoint,keys:{p256dh,auth}})},createdAt:{S:new Date().toISOString()},expiresAt:{N:String(now()+7776000)}}}));return json(201,{subscribed:true});}
          async function removePushSubscription(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const endpoint=String(body.endpoint||'');if(!pushEndpointAllowed(endpoint))return json(400,{error:'Valid endpoint required'});await db.send(new DeleteItemCommand({TableName:process.env.PUSH_SUBSCRIPTIONS_TABLE,Key:{userEmail:{S:user.email},endpointHash:{S:createHash('sha256').update(endpoint).digest('hex')}}}));return json(200,{subscribed:false});}
          async function deliverPush(userEmail,subscription,payload,endpointHash){try{const body=encryptPush(subscription,payload),auth=await vapidAuthorization(subscription.endpoint);await new Promise((resolve,reject)=>{const request=https.request(subscription.endpoint,{method:'POST',headers:{Authorization:auth.authorization,'Content-Encoding':'aes128gcm','Content-Type':'application/octet-stream','Content-Length':body.length,TTL:'120',Urgency:'high'}},response=>{response.resume();if(response.statusCode===201||response.statusCode===202)return resolve();const error=new Error(`Push rejected: ${response.statusCode}`);error.statusCode=response.statusCode;reject(error);});request.setTimeout(5000,()=>request.destroy(new Error('Push timeout')));request.on('error',reject);request.end(body);});return true;}catch(error){if([404,410].includes(error.statusCode))await db.send(new DeleteItemCommand({TableName:process.env.PUSH_SUBSCRIPTIONS_TABLE,Key:{userEmail:{S:userEmail},endpointHash:{S:endpointHash}}})).catch(()=>{});console.error('Web Push delivery failed',error);return false;}}
          async function notifyCall(recipientEmail,senderEmail,mode,callId){const out=await db.send(new QueryCommand({TableName:process.env.PUSH_SUBSCRIPTIONS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:recipientEmail}},Limit:10}));await Promise.all((out.Items||[]).map(item=>deliverPush(recipientEmail,JSON.parse(item.subscription.S),{type:'call',title:'Incoming DanzStak call',body:`${senderEmail} is calling by ${mode}.`,tag:`call-${callId}`,url:`/messages.html?contact=${encodeURIComponent(senderEmail)}&answer=1`},item.endpointHash.S)));}
          async function notifyMessage(recipientEmail,senderEmail){const out=await db.send(new QueryCommand({TableName:process.env.PUSH_SUBSCRIPTIONS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:recipientEmail}},Limit:10})),tag=createHash('sha256').update(senderEmail).digest('hex').slice(0,16);await Promise.all((out.Items||[]).map(item=>deliverPush(recipientEmail,JSON.parse(item.subscription.S),{type:'message',title:'New DanzStak message',body:`${senderEmail} sent you a message.`,tag:`message-${tag}`,url:`/messages.html?contact=${encodeURIComponent(senderEmail)}`},item.endpointHash.S)));}
          async function notifyFriendRequest(recipientEmail,senderEmail){const out=await db.send(new QueryCommand({TableName:process.env.PUSH_SUBSCRIPTIONS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:recipientEmail}},Limit:10})),tag=createHash('sha256').update(senderEmail).digest('hex').slice(0,16);await Promise.all((out.Items||[]).map(item=>deliverPush(recipientEmail,JSON.parse(item.subscription.S),{type:'friend_request',title:'New DanzStak friend request',body:`${senderEmail} sent you a friend request.`,tag:`friend-${tag}`,url:'/feed.html#notifications'},item.endpointHash.S)));}
          const mediaTypes={'image/jpeg':['image','jpg'],'image/png':['image','png'],'image/webp':['image','webp'],'image/gif':['image','gif'],'video/mp4':['video','mp4'],'video/webm':['video','webm'],'video/quicktime':['video','mov']};
          const enc=value=>encodeURIComponent(value).replace(/[!'()*]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());
          const hmac=(key,value,encoding)=>createHmac('sha256',key).update(value).digest(encoding);
          function signedMediaUrl(method,key,expires=900){const region=process.env.AWS_REGION,bucket=process.env.MEDIA_BUCKET,access=process.env.AWS_ACCESS_KEY_ID,secret=process.env.AWS_SECRET_ACCESS_KEY,token=process.env.AWS_SESSION_TOKEN,date=new Date(),stamp=date.toISOString().replace(/[:-]|\.\d{3}/g,''),day=stamp.slice(0,8),scope=`${day}/${region}/s3/aws4_request`,host=`${bucket}.s3.${region}.amazonaws.com`,uri='/'+key.split('/').map(enc).join('/'),query=[['X-Amz-Algorithm','AWS4-HMAC-SHA256'],['X-Amz-Credential',`${access}/${scope}`],['X-Amz-Date',stamp],['X-Amz-Expires',String(expires)],['X-Amz-Security-Token',token],['X-Amz-SignedHeaders','host']].sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>`${enc(k)}=${enc(v)}`).join('&'),canonical=`${method}\n${uri}\n${query}\nhost:${host}\n\nhost\nUNSIGNED-PAYLOAD`,toSign=`AWS4-HMAC-SHA256\n${stamp}\n${scope}\n${createHash('sha256').update(canonical).digest('hex')}`,signing=hmac(hmac(hmac(hmac('AWS4'+secret,day),region),'s3'),'aws4_request'),signature=hmac(signing,toSign,'hex');return `https://${host}${uri}?${query}&X-Amz-Signature=${signature}`;}
          const ownerPrefix=user=>createHash('sha256').update(user.email).digest('hex').slice(0,24);
          const attr=(user,name)=>user?.Attributes?.find(x=>x.Name===name)?.Value||'';
          async function publicProfile(email,account){const settings=await db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:email}},ConsistentRead:true})),item=settings.Item;return {name:item?.profileName?.S||attr(account,'name')||attr(account,'preferred_username')||email.split('@')[0],picture:item?.profileAvatarKey?.S?signedMediaUrl('GET',item.profileAvatarKey.S,3600):attr(account,'picture')};}
          function cookie(event,name){const all=[...(event.cookies||[])];if(event.headers?.cookie)all.push(...event.headers.cookie.split(';'));for(const part of all){const [key,...rest]=part.trim().split('=');if(key===name)return decodeURIComponent(rest.join('='));}return '';}
          async function identity(event){const raw=cookie(event,'__Host-danzstak_session');if(!/^[a-f0-9]{64}$/.test(raw))return null;const sessionId=createHash('sha256').update(raw).digest('hex');const found=await db.send(new GetItemCommand({TableName:process.env.SESSIONS_TABLE,Key:{sessionId:{S:sessionId}},ConsistentRead:true}));const item=found.Item;if(!item||item.type?.S!=='user_session'||Number(item.expiresAt?.N||0)<=now())return null;const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`sub = "${item.userId.S}"`,Limit:1}));const user=users.Users?.[0];const email=attr(user,'email').trim().toLowerCase();return email?{email,userId:item.userId.S}:null;}
          async function registered(email){const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1}));return Boolean(users.Users?.length);}
          async function groupIds(email){const out=await db.send(new QueryCommand({TableName:process.env.GROUPS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:email}},Limit:100,ConsistentRead:true}));return new Set((out.Items||[]).map(x=>x.groupId.S));}
