AWSTemplateFormatVersion: '2010-09-09'
Description: Authenticated DanzStak messaging and WebRTC signaling — encrypted persistent chats with friend or shared-group authorization
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  ApiId:
    Type: String
    Default: 0872gqal4m
  SessionsTable:
    Type: String
    Default: DANZSTAK-Sessions
  UserPoolId:
    Type: String
    Default: us-east-1_qA4B46ilc
Resources:
  CallSignalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-CallSignals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipientEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: recipientEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  PresenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Presence
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  FriendsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Friends
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: friendEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: friendEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  StoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-Stories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: storyId
          AttributeType: S
      KeySchema:
        - AttributeName: storyId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  GroupMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DANZSTAK-GroupMembers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: groupId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: encrypted durable message history; DynamoDB supports ordered conversation reads without managing servers
        must:
          - conversation access requires accepted friendship or shared group
          - retain stored messages across stack replacement or deletion
        mutable: change-with-constraints
    Properties:
      TableName: DanzStak-Messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: messageId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: per-user inbox index for fast chat-list rendering with latest preview and timestamp
        must:
          - retain inbox index across stack replacement or deletion
        mutable: change-with-constraints
    Properties:
      TableName: DanzStak-Conversations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
        - AttributeName: contactEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
        - AttributeName: contactEmail
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DanzStak-UserSettings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userEmail
          AttributeType: S
      KeySchema:
        - AttributeName: userEmail
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  SignalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DanzstakCallSignalingData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SessionsTable}
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt CallSignalsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan, dynamodb:DeleteItem]
                Resource: !GetAtt PresenceTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt FriendsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt GroupMembersTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt MessagesTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt ConversationsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt UserSettingsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan]
                Resource: !GetAtt StoriesTable.Arn
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:us-east-1:${AWS::AccountId}:userpool/${UserPoolId}
  SignalingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DANZSTAK-Call-Signaling
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SignalingRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          CALLS_TABLE: !Ref CallSignalsTable
          PRESENCE_TABLE: !Ref PresenceTable
          FRIENDS_TABLE: !Ref FriendsTable
          GROUPS_TABLE: !Ref GroupMembersTable
          MESSAGES_TABLE: !Ref MessagesTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          SETTINGS_TABLE: !Ref UserSettingsTable
          STORIES_TABLE: !Ref StoriesTable
          SESSIONS_TABLE: !Ref SessionsTable
          USER_POOL_ID: !Ref UserPoolId
      Code:
        ZipFile: |
          const {createHash,randomUUID}=require('node:crypto');
          const https=require('node:https');
          const {DynamoDBClient,GetItemCommand,PutItemCommand,QueryCommand,DeleteItemCommand,ScanCommand,UpdateItemCommand}=require('@aws-sdk/client-dynamodb');
          const {CognitoIdentityProviderClient,ListUsersCommand}=require('@aws-sdk/client-cognito-identity-provider');
          const db=new DynamoDBClient({});
          const cognito=new CognitoIdentityProviderClient({region:'us-east-1'});
          const securityHeaders={'strict-transport-security':'max-age=63072000; includeSubDomains; preload','x-content-type-options':'nosniff','x-frame-options':'DENY','referrer-policy':'no-referrer'};
          const json=(status,body)=>({statusCode:status,headers:{...securityHeaders,'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify(body)});
          const now=()=>Math.floor(Date.now()/1000);
          const attr=(user,name)=>user?.Attributes?.find(x=>x.Name===name)?.Value||'';
          function cookie(event,name){const all=[...(event.cookies||[])];if(event.headers?.cookie)all.push(...event.headers.cookie.split(';'));for(const part of all){const [key,...rest]=part.trim().split('=');if(key===name)return decodeURIComponent(rest.join('='));}return '';}
          async function identity(event){const raw=cookie(event,'__Host-danzstak_session');if(!/^[a-f0-9]{64}$/.test(raw))return null;const sessionId=createHash('sha256').update(raw).digest('hex');const found=await db.send(new GetItemCommand({TableName:process.env.SESSIONS_TABLE,Key:{sessionId:{S:sessionId}},ConsistentRead:true}));const item=found.Item;if(!item||item.type?.S!=='user_session'||Number(item.expiresAt?.N||0)<=now())return null;const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`sub = "${item.userId.S}"`,Limit:1}));const user=users.Users?.[0];const email=attr(user,'email').trim().toLowerCase();return email?{email,userId:item.userId.S}:null;}
          async function registered(email){const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1}));return Boolean(users.Users?.length);}
          async function groupIds(email){const out=await db.send(new QueryCommand({TableName:process.env.GROUPS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:email}},Limit:100,ConsistentRead:true}));return new Set((out.Items||[]).map(x=>x.groupId.S));}
          async function canContact(sender,recipient){const friendship=await db.send(new GetItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:sender},friendEmail:{S:recipient}},ConsistentRead:true}));if(friendship.Item?.status?.S==='friends')return true;const [a,b]=await Promise.all([groupIds(sender),groupIds(recipient)]);return [...a].some(id=>b.has(id));}
          async function send(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const recipientEmail=String(body.recipientEmail||'').trim().toLowerCase();const mode=String(body.mode||'');const signalType=String(body.signalType||'');const callId=String(body.callId||'');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipientEmail)||recipientEmail.length>254)return json(400,{error:'Valid recipient required'});if(recipientEmail===user.email)return json(400,{error:'Choose another account'});if(!['text','phone','video'].includes(mode)||!['offer','answer','hangup'].includes(signalType)||!/^[a-f0-9-]{36}$/.test(callId))return json(400,{error:'Invalid call signal'});if(!(await canContact(user.email,recipientEmail)))return json(403,{error:'Only friends or members of the same group can message or call'});const payload=body.payload??null;const serialized=JSON.stringify(payload);if(serialized.length>110000)return json(413,{error:'Signal too large'});if(!(await registered(recipientEmail)))return json(404,{error:'DanzStak user not found'});const eventId=`${String(Date.now()).padStart(13,'0')}#${randomUUID()}`;await db.send(new PutItemCommand({TableName:process.env.CALLS_TABLE,Item:{recipientEmail:{S:recipientEmail},eventId:{S:eventId},senderEmail:{S:user.email},callId:{S:callId},mode:{S:mode},signalType:{S:signalType},payload:{S:serialized},createdAt:{S:new Date().toISOString()},expiresAt:{N:String(now()+120)}}}));return json(202,{accepted:true,eventId});}
          async function inbox(user){const out=await db.send(new QueryCommand({TableName:process.env.CALLS_TABLE,KeyConditionExpression:'recipientEmail = :r',ExpressionAttributeValues:{':r':{S:user.email}},Limit:20,ScanIndexForward:true,ConsistentRead:true}));return json(200,{events:(out.Items||[]).map(x=>({eventId:x.eventId.S,senderEmail:x.senderEmail.S,callId:x.callId.S,mode:x.mode.S,signalType:x.signalType.S,payload:JSON.parse(x.payload.S),createdAt:x.createdAt.S}))});}
          async function ack(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const ids=Array.isArray(body.eventIds)?body.eventIds.slice(0,20):[];for(const eventId of ids){if(typeof eventId==='string'&&eventId.length<100)await db.send(new DeleteItemCommand({TableName:process.env.CALLS_TABLE,Key:{recipientEmail:{S:user.email},eventId:{S:eventId}}}));}return json(200,{acknowledged:ids.length});}
          async function presence(user){const setting=await db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:user.email}},ConsistentRead:true}));if(setting.Item?.onlineVisible?.BOOL===false){await db.send(new DeleteItemCommand({TableName:process.env.PRESENCE_TABLE,Key:{email:{S:user.email}}}));return json(200,{online:false,visible:false});}await db.send(new PutItemCommand({TableName:process.env.PRESENCE_TABLE,Item:{email:{S:user.email},updatedAt:{N:String(now())},expiresAt:{N:String(now()+75)}}}));return json(200,{online:true,visible:true});}
          async function getPresenceSetting(user){const setting=await db.send(new GetItemCommand({TableName:process.env.SETTINGS_TABLE,Key:{userEmail:{S:user.email}},ConsistentRead:true}));return json(200,{onlineVisible:setting.Item?.onlineVisible?.BOOL!==false});}
          async function setPresenceSetting(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}if(typeof body.onlineVisible!=='boolean')return json(400,{error:'Online visibility required'});await db.send(new PutItemCommand({TableName:process.env.SETTINGS_TABLE,Item:{userEmail:{S:user.email},onlineVisible:{BOOL:body.onlineVisible},updatedAt:{S:new Date().toISOString()}}}));if(!body.onlineVisible)await db.send(new DeleteItemCommand({TableName:process.env.PRESENCE_TABLE,Key:{email:{S:user.email}}}));return json(200,{onlineVisible:body.onlineVisible});}
          async function directory(user){const [online,links,myGroups,members]=await Promise.all([db.send(new ScanCommand({TableName:process.env.PRESENCE_TABLE,FilterExpression:'expiresAt > :n',ExpressionAttributeValues:{':n':{N:String(now())}},Limit:100})),db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:user.email}},Limit:100})),groupIds(user.email),db.send(new ScanCommand({TableName:process.env.GROUPS_TABLE,Limit:250}))]);const states=Object.fromEntries((links.Items||[]).map(x=>[x.friendEmail.S,x.status.S])),onlineEmails=new Set((online.Items||[]).map(x=>x.email.S)),emails=new Set([...onlineEmails,...(links.Items||[]).filter(x=>x.status.S==='friends').map(x=>x.friendEmail.S),...(members.Items||[]).filter(x=>myGroups.has(x.groupId.S)).map(x=>x.userEmail.S)]);emails.delete(user.email);const users=await Promise.all([...emails].sort().map(async email=>{const theirs=await groupIds(email);return {email,online:onlineEmails.has(email),friendStatus:states[email]||'none',sharedGroup:[...myGroups].some(id=>theirs.has(id))};}));return json(200,{users});}          async function groupMembership(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const groupId=String(body.groupId||'').trim();if(!/^[a-zA-Z0-9_-]{1,80}$/.test(groupId))return json(400,{error:'Valid group required'});if(body.joined===true){await db.send(new PutItemCommand({TableName:process.env.GROUPS_TABLE,Item:{userEmail:{S:user.email},groupId:{S:groupId},joinedAt:{S:new Date().toISOString()}}}));return json(200,{joined:true});}await db.send(new DeleteItemCommand({TableName:process.env.GROUPS_TABLE,Key:{userEmail:{S:user.email},groupId:{S:groupId}}}));return json(200,{joined:false});}
          async function friendRequest(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const target=String(body.email||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(target)||target===user.email)return json(400,{error:'Choose another user'});if(!(await registered(target)))return json(404,{error:'DanzStak user not found'});const createdAt=new Date().toISOString();await Promise.all([db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:user.email},friendEmail:{S:target},status:{S:'outgoing'},createdAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:target},friendEmail:{S:user.email},status:{S:'incoming'},createdAt:{S:createdAt}}}))]);return json(202,{requested:true});}
          async function friendRespond(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const requester=String(body.email||'').trim().toLowerCase();const accept=body.accept===true;if(!requester)return json(400,{error:'Requester required'});if(accept){const createdAt=new Date().toISOString();await Promise.all([db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:user.email},friendEmail:{S:requester},status:{S:'friends'},createdAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.FRIENDS_TABLE,Item:{userEmail:{S:requester},friendEmail:{S:user.email},status:{S:'friends'},createdAt:{S:createdAt}}}))]);}else{await Promise.all([db.send(new DeleteItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:user.email},friendEmail:{S:requester}}})),db.send(new DeleteItemCommand({TableName:process.env.FRIENDS_TABLE,Key:{userEmail:{S:requester},friendEmail:{S:user.email}}}))]);}return json(200,{accepted:accept});}
          async function getFriends(user){const out=await db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',FilterExpression:'#s = :friends',ExpressionAttributeNames:{'#s':'status'},ExpressionAttributeValues:{':u':{S:user.email},':friends':{S:'friends'}},Limit:100,ConsistentRead:true}));const friends=await Promise.all((out.Items||[]).map(async x=>{const email=x.friendEmail.S,users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1})),account=users.Users?.[0];return {email,name:attr(account,'name')||attr(account,'preferred_username')||email.split('@')[0],picture:attr(account,'picture'),connectedAt:x.createdAt?.S||''};}));return json(200,{friends:friends.sort((a,b)=>a.name.localeCompare(b.name))});}
          async function getProfile(event,user){const email=String(event.queryStringParameters?.email||user.email).trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return json(400,{error:'Valid user required'});if(email!==user.email&&!(await canContact(user.email,email)))return json(403,{error:'Profile available to friends and group members'});const users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${email.replace(/["\\]/g,'')}"`,Limit:1})),account=users.Users?.[0];if(!account)return json(404,{error:'User not found'});return json(200,{profile:{email,name:attr(account,'name')||attr(account,'preferred_username')||email.split('@')[0],picture:attr(account,'picture')}});}
          async function notifications(user){const out=await db.send(new QueryCommand({TableName:process.env.FRIENDS_TABLE,KeyConditionExpression:'userEmail = :u',FilterExpression:'#s = :incoming',ExpressionAttributeNames:{'#s':'status'},ExpressionAttributeValues:{':u':{S:user.email},':incoming':{S:'incoming'}},Limit:100,ConsistentRead:true}));return json(200,{notifications:(out.Items||[]).map(x=>({type:'friend_request',email:x.friendEmail.S,createdAt:x.createdAt?.S||''})).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))});}
          const conversationId=(a,b)=>createHash('sha256').update([a,b].sort().join('|')).digest('hex');
          async function sendMessage(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const recipient=String(body.recipientEmail||'').trim().toLowerCase(),content=String(body.content||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipient)||recipient===user.email)return json(400,{error:'Choose another user'});if(!content||content.length>2000)return json(400,{error:'Message must be between 1 and 2000 characters'});if(!(await canContact(user.email,recipient)))return json(403,{error:'Only friends or members of the same group can message'});const createdAt=new Date().toISOString(),messageId=`${String(Date.now()).padStart(13,'0')}#${randomUUID()}`,preview=content.slice(0,120);await Promise.all([db.send(new PutItemCommand({TableName:process.env.MESSAGES_TABLE,Item:{conversationId:{S:conversationId(user.email,recipient)},messageId:{S:messageId},senderEmail:{S:user.email},recipientEmail:{S:recipient},content:{S:content},createdAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.CONVERSATIONS_TABLE,Item:{userEmail:{S:user.email},contactEmail:{S:recipient},preview:{S:preview},updatedAt:{S:createdAt}}})),db.send(new PutItemCommand({TableName:process.env.CONVERSATIONS_TABLE,Item:{userEmail:{S:recipient},contactEmail:{S:user.email},preview:{S:preview},updatedAt:{S:createdAt}}}))]);return json(201,{message:{messageId,senderEmail:user.email,recipientEmail:recipient,content,createdAt}});}
          async function getMessages(event,user){const contact=String(event.queryStringParameters?.contact||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)||contact===user.email)return json(400,{error:'Valid contact required'});if(!(await canContact(user.email,contact)))return json(403,{error:'Only friends or members of the same group can message'});const out=await db.send(new QueryCommand({TableName:process.env.MESSAGES_TABLE,KeyConditionExpression:'conversationId = :c',ExpressionAttributeValues:{':c':{S:conversationId(user.email,contact)}},Limit:50,ScanIndexForward:false,ConsistentRead:true}));const messages=(out.Items||[]).map(x=>({messageId:x.messageId.S,senderEmail:x.senderEmail.S,recipientEmail:x.recipientEmail.S,content:x.content.S,createdAt:x.createdAt.S})).reverse();return json(200,{messages});}
          async function getConversations(user){const out=await db.send(new QueryCommand({TableName:process.env.CONVERSATIONS_TABLE,KeyConditionExpression:'userEmail = :u',ExpressionAttributeValues:{':u':{S:user.email}},Limit:100,ConsistentRead:true}));const conversations=await Promise.all((out.Items||[]).map(async x=>{const contactEmail=x.contactEmail.S,users=await cognito.send(new ListUsersCommand({UserPoolId:process.env.USER_POOL_ID,Filter:`email = "${contactEmail.replace(/["\\]/g,'')}"`,Limit:1})),account=users.Users?.[0];return {contactEmail,name:attr(account,'name')||attr(account,'preferred_username')||contactEmail.split('@')[0],picture:attr(account,'picture'),preview:x.preview?.S||'',updatedAt:x.updatedAt?.S||''};}));return json(200,{conversations:conversations.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))});}
          async function deleteConversation(event,user){const contact=String(event.queryStringParameters?.contact||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)||contact===user.email)return json(400,{error:'Valid contact required'});const id=conversationId(user.email,contact),out=await db.send(new QueryCommand({TableName:process.env.MESSAGES_TABLE,KeyConditionExpression:'conversationId = :c',ExpressionAttributeValues:{':c':{S:id}},ProjectionExpression:'conversationId,messageId',Limit:100,ConsistentRead:true}));await Promise.all([...(out.Items||[]).map(x=>db.send(new DeleteItemCommand({TableName:process.env.MESSAGES_TABLE,Key:{conversationId:x.conversationId,messageId:x.messageId}}))),db.send(new DeleteItemCommand({TableName:process.env.CONVERSATIONS_TABLE,Key:{userEmail:{S:user.email},contactEmail:{S:contact}}})),db.send(new DeleteItemCommand({TableName:process.env.CONVERSATIONS_TABLE,Key:{userEmail:{S:contact},contactEmail:{S:user.email}}}))]);return json(200,{deleted:true});}
          async function createStory(event,user){let body;try{body=JSON.parse(event.body||'{}');}catch{return json(400,{error:'Invalid JSON'});}const content=String(body.content||'').trim();if(!content||content.length>5000)return json(400,{error:'Story content required'});const createdAt=new Date().toISOString(),storyId=randomUUID();await db.send(new PutItemCommand({TableName:process.env.STORIES_TABLE,Item:{storyId:{S:storyId},userEmail:{S:user.email},content:{S:content},createdAt:{S:createdAt},expiresAt:{N:String(now()+86400)}}}));return json(201,{storyId,content,createdAt,expiresAt:now()+86400});}
          async function getStories(){const out=await db.send(new ScanCommand({TableName:process.env.STORIES_TABLE,FilterExpression:'expiresAt > :n',ExpressionAttributeValues:{':n':{N:String(now())}},Limit:50}));const stories=(out.Items||[]).map(x=>({storyId:x.storyId.S,userEmail:x.userEmail.S,content:x.content.S,createdAt:x.createdAt.S})).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return json(200,{stories});}
          async function refreshSession(event){const raw=cookie(event,'__Host-danzstak_session');if(!/^[a-f0-9]{64}$/.test(raw))return json(401,{error:'Authentication required'});const sessionId=createHash('sha256').update(raw).digest('hex'),expiresAt=now()+7200;try{await db.send(new UpdateItemCommand({TableName:process.env.SESSIONS_TABLE,Key:{sessionId:{S:sessionId}},UpdateExpression:'SET expiresAt = :e',ConditionExpression:'#t = :user AND expiresAt > :n',ExpressionAttributeNames:{'#t':'type'},ExpressionAttributeValues:{':e':{N:String(expiresAt)},':n':{N:String(now())},':user':{S:'user_session'}}}));}catch{return json(401,{error:'Authentication required'});}return {statusCode:200,headers:{'content-type':'application/json','cache-control':'no-store'},cookies:[`__Host-danzstak_session=${raw}; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=7200`],body:JSON.stringify({authenticated:true,idleTimeoutSeconds:7200})};}
          const decodeXml=value=>value.replace(/<!\[CDATA\[|\]\]>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          async function news(event){const interest=String(event.queryStringParameters?.interest||'music').toLowerCase();const topics={music:['music industry','new music releases','hip hop music','electronic music','live music','music business'],top:['top stories'],entertainment:['entertainment'],technology:['technology'],sports:['sports'],business:['business']};if(!topics[interest])return json(400,{error:'Unsupported news interest'});const load=query=>new Promise((resolve,reject)=>{const feedUrl='https://news.google.com/rss/search?q='+encodeURIComponent(query)+'&hl=en-US&gl=US&ceid=US:en';const request=https.get(feedUrl,{headers:{'user-agent':'DanzStak/1.0'}},response=>{let data='';response.setEncoding('utf8');response.on('data',chunk=>{if(data.length<1048576)data+=chunk;});response.on('end',()=>response.statusCode===200?resolve(data):reject(new Error('News upstream failed')));});request.setTimeout(5000,()=>request.destroy(new Error('News timeout')));request.on('error',reject);});const feeds=await Promise.allSettled(topics[interest].map(load));const seen=new Set(),items=[];for(const result of feeds){if(result.status!=='fulfilled')continue;for(const match of result.value.matchAll(/<item>([\s\S]*?)<\/item>/g)){const block=match[1],read=tag=>decodeXml((block.match(new RegExp('<'+tag+'>([\\s\\S]*?)<\\/'+tag+'>'))||[])[1]||'');const title=read('title').replace(/\s+-\s+[^-]+$/,'').trim(),source=read('source').trim(),url=read('link').trim(),key=title.toLowerCase();if(!title||!/^https:\/\//.test(url)||seen.has(key))continue;seen.add(key);items.push({title:title.slice(0,240),source:source.slice(0,100),url});if(items.length>=50)break;}if(items.length>=50)break;}return {statusCode:200,headers:{'content-type':'application/json','cache-control':'private, max-age=300'},body:JSON.stringify({interest,items})};}          exports.handler=async event=>{try{const key=event.requestContext?.http?.method+' '+event.rawPath;if(key==='POST /auth/refresh')return await refreshSession(event);const user=await identity(event);if(!user)return json(401,{error:'Authentication required'});if(key==='GET /news')return await news(event);if(key==='POST /calls/signal')return await send(event,user);if(key==='GET /calls/inbox')return await inbox(user);if(key==='POST /calls/ack')return await ack(event,user);if(key==='POST /calls/presence')return await presence(user);if(key==='GET /calls/directory')return await directory(user);if(key==='GET /settings/presence')return await getPresenceSetting(user);if(key==='POST /settings/presence')return await setPresenceSetting(event,user);if(key==='POST /friends/request')return await friendRequest(event,user);if(key==='POST /friends/respond')return await friendRespond(event,user);if(key==='GET /friends')return await getFriends(user);if(key==='GET /profiles')return await getProfile(event,user);if(key==='GET /notifications')return await notifications(user);if(key==='POST /messages')return await sendMessage(event,user);if(key==='GET /messages')return await getMessages(event,user);if(key==='POST /messages/delete')return await deleteConversation(event,user);if(key==='GET /conversations')return await getConversations(user);if(key==='POST /groups/membership')return await groupMembership(event,user);if(key==='POST /stories')return await createStory(event,user);if(key==='GET /stories')return await getStories();return json(404,{error:'Not found'});}catch(error){console.error(error);return json(500,{error:'Service unavailable'});}};
