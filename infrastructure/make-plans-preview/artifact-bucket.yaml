AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Staging deployment artifacts for the Make Plans review backend — isolates
  packaged Lambda code from product media and production data.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: private versioned package store for isolated staging Lambda artifacts
        must:
          - block all public access
          - reject non-TLS requests
          - retain versions for rollback evidence
        mutable: change-with-constraints
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-noncurrent-packages
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: enforces encrypted transport for every artifact operation
        must:
          - keep aws:SecureTransport deny
        mutable: change-with-constraints
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  BucketName:
    Description: Private bucket used by CloudFormation package uploads.
    Value: !Ref ArtifactBucket
