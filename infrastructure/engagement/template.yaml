AWSTemplateFormatVersion: '2010-09-09'
Description: Durable reactions, comments, and engagement notifications for DanzStak
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  ApiId:
    Type: String
    Default: 0872gqal4m
  AuthIntegrationId:
    Type: String
    Default: 5pipi5a
  AuthFunctionName:
    Type: String
    Default: DANZSTAK-Auth-API
  AuthRoleName:
    Type: String
    Default: DANZSTAK-Auth-API-role-zjknf4ur
Resources:
  MarketplaceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Durable member shops, the official DanzStak Store, product inventory and later ticket/order records require one server-owned ledger.
        must: [Keep point-in-time recovery and encryption enabled, Never expose direct browser table access, Keep all prices and quantities as server-validated integers.]
    Properties:
      TableName: DANZSTAK-Marketplace
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  MarketplacePolicy:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: The Auth API owns marketplace catalog persistence and enforces member ownership, official-store administration and inventory rules.
        must: [Scope access to the marketplace table, Never grant browser clients direct DynamoDB access.]
    Properties:
      PolicyName: DanzStakMarketplaceAccess
      Roles: [!Ref AuthRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:TransactWriteItems]
            Resource: !GetAtt MarketplaceTable.Arn
  SessionDevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Signed-in device records let members review and revoke account sessions without exposing opaque session tokens.
        must: [Keep point-in-time recovery and encryption enabled, Store only coarse device labels and never IP addresses or raw user agents, Keep session records account-scoped.]
    Properties:
      TableName: DANZSTAK-SessionDevices
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: deviceId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: deviceId, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  SessionDevicesPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: The Auth API must list and revoke only the signed-in member's server-side device sessions.
        must: [Keep access scoped to the dedicated session-device table, Do not grant browser clients direct DynamoDB access.]
    Properties:
      PolicyName: DanzStakSessionDevices
      Roles: [!Ref AuthRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query]
            Resource: !GetAtt SessionDevicesTable.Arn
  PostViewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Deduplicate authenticated non-owner post views per UTC day without storing IP addresses.
        must: [Keep encryption and recovery enabled, Expire deduplication records after 90 days, Update the aggregate count atomically with the deduplication record.]
    Properties:
      TableName: !Sub '${AWS::StackName}-PostViews'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: postId, AttributeType: S}
        - {AttributeName: viewerKey, AttributeType: S}
      KeySchema:
        - {AttributeName: postId, KeyType: HASH}
        - {AttributeName: viewerKey, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  PostViewsPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: The view transaction needs only a conditional deduplication write and an aggregate update.
        must: [Scope writes to the views table and existing posts table.]
    Properties:
      PolicyName: DanzStakPostViews
      Roles: [!Ref AuthRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem]
            Resource: !GetAtt PostViewsTable.Arn
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:UpdateItem]
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/DANZSTAK-Posts'
  PostViewRoute:
    Type: AWS::ApiGatewayV2::Route
    Metadata:
      com.aws.cloudformation.Context:
        why: Record a visible post view through the existing authenticated Auth API.
        must: [Authenticate the viewer and enforce the original post audience.]
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /post-views', Target: !Sub 'integrations/${AuthIntegrationId}'}
  PostViewInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/post-views'
      SourceAccount: !Ref AWS::AccountId
  ReactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-Reactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: postId, AttributeType: S}
        - {AttributeName: userId, AttributeType: S}
      KeySchema:
        - {AttributeName: postId, KeyType: HASH}
        - {AttributeName: userId, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
  CommentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-Comments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: postId, AttributeType: S}
        - {AttributeName: commentId, AttributeType: S}
      KeySchema:
        - {AttributeName: postId, KeyType: HASH}
        - {AttributeName: commentId, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
  EngagementNotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-EngagementNotifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userEmail, AttributeType: S}
        - {AttributeName: eventId, AttributeType: S}
      KeySchema:
        - {AttributeName: userEmail, KeyType: HASH}
        - {AttributeName: eventId, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  ReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Member data needs recovery protection against accidental writes or deletion.
        must: [Keep point-in-time recovery and encryption enabled.]
    Properties:
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TableName: DANZSTAK-Reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: reportId, AttributeType: S}
      KeySchema:
        - {AttributeName: reportId, KeyType: HASH}
      SSESpecification: {SSEEnabled: true}
  AuthEngagementPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DanzStakEngagementAccess
      Roles: [!Ref AuthRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query]
            Resource:
              - !GetAtt ReactionsTable.Arn
              - !GetAtt CommentsTable.Arn
              - !GetAtt EngagementNotificationsTable.Arn
              - !GetAtt ReportsTable.Arn
          - Effect: Allow
            Action: [dynamodb:GetItem]
            Resource: arn:aws:dynamodb:us-west-1:635288116224:table/DANZSTAK-Posts
          - Effect: Allow
            Action: [dynamodb:DeleteItem]
            Resource: arn:aws:dynamodb:us-west-1:635288116224:table/DANZSTAK-Presence
          - Effect: Allow
            Action: [dynamodb:GetItem]
            Resource: arn:aws:dynamodb:us-west-1:635288116224:table/DanzStak-UserSettings
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Scan]
            Resource: arn:aws:dynamodb:us-west-1:635288116224:table/DANZSTAK-GroupMembers
  GetEngagementRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /engagement', Target: !Sub 'integrations/${AuthIntegrationId}'}
  SetReactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /reactions', Target: !Sub 'integrations/${AuthIntegrationId}'}
  AddCommentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /comments', Target: !Sub 'integrations/${AuthIntegrationId}'}
  UpdatePostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'PATCH /secure-posts/{postId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  DeleteCommentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'DELETE /comments/{commentId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  EngagementNotificationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /engagement-notifications', Target: !Sub 'integrations/${AuthIntegrationId}'}
  ReadEngagementNotificationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /engagement-notifications/read', Target: !Sub 'integrations/${AuthIntegrationId}'}
  CreateReportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /reports', Target: !Sub 'integrations/${AuthIntegrationId}'}
  ListGroupsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /groups', Target: !Sub 'integrations/${AuthIntegrationId}'}
  CreateGroupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /groups', Target: !Sub 'integrations/${AuthIntegrationId}'}
  DeleteGroupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'DELETE /groups/{groupId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GroupEveryoneRoute:
    Type: AWS::ApiGatewayV2::Route
    Metadata:
      com.aws.cloudformation.Context:
        why: lets a Tribe creator notify current members through durable in-app notifications; server-side fanout prevents client impersonation or member-address exposure
        must:
          - Auth API verifies the stored owner before fanout
          - notify current members only; never return member email addresses
        mutable: change-with-constraints
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /groups/{groupId}/everyone', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GroupMembersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /groups/{groupId}/members', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GroupEldersRoute:
    Type: AWS::ApiGatewayV2::Route
    Metadata:
      com.aws.cloudformation.Context:
        why: lets Tribe Elders promote or remove additional moderators without exposing member email addresses
        must:
          - Elder authorization is enforced by the Auth API and the founding Elder cannot be demoted
          - target must already be a Tribe member
        mutable: change-with-constraints
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /groups/{groupId}/elders', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GroupCoverRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /groups/{groupId}/cover', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GetProfileVideoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /profile-video', Target: !Sub 'integrations/${AuthIntegrationId}'}
  SetProfileVideoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /profile-video', Target: !Sub 'integrations/${AuthIntegrationId}'}
  LegalAcceptanceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /auth/legal-acceptance', Target: !Sub 'integrations/${AuthIntegrationId}'}
  ListAccountSessionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /auth/sessions', Target: !Sub 'integrations/${AuthIntegrationId}'}
  RevokeAccountSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'DELETE /auth/sessions/{deviceId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  RevokeOtherAccountSessionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /auth/sessions/revoke-others', Target: !Sub 'integrations/${AuthIntegrationId}'}
  ReauthenticateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /auth/reauth', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GetOfficialStoreRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /marketplace/store', Target: !Sub 'integrations/${AuthIntegrationId}'}
  PutOfficialStoreRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'PUT /marketplace/store', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GetOwnShopRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /marketplace/shop', Target: !Sub 'integrations/${AuthIntegrationId}'}
  PutOwnShopRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'PUT /marketplace/shop', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GetMemberShopRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /marketplace/shop/{memberId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  CreateProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /marketplace/products', Target: !Sub 'integrations/${AuthIntegrationId}'}
  UpdateProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'PATCH /marketplace/products/{productId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  DeleteProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'DELETE /marketplace/products/{productId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  CreateOfficialProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /marketplace/store/products', Target: !Sub 'integrations/${AuthIntegrationId}'}
  UpdateOfficialProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'PATCH /marketplace/store/products/{productId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  DeleteOfficialProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'DELETE /marketplace/store/products/{productId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  ListMarketplaceEventsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /marketplace/events', Target: !Sub 'integrations/${AuthIntegrationId}'}
  CreateMarketplaceEventRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /marketplace/events', Target: !Sub 'integrations/${AuthIntegrationId}'}
  GetMarketplaceEventRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'GET /marketplace/events/{eventId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  UpdateMarketplaceEventRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'PATCH /marketplace/events/{eventId}', Target: !Sub 'integrations/${AuthIntegrationId}'}
  CreateTicketTierRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ApiId, RouteKey: 'POST /marketplace/events/{eventId}/tiers', Target: !Sub 'integrations/${AuthIntegrationId}'}
  EngagementInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/engagement*'
  ReactionsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/reactions'
  CommentsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/comments*'
  ReportsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/reports'
  UpdatePostInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/PATCH/secure-posts/*'
  GroupsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/groups*'
  ProfileVideoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/profile-video'
  LegalAcceptanceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/auth/legal-acceptance'
  AccountSecurityInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/auth/*'
  MarketplaceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/marketplace/*'
      SourceAccount: !Ref AWS::AccountId
Outputs:
  MarketplaceTableName: {Value: !Ref MarketplaceTable}
  SessionDevicesTableName: {Value: !Ref SessionDevicesTable}
  PostViewsTableName: {Value: !Ref PostViewsTable}
  ReactionsTableName: {Value: !Ref ReactionsTable}
  CommentsTableName: {Value: !Ref CommentsTable}
  NotificationsTableName: {Value: !Ref EngagementNotificationsTable}
  ReportsTableName: {Value: !Ref ReportsTable}
