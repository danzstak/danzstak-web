<body class="friends-page">
  <div class="ds ds-page">
  <a class="ds-sr-only" href="#friendsMain">Skip to friends</a>
  <!-- UI kit screen 4a (docs/tasks/39-modern-look.md, CLAUDE.md F9 "Friends"): one frosted bar (← · name · search · invite),
       requests as list rows on top, pills Friends · Following · Things in common, rows of 56px photo + name + one grey line,
       the whole row opens the profile, Message sits behind ⋯. -->
  <header class="ds-appbar">
    <button type="button" id="friendsBack" class="ds-icon-btn" aria-label="Back"><svg class="ds-icon" aria-hidden="true"><use href="assets/icons.svg#arrow-left"></use></svg></button>
    <h1 id="friendsTitle" class="ds-appbar__title">Friends</h1>
    <div class="ds-appbar__actions">
      <button type="button" id="friendsSearchToggle" class="ds-icon-btn" aria-label="Search friends" aria-expanded="false" aria-controls="friendsSearchRow"><svg class="ds-icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg></button>
      <button type="button" id="friendsInvite" class="ds-icon-btn" aria-label="Invite" hidden><svg class="ds-icon" aria-hidden="true"><use href="assets/icons.svg#user-plus"></use></svg></button>
    </div>
  </header>
  <main id="friendsMain" class="ds-page__main" tabindex="-1">
    <div id="friendsSearchRow" class="ds-search" hidden>
      <label class="ds-sr-only" for="friendsSearch">Search friends</label>
      <svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
      <input id="friendsSearch" type="search" placeholder="Search friends" autocomplete="off" enterkeyhint="search">
    </div>
    <section id="friendsRequests" class="ds-section" aria-label="Friend requests" hidden></section>

    <div id="friendsTabs" class="ds-pills" role="tablist" aria-label="Friends">
      <button type="button" class="ds-pill" role="tab" id="tab-friends" data-panel="panelFriends" aria-controls="panelFriends" aria-selected="true">Friends</button>
      <button type="button" class="ds-pill" role="tab" id="tab-following" data-panel="panelFollowing" aria-controls="panelFollowing" aria-selected="false" tabindex="-1">Following</button>
      <button type="button" class="ds-pill" role="tab" id="tab-common" data-panel="panelCommon" aria-controls="panelCommon" aria-selected="false" tabindex="-1">Things in common</button>
    </div>
    <section id="panelFriends" class="ds-section" role="tabpanel" aria-labelledby="tab-friends">
      <h2 id="friendsStatus" class="ds-section__title" role="status" aria-live="polite"></h2>
      <div id="friendsFindRow" hidden><button type="button" id="friendsFind" class="ds-row ds-row--more ds-row--find"><span class="ds-row__avatar" aria-hidden="true"><span class="ds-row__photo is-icon"><svg class="ds-icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg></span></span><span class="ds-row__body"><span class="ds-row__name">Find friends</span><span class="ds-row__sub">Search everyone on DanzStak</span></span><svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="assets/icons.svg#chevron-right"></use></svg></button></div>
      <div id="friendsList" class="friends-list"></div>
      <div id="friendsEveryone" hidden><h2 id="friendsEveryoneTitle" class="ds-section__title"></h2><div id="friendsEveryoneList" class="friends-list"></div></div>
    </section>
    <section id="panelFollowing" class="ds-section" role="tabpanel" aria-labelledby="tab-following" hidden>
      <p class="ds-empty">Artists, venues and shops you follow will show here once Follow opens.</p>
    </section>
    <section id="panelCommon" class="ds-section" role="tabpanel" aria-labelledby="tab-common" hidden><div id="commonList"></div></section>
    <p id="friendsMore" hidden><a class="ds-row__link" href="profile.html">Add more about you to find people who share it</a></p>
  </main>
  </div>
  <nav class="ds-mobile-nav" aria-label="DanzStak mobile navigation"></nav>
  <script src="assets/app-feedback.js?v=4" defer></script>
  <script src="assets/icon-buttons.js?v=20" defer></script>
  <script src="assets/friendly-error.js?v=1" defer></script>
  <script src="assets/people-search.js?v=424" defer></script>
  <script src="assets/profile-sharing.js?v=421" defer></script>
  <script src="assets/call-devices.js?v=21" defer></script>
  <script src="assets/sync-tones.js?v=7" defer></script>
  <script src="assets/call-ringer.js?v=5" defer></script>
  <script src="assets/incoming-calls.js?v=316" defer></script>
  <script src="assets/ds-icon.js?v=2" defer></script>
  <script src="assets/ds-sheet.js?v=2" defer></script>
  <script src="assets/friends-screen.js?v=4" defer></script>
</body>
</html>
