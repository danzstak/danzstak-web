*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background-color:var(--ds-canvas,#edf2f7);color:var(--ds-ink,#172033);font-family:var(--ds-font,Arial,sans-serif)}
.profile-app-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px max(18px,calc((100vw - 1180px)/2));border-bottom:3px solid var(--ds-accent,#ef6c20);background:linear-gradient(112deg,var(--ds-brand-strong,#0d55bd),var(--ds-brand,#1769e0) 72%,#2478e9);box-shadow:var(--ds-shadow-md,0 8px 24px #10182824)}

.cover{height:280px;background-color:var(--ds-brand-strong,#0d55bd);background-image:radial-gradient(circle at 82% 22%,#ffb36b99 0 3%,transparent 3.4%),radial-gradient(circle at 75% 30%,#ffffff33 0 1.4%,transparent 1.8%),linear-gradient(125deg,#082f70 0%,var(--ds-brand,#1769e0) 58%,var(--ds-accent,#ef6c20) 130%);position:relative}.cover:not(.has-photo)::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,transparent 0 28px,#ffffff0d 29px 30px);pointer-events:none}
.profile{padding:0 32px 36px;text-align:left}.avatar{width:148px;height:148px;margin:-74px 0 16px 18px;display:grid;place-items:center;border:5px solid #fff;outline:3px solid var(--ds-accent,#ef6c20);border-radius:50%;background:var(--ds-brand,#1769e0) center/cover no-repeat;color:#fff;font-size:52px;font-weight:900;box-shadow:0 6px 20px #10182838}
h1{margin:0 0 6px;font-size:34px;line-height:var(--ds-leading-tight,1.2);letter-spacing:-.025em}.handle{margin:0;color:var(--ds-muted,#667085)}.status{padding:24px;text-align:center;color:var(--ds-muted,#667085)}
.profile-bio{max-width:68ch;color:var(--ds-ink-soft,#344054);line-height:var(--ds-leading-body,1.5)}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:24px;text-align:left}.detail{padding:15px;border:1px solid var(--ds-border,#d9e1eb);border-radius:var(--ds-radius,12px);background:var(--ds-surface-subtle,#f6f8fb)}.label{display:block;margin-bottom:6px;color:var(--ds-muted,#667085);font-size:var(--ds-text-xs,.75rem);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.value{overflow-wrap:anywhere}
.legal-footer{text-align:center;color:var(--ds-muted,#667085)}.legal-footer a{color:var(--ds-brand,#1769e0)}
@media(max-width:600px){html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}.cover{height:174px}main,.card,.profile{min-width:0;max-width:100%}main{width:min(100% - 12px,900px);margin:8px auto}.card{border-radius:var(--ds-radius,12px)}.profile{padding:0 16px 24px}.avatar{width:112px;height:112px;margin:-56px 0 12px 8px;font-size:40px}h1{font-size:26px}.details{grid-template-columns:1fr;gap:8px;margin-top:18px}}
