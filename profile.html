<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#0b0b12;color:#fff;font-family:Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 7%;border-bottom:1px solid #292936;background:#11111a}
.brand{display:flex;align-items:center;color:#fff;text-decoration:none;font-weight:800}.brand img{width:104px;height:48px;object-fit:contain;object-position:center;border-radius:8px;margin-right:12px}
.button{padding:11px 18px;border-radius:8px;background:#9d65f5;color:#fff;text-decoration:none;font-weight:700}
main{width:min(760px,92vw);margin:48px auto}.card{overflow:hidden;border:1px solid #303044;border-radius:18px;background:#191924;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.cover{height:180px;background:radial-gradient(circle at 50% 0,#6335a6,#171720 70%)}
.profile{padding:0 32px 36px;text-align:center}.avatar{width:118px;height:118px;margin:-59px auto 18px;display:grid;place-items:center;border:5px solid #191924;border-radius:50%;background:#9d65f5;font-size:48px;font-weight:900}
h1{margin:0 0 8px;font-size:34px}.handle{margin:0;color:#bcbcc9}.status{padding:24px;text-align:center;color:#c9c4d6}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:30px;text-align:left}.detail{padding:16px;border:1px solid #303044;border-radius:10px;background:#12121b}.label{display:block;margin-bottom:7px;color:#9a94a7;font-size:13px;text-transform:uppercase}.value{overflow-wrap:anywhere}
</style>
<link rel="stylesheet" href="assets/profile-editor.css">

<body>
<header><a class="brand" href="./"><img src="assets/danzstak-logo.png" alt=""><span>DanzStak</span></a><div><a class="button" href="feed.html">Back to Feed</a> <button class="button" type="button" data-logout>Logout</button></div></header>
<main><section class="card" aria-labelledby="profileName"><div class="cover"></div><div id="profileStatus" class="status" role="status">Loading profile...</div><div id="profileContent" class="profile" hidden><div id="profileInitial" class="avatar" aria-hidden="true">D</div><h1 id="profileName">DanzStak Member</h1><p id="profileHandle" class="handle">@member</p><p><a id="profileMessage" class="button" href="messages.html" hidden>Message</a></p><div class="details"><div class="detail"><span class="label">Email</span><span id="profileEmail" class="value">Not available</span></div><div class="detail"><span class="label">Account</span><span class="value">Secure member</span></div></div></div></section><p style="text-align:center"><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p></main>
