<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #1c1e21;
}

button, textarea, input { font: inherit; }
button { cursor: pointer; }

.topbar {
  background: #1769e0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 25px;
  gap: 15px;
  box-shadow: 0 2px 8px #0003;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 24px;
  font-weight: 900;
  color: white;
}
.logo img { width: 104px; height: 48px; object-fit: contain; object-position: center; border-radius: 8px; }

.search {
  border: 0;
  border-radius: 25px;
  padding: 12px 18px;
  background: white;
  width: 260px;
}

.topnav { display: flex; gap: 10px; }

.topnav button {
  border: 0;
  background: transparent;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  color: white;
}

.topnav button:hover,
.menu a:hover {
  background: #ffffff24;
}
.menu a:hover { background: #e7f3ff; }

.layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 650px) 230px;
  justify-content: center;
  gap: 22px;
  max-width: 1250px;
  margin: 25px auto;
  padding: 0 16px;
}

.panel, .post {
  background: white;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 1px 2px #0002;
  margin-bottom: 18px;
}

.menu a {
  display: flex;
  align-items: center;
  text-decoration: none;
  color: #333;
  min-height: 48px;
  padding: 5px 12px;
  border-radius: 8px;
  font-weight: 600;
  line-height: 1.12;
}

.menu a.active {
  color: #1769e0;
  background: #e7f3ff;
}

h3 { margin: 0 0 15px; }

textarea {
  width: 100%;
  border: 0;
  background: #f1f2f6;
  border-radius: 10px;
  padding: 15px;
  resize: vertical;
  min-height: 90px;
}

.primary {
  background: #1769e0;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 22px;
  font-weight: bold;
}

.primary:disabled {
  opacity: 0.6;
  cursor: wait;
}

.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  gap: 10px;
}

.post-header {
  font-weight: bold;
  margin-bottom: 12px;
}

.post-time {
  font-size: 12px;
  color: #777;
  font-weight: normal;
  margin-top: 5px;
}

.post-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.post-actions {
  display: flex;
  gap: 12px;
  border-top: 1px solid #eee;
  padding-top: 12px;
  margin-top: 15px;
}

.post-actions button {
  flex: 1;
  background: #f6f6f9;
  border: 0;
  border-radius: 7px;
  padding: 10px;
}

.comments { margin-top: 12px; }

.comments input {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 10px;
}

.comment {
  background: #f1f2f6;
  padding: 10px;
  border-radius: 10px;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.friend {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.muted {
  color: #777;
  font-size: 13px;
}

#feedStatus {
  margin-bottom: 15px;
}

.stories { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.story { position: relative; min-height: 170px; overflow: hidden; border-radius: 12px; background: linear-gradient(160deg,#1769e0,#8c52e5); box-shadow: 0 1px 2px #0003; color: white; padding: 16px; display: flex; align-items: flex-end; font-weight: 800; }
.story:nth-child(2) { background: linear-gradient(160deg,#ff7a00,#ef3054); }
.story:nth-child(3) { background: linear-gradient(160deg,#111827,#1769e0); }
.story::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent,#0008); }
.story span { position: relative; z-index: 1; }
.story video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.story-create { min-height: 104px; align-self: start; }
.post-media { display:block; width:100%; max-height:560px; object-fit:contain; border-radius:10px; background:#0c111b; }
.message-drawer{position:fixed;right:18px;bottom:18px;width:min(430px,calc(100vw - 24px));height:min(690px,calc(100vh - 84px));z-index:10000;background:#fff;border:1px solid #dce3ec;border-radius:18px;box-shadow:0 18px 60px #10182840;overflow:hidden}.message-drawer[hidden]{display:none}.message-drawer-bar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;border-bottom:1px solid #e5e9ef;font-weight:850}.message-drawer-close{min-width:34px;min-height:34px;padding:4px;border:0;background:transparent;font-size:1.35rem}.message-drawer iframe{display:block;width:100%;height:calc(100% - 46px);border:0;background:#f3f5f8}@media(max-width:560px){.message-drawer{right:6px;bottom:6px;width:calc(100vw - 12px);height:min(72vh,700px);border-radius:16px}}
.message-drawer.is-conversation{width:min(360px,calc(100vw - 18px));height:min(540px,calc(100vh - 70px))}
.composer-title { display: flex; align-items: center; gap: 12px; }
.composer-avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #1769e0; color: white; font-weight: 900; }

@media(max-width: 1050px) {
  .layout {
    grid-template-columns: 190px minmax(0, 650px);
  }
  .right { display: none; }
}

@media(max-width: 700px) {
  .layout { display: block; }
  .left { display: block; }
  .topbar { position: static; flex-wrap: wrap; padding: 14px 16px; }
  .search { width: 100%; }
  .topnav {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .topnav button { padding: 10px 6px; }
  .menu {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px;
  }
  .menu a {
    padding: 11px 8px;
    font-size: 14px;
  }
  .stories { grid-template-columns: repeat(3,78%); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .story { scroll-snap-align: start; }
}

  <input
    class="search"
    placeholder="Search DanzStak"
    aria-label="Search DanzStak"
  >

  <nav class="topnav">
    <button type="button" data-route="home">Home</button>
    <button type="button" data-feature="Friends">Friends</button>
    <button type="button" id="messagesNav">Messages</button>
    <button type="button" data-feature="Notifications">Notifications</button>
  </nav>
</header>

<div class="layout">

  <aside class="left">
    <div class="panel menu">
      <a href="feed.html" class="active">🏠 Feed</a>
      <a href="profile.html">👤 My Profile</a>
      <a href="#" data-feature="Friends">👥 Friends</a>
      <a href="#" data-feature="Photos">📷 Photos</a>
      <a href="#" data-feature="Videos">🎬 Videos</a>
      <a href="#" data-feature="Music">🎵 Music</a>
      <a href="#" data-feature="Events">🎤 Events</a>

      <a href="terms.html" class="legal-menu-link"><span class="legal-menu-icon" aria-hidden="true">📄</span><span class="legal-menu-terms">Terms of</span><span class="legal-menu-service">Service</span></a>
      <a href="#" data-logout class="logout-menu-link"><span aria-hidden="true">🚪</span><span>Logout</span></a>

  <main>

    <section id="featureView" class="panel" hidden>
      <h3 id="featureTitle"></h3>
      <p id="featureDescription" class="muted"></p>
    </section>

    <div id="newsFeedView">

      <h3 class="composer-title"><span class="composer-avatar" aria-hidden="true">D</span><span>Create a Post</span></h3>

        maxlength="5000"
        placeholder="What's on your mind?"

        <label class="story-share-control" title="Add a photo or video to share this post to Story"><input id="shareToStory" type="checkbox" disabled><span>Story · 24h</span></label>

        <button class="primary" id="publishBtn">

  <aside class="right">

    <div class="panel news-panel" aria-labelledby="newsPanelTitle">

        <select id="newsInterest" aria-label="Choose your news interest">
          <option value="music">Music</option><option value="top">Top News</option>
          <option value="entertainment">Entertainment</option><option value="technology">Technology</option>
          <option value="sports">Sports</option><option value="business">Business</option>
        </select>

      <div id="interestNews" class="interest-news"><p class="muted">Loading news…</p></div>

<script>

const API_URL =
  "https://api.danzstak.com/secure-posts";

const feed = document.getElementById("feed");
const feedStatus = document.getElementById("feedStatus");
const publishBtn = document.getElementById("publishBtn");
const postText = document.getElementById("postText");
const postAudience = document.getElementById("postAudience");
const shareToStory = document.getElementById("shareToStory");
const storiesRail = document.getElementById("storiesRail");
const newsFeedView = document.getElementById("newsFeedView");
const featureView = document.getElementById("featureView");
const featureTitle = document.getElementById("featureTitle");
const featureDescription = document.getElementById("featureDescription");

async function loadInterestNews() {
  const select = document.getElementById("newsInterest"), container = document.getElementById("interestNews");
  if (!select || !container) return;
  const allowed = ["music", "top", "entertainment", "technology", "sports", "business"];
  const saved = localStorage.getItem("danzstak-news-interest");
  if (allowed.includes(saved)) select.value = saved;
  container.innerHTML = '<p class="muted">Loading news…</p>';
  try {
    const response = await fetch("https://api.danzstak.com/news?interest=" + encodeURIComponent(select.value), { credentials: "include", cache: "no-store" });
    if (!response.ok) throw new Error();
    const data = await response.json();
    container.replaceChildren();
    for (const item of (data.items || []).slice(0, 6)) {
      const link = document.createElement("a"); link.className = "news-card"; link.href = item.url; link.target = "_blank"; link.rel = "noopener noreferrer";
      const title = document.createElement("strong"); title.textContent = item.title;
      const source = document.createElement("small"); source.textContent = item.source || "News";
      link.append(title, source); container.appendChild(link);
    }
    if (!container.children.length) container.innerHTML = '<p class="muted">No headlines available right now.</p>';
  } catch { container.innerHTML = '<p class="muted">News is temporarily unavailable.</p>'; }
}
document.getElementById("newsInterest")?.addEventListener("change", event => { localStorage.setItem("danzstak-news-interest", event.target.value); loadInterestNews(); });
document.getElementById("addNewsInterest")?.addEventListener("click", () => {
  const select = document.getElementById("newsInterest");
  select?.focus();
  if (typeof select?.showPicker === "function") select.showPicker();
});

async function loadOnlineUsers() {
  const container = document.getElementById("feedOnlineUsers");
  try {
    await fetch("https://api.danzstak.com/calls/presence", { method: "POST", credentials: "include" });
    const response = await fetch("https://api.danzstak.com/calls/directory", { credentials: "include", cache: "no-store" });
    if (!response.ok) return;
    const data = await response.json();
    container.replaceChildren();
    if (!(data.users || []).length) {
      const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "No other users online."; container.appendChild(empty); return;
    }
    for (const user of data.users) {
      const row = document.createElement("div"); row.className = "feed-online-row";
      const name = document.createElement("span"); name.textContent = "● " + user.email;
      const action = document.createElement(user.friendStatus === "friends" ? "a" : "button");
      if (user.friendStatus === "friends" || user.sharedGroup) { action.href = "messages.html?contact=" + encodeURIComponent(user.email); action.textContent = user.friendStatus === "friends" ? "Message" : "Group Message"; }
      else if (user.friendStatus === "incoming") { action.type = "button"; action.textContent = "Accept"; action.addEventListener("click", async () => { await updateFeedFriend("/friends/respond", { email: user.email, accept: true }); }); }
      else if (user.friendStatus === "outgoing") { action.type = "button"; action.textContent = "Requested"; action.disabled = true; }
      else { action.type = "button"; action.textContent = "Add Friend"; action.addEventListener("click", async () => { await updateFeedFriend("/friends/request", { email: user.email }); }); }
      row.append(name, action); container.appendChild(row);
    }
  } catch { /* Retry on the next refresh. */ }
}

async function updateFeedFriend(path, body) {
  const response = await fetch("https://api.danzstak.com" + path, { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify(body) });
  if (response.ok) { loadOnlineUsers(); loadFriends(); }
}

async function loadFriends() {
  const container = document.getElementById("feedFriends");
  try {
    const [friendsResponse, directoryResponse] = await Promise.all([
      fetch("https://api.danzstak.com/friends", { credentials: "include", cache: "no-store" }),
      fetch("https://api.danzstak.com/calls/directory", { credentials: "include", cache: "no-store" })
    ]);
    if (!friendsResponse.ok) return;
    const friends = (await friendsResponse.json()).friends || [];
    const online = new Set(directoryResponse.ok ? ((await directoryResponse.json()).users || []).map(user => user.email) : []);
    container.replaceChildren();
    if (!friends.length) { const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "No friends yet."; container.appendChild(empty); return; }
    for (const friend of friends) {
      const link = document.createElement("a"); link.className = "friend-card"; link.href = "profile.html?user=" + encodeURIComponent(friend.email);
      const avatar = friend.picture ? document.createElement("img") : document.createElement("span");
      avatar.className = "friend-avatar";
      if (friend.picture) { avatar.src = friend.picture; avatar.alt = ""; avatar.referrerPolicy = "no-referrer"; }
      else { avatar.textContent = (friend.name || friend.email).charAt(0).toUpperCase(); avatar.setAttribute("aria-hidden", "true"); }
      const details = document.createElement("span"); details.className = "friend-details";
      const name = document.createElement("strong"); name.textContent = friend.name || friend.email;
      const email = document.createElement("small"); email.textContent = friend.email;
      details.append(name, email);
      const state = document.createElement("span"); state.className = online.has(friend.email) ? "friend-presence online" : "friend-presence"; state.title = online.has(friend.email) ? "Online" : "Offline"; state.setAttribute("aria-label", state.title);
      link.append(avatar, details, state); container.appendChild(link);
    }
  } catch { /* Refresh again on the next interval. */ }
}

const featureCopy = {
  Friends: "Find and connect with artists, DJs, producers, and music fans.",
  Messages: "Your private DanzStak conversations will appear here.",
  Notifications: "Your latest reactions, comments, and connection updates will appear here.",
  Photos: "Share and explore photos from the DanzStak community.",
  Videos: "Discover performances, music videos, and creator clips.",
  Music: "Explore tracks, releases, playlists, and featured artists.",
  Events: "Find live shows, DJ sets, festivals, and booking opportunities.",
  Settings: "Manage your DanzStak account, privacy, and notification preferences."
};

// CREATE THE VISUAL DISPLAY OF A POST
function createPostElement(content, author = "DanzStak Member", createdAt = null, audience = "public", mediaUrl = "", mediaType = "", postId = "", isOwner = null) {

  const article = document.createElement("article");
  article.className = "post";
  if (postId) {
    article.dataset.postId = postId;
    article.id = "post-" + postId;
  }
  if (typeof isOwner === "boolean") article.dataset.isOwner = String(isOwner);

  const header = document.createElement("div");
  header.className = "post-header";
  header.textContent = author;

  const time = document.createElement("div");
  time.className = "post-time";

  const parsedDate = createdAt ? new Date(createdAt) : null;

  time.textContent =
    parsedDate && !Number.isNaN(parsedDate.getTime())
      ? parsedDate.toLocaleString()
      : "Just now";

  const audienceLabels = {
    public: "🌎 Public",
    friends: "👥 Friends",
    private: "🔒 Only me"
  };
  const audienceBadge = document.createElement("span");
  audienceBadge.className = "post-audience";
  audienceBadge.textContent = audienceLabels[audience] || audienceLabels.public;
  audienceBadge.setAttribute("aria-label", "Post audience: " + audienceBadge.textContent.replace(/^[^ ]+ /, ""));

  header.append(time, audienceBadge);

  const body = document.createElement("p");
  body.className = "post-content";
  body.textContent = content;

  const actions = document.createElement("div");
  actions.className = "post-actions";

  actions.innerHTML =
    '<button type="button" class="likeBtn">♡ Like</button>' +
    '<button type="button" class="commentBtn">💬 Comment</button>';

  const comments = document.createElement("div");
  comments.className = "comments";
  comments.hidden = true;

  comments.innerHTML =
    '<input aria-label="Write a comment" placeholder="Write a comment and press Enter">' +
    '<div class="commentList"></div>';

  article.append(header, body);
  if (mediaUrl && ["image", "video"].includes(mediaType)) {
    const media = document.createElement(mediaType === "image" ? "img" : "video");
    media.src = mediaUrl;
    media.className = "post-media";
    media.loading = "lazy";
    if (mediaType === "video") { media.controls = true; media.playsInline = true; }
    article.appendChild(media);
  }
  article.append(actions, comments);

  return article;
}

async function loadStories() {
  try {
    const response = await fetch("https://api.danzstak.com/stories", { credentials: "include", cache: "no-store" });
    if (!response.ok) return;
    const data = await response.json();
    document.getElementById("storiesLoading")?.remove();
    storiesRail.querySelectorAll(".story[data-story-id]").forEach(item => item.remove());
    for (const story of (data.stories || []).slice(0, 12)) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "story";
      item.dataset.storyId = story.storyId;
      item.title = story.content;
      if (story.mediaType === "image" && story.mediaUrl) {
        item.style.backgroundImage = `linear-gradient(transparent,#0009),url("${story.mediaUrl}")`;
        item.style.backgroundSize = "cover";
        item.style.backgroundPosition = "center";
      } else if (story.mediaType === "video" && story.mediaUrl) {
        const video = document.createElement("video");
        video.src = story.mediaUrl;
        video.muted = true;
        video.playsInline = true;
        video.preload = "metadata";
        item.appendChild(video);
      }
      const label = document.createElement("span");
      label.textContent = story.userEmail.split("@")[0] + ": " + story.content.slice(0, 55);
      item.appendChild(label);
      item.addEventListener("click", () => alert(story.content));
      storiesRail.appendChild(item);
    }
  } catch { /* Feed still works if stories are temporarily unavailable. */ }
  finally { document.getElementById("storiesLoading")?.remove(); }
}

// LOAD SAVED POSTS FROM AWS DYNAMODB
async function loadPosts() {

  feedStatus.textContent = "Loading saved posts...";

  try {

    const response = await fetch(API_URL, {
      method: "GET",
      credentials: "include",
      cache: "no-store"
    });

    if (response.status === 401) {
      feedStatus.textContent = "Your secure session has expired. Please log in again at https://api.danzstak.com/auth/login";
      return;
    }
    if (!response.ok) {
      throw new Error("AWS API returned " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.posts)) {
      throw new Error(
        "AWS did not return a valid posts list."
      );
    }

    feed.replaceChildren();

    if (data.posts.length === 0) {

      feedStatus.textContent =
        "No saved posts yet. Create your first post!";

      return;
    }

    const hiddenPostIds = new Set(JSON.parse(localStorage.getItem("danzstak-hidden-posts") || "[]"));

    data.posts.forEach(post => {

      if (typeof post.content !== "string") return;
      if (post.postId && hiddenPostIds.has(String(post.postId))) return;

      const article = createPostElement(
        post.content,
        "DanzStak Member",
        post.createdAt,
        post.audience,
        post.mediaUrl,
        post.mediaType,
        post.postId,
        typeof post.isOwner === "boolean" ? post.isOwner : null
      );

      if (!post.mediaUrl && post.mediaKey && post.mediaType) {
        fetch("https://api.danzstak.com/stories", {
          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
          body: JSON.stringify({ action: "view", mediaKey: post.mediaKey, mediaType: post.mediaType })
        }).then(response => response.ok ? response.json() : null).then(ticket => {
          if (!ticket?.mediaUrl || !article.isConnected) return;
          const media = document.createElement(post.mediaType === "image" ? "img" : "video");
          media.src = ticket.mediaUrl;
          media.className = "post-media";
          media.loading = "lazy";
          if (post.mediaType === "video") { media.controls = true; media.playsInline = true; }
          article.querySelector(".post-content")?.insertAdjacentElement("afterend", media);
        });
      }

      feed.appendChild(article);

    });

    feedStatus.textContent = "";

    console.log(
      "DanzStak: Loaded",
      data.posts.length,
      "saved posts."
    );

  } catch (error) {

    console.error(
      "DanzStak feed error:",
      error
    );

    feedStatus.textContent =
      "Unable to load posts: " + error.message;

  }
}

// SAVE NEW POST TO DYNAMODB
publishBtn.addEventListener("click", async () => {

  const content = postText.value.trim();
  const audience = ["public", "friends", "private"].includes(postAudience.value)
    ? postAudience.value
    : "public";

  const selectedMedia = window.danzstakSelectedMedia;
  if (!content && !selectedMedia) return;
  if (content.length > 5000) {
    alert("Posts must be 5000 characters or fewer.");
    return;
  }

  publishBtn.disabled = true;

  let savedPost;

  try {

    let mediaKey = "";
    let mediaType = "";
    let mediaUrl = "";
    if (selectedMedia) {
      const ticketResponse = await fetch("https://api.danzstak.com/stories", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
        body: JSON.stringify({ contentType: selectedMedia.file.type })
      });
      if (!ticketResponse.ok) throw new Error("Media upload could not start");
      const ticket = await ticketResponse.json();
      const uploadResponse = await fetch(ticket.uploadUrl, { method: "PUT", headers: { "Content-Type": selectedMedia.file.type }, body: selectedMedia.file });
      if (!uploadResponse.ok) throw new Error("Media upload failed");
      ({ mediaKey, mediaType } = ticket);
      mediaUrl = selectedMedia.url;
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ content: content || "Shared media", audience, mediaKey, mediaType })
    });

    if (response.status === 401) {
      throw new Error("Session expired. Log in again at https://api.danzstak.com/auth/login");
    }
    if (!response.ok) {
      throw new Error("AWS API returned " + response.status);
    }

    savedPost = await response.json();

    if (shareToStory.checked && shareToStory.dataset.hasMedia === "true") {
      const storyResponse = await fetch("https://api.danzstak.com/stories", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ content, mediaKey, mediaType })
      });
      if (!storyResponse.ok) alert("Your post was saved, but the story could not be published.");
      else await loadStories();
    }

    postText.value = "";

    // Show the new post immediately after AWS confirms saving it
    feed.prepend(
      createPostElement(
        savedPost.content,
        "You",
        savedPost.createdAt,
        savedPost.audience || audience,
        mediaUrl,
        mediaType,
        savedPost.postId,
        true
      )
    );

    feedStatus.textContent = "";

    console.log(
      "DanzStak: Post saved",
      savedPost.postId
    );

  } catch (error) {

    console.error(
      "DanzStak posting error:",
      error
    );

    alert(
      "Post was not saved: " + error.message
    );

  } finally {

    publishBtn.disabled = false;

  }
});

// LIKE AND COMMENT BUTTONS
feed.addEventListener("click", (event) => {

  const post = event.target.closest(".post");

  if (!post) return;

  if (event.target.classList.contains("likeBtn")) {

    const button = event.target;
    const liked = button.dataset.liked === "true";

    button.dataset.liked = String(!liked);

    button.textContent =
      liked ? "♡ Like" : "♥ Liked";

  }

  if (event.target.classList.contains("commentBtn")) {

    const comments = post.querySelector(".comments");

    comments.hidden = !comments.hidden;

    if (!comments.hidden) {
      comments.querySelector("input").focus();
    }

  }

});

// ADD COMMENTS TO THE SCREEN
feed.addEventListener("keydown", (event) => {

  if (
    event.key !== "Enter" ||
    !event.target.matches(".comments input")
  ) return;

  const value = event.target.value.trim();

  if (!value) return;

  const comment = document.createElement("div");
  comment.className = "comment";

  comment.textContent = "You: " + value;

  event.target.parentElement
    .querySelector(".commentList")
    .appendChild(comment);

  event.target.value = "";

});

// LOAD POSTS AUTOMATICALLY ON PAGE OPEN OR REFRESH
document.querySelector('[data-route="home"]').addEventListener("click", () => {
  window.location.assign("./");
});
document.getElementById("messagesNav").addEventListener("click", () => {
  let drawer = document.getElementById("messageDrawer");
  if (!drawer) {
    drawer = document.createElement("section");
    drawer.id = "messageDrawer";
    drawer.className = "message-drawer";
    drawer.setAttribute("aria-label", "Messages");
    drawer.innerHTML = '<div class="message-drawer-bar"><span>Chats</span><button type="button" class="message-drawer-close" aria-label="Close messages">×</button></div><iframe title="DanzStak messages" src="messages.html?embedded=1"></iframe>';
    drawer.querySelector(".message-drawer-close").addEventListener("click", () => { drawer.hidden = true; });
    document.body.appendChild(drawer);
  }
  drawer.hidden = false;
});
window.addEventListener("message", event => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "danzstak-chat-view") document.getElementById("messageDrawer")?.classList.toggle("is-conversation", event.data.open === true);
  if (event.data?.type === "danzstak-chat-minimize") document.getElementById("messageDrawer")?.setAttribute("hidden", "");
});

document.querySelectorAll("[data-feature]").forEach(control => {
  control.addEventListener("click", event => {
    event.preventDefault();
    const feature = control.dataset.feature;
    newsFeedView.hidden = true;
    featureView.hidden = false;
    featureTitle.textContent = feature;
    featureDescription.textContent = featureCopy[feature] || "This DanzStak section is being prepared.";
    document.querySelectorAll(".menu a").forEach(link => link.classList.remove("active"));
    if (control.matches(".menu a")) control.classList.add("active");
    featureView.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

loadPosts();
loadStories();
loadOnlineUsers();
loadInterestNews();
setInterval(loadOnlineUsers, 30000);
window.addEventListener("focus", loadOnlineUsers);
window.addEventListener("pageshow", loadOnlineUsers);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadOnlineUsers(); });

</script>
