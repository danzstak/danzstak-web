
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1769e0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.danzstak.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://www.tiktok.com https://www.facebook.com https://www.instagram.com https://www.dailymotion.com https://streamable.com https://player.twitch.tv https://clips.twitch.tv; object-src 'none'; base-uri 'none'; form-action 'self' https://api.danzstak.com; frame-ancestors 'none'; upgrade-insecure-requests">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-192.png?v=1" sizes="192x192" type="image/png">
<link rel="icon" href="assets/app-icon.svg?v=2" type="image/svg+xml">
<link rel="shortcut icon" href="assets/favicon-32.png?v=1" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1" sizes="180x180">
<title>DANZSTAK | Social Feed</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #1c1e21;
}

button, textarea, input { font: inherit; }
button { cursor: pointer; }

.topbar {
  background: #1769e0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 25px;
  gap: 15px;
  box-shadow: 0 2px 8px #0003;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 24px;
  font-weight: 900;
  color: white;
}
.logo img { width: 48px; height: 48px; object-fit: cover; border-radius: 50%; border: 2px solid white; }

.search {
  border: 0;
  border-radius: 25px;
  padding: 12px 18px;
  background: white;
  width: 260px;
}

.topnav { display: flex; gap: 10px; }

.topnav button {
  border: 0;
  background: transparent;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  color: white;
}

.topnav button:hover,
.menu a:hover {
  background: #ffffff24;
}
.menu a:hover { background: #e7f3ff; }

.layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 650px) 230px;
  justify-content: center;
  gap: 22px;
  max-width: 1250px;
  margin: 25px auto;
  padding: 0 16px;
}

.panel, .post {
  background: white;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 1px 2px #0002;
  margin-bottom: 18px;
}

.menu a {
  display: block;
  text-decoration: none;
  color: #333;
  padding: 14px;
  border-radius: 8px;
  font-weight: 600;
}

.menu a.active {
  color: #1769e0;
  background: #e7f3ff;
}

h3 { margin: 0 0 15px; }

textarea {
  width: 100%;
  border: 0;
  background: #f1f2f6;
  border-radius: 10px;
  padding: 15px;
  resize: vertical;
  min-height: 90px;
}

.primary {
  background: #1769e0;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 22px;
  font-weight: bold;
}

.primary:disabled {
  opacity: 0.6;
  cursor: wait;
}

.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  gap: 10px;
}

.post-header {
  font-weight: bold;
  margin-bottom: 12px;
}

.post-time {
  font-size: 12px;
  color: #777;
  font-weight: normal;
  margin-top: 5px;
}

.post-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.post-actions {
  display: flex;
  gap: 12px;
  border-top: 1px solid #eee;
  padding-top: 12px;
  margin-top: 15px;
}

.post-actions button {
  flex: 1;
  background: #f6f6f9;
  border: 0;
  border-radius: 7px;
  padding: 10px;
}

.comments { margin-top: 12px; }

.comments input {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 10px;
}

.comment {
  background: #f1f2f6;
  padding: 10px;
  border-radius: 10px;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.friend {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.muted {
  color: #777;
  font-size: 13px;
}

#feedStatus {
  margin-bottom: 15px;
}

.stories { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.story { position: relative; min-height: 170px; overflow: hidden; border-radius: 12px; background: linear-gradient(160deg,#1769e0,#8c52e5); box-shadow: 0 1px 2px #0003; color: white; padding: 16px; display: flex; align-items: flex-end; font-weight: 800; }
.story:nth-child(2) { background: linear-gradient(160deg,#ff7a00,#ef3054); }
.story:nth-child(3) { background: linear-gradient(160deg,#111827,#1769e0); }
.story::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent,#0008); }
.story span { position: relative; z-index: 1; }
.composer-title { display: flex; align-items: center; gap: 12px; }
.composer-avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #1769e0; color: white; font-weight: 900; }

@media(max-width: 1050px) {
  .layout {
    grid-template-columns: 190px minmax(0, 650px);
  }
  .right { display: none; }
}

@media(max-width: 700px) {
  .layout { display: block; }
  .left { display: block; }
  .topbar { position: static; flex-wrap: wrap; padding: 14px 16px; }
  .search { width: 100%; }
  .topnav {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .topnav button { padding: 10px 6px; }
  .menu {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px;
  }
  .menu a {
    padding: 11px 8px;
    font-size: 14px;
  }
  .stories { grid-template-columns: repeat(3,78%); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .story { scroll-snap-align: start; }
}
</style>
<link rel="stylesheet" href="assets/feed-enhancements.css?v=20261024-6">
<link rel="stylesheet" href="assets/soft-ui.css?v=20261024-5">
</head>

<body>

<header class="topbar">
  <div class="logo"><img src="assets/danzstak-logo.png" alt=""><span>DANZSTAK</span></div>

  <input
    class="search"
    placeholder="Search DANZSTAK"
    aria-label="Search DANZSTAK"
  >

  <nav class="topnav">
    <button type="button" data-route="home">Home</button>
    <button type="button" data-feature="Friends">Friends</button>
    <button type="button" id="messagesNav">Messages</button>
    <button type="button" data-feature="Notifications">Notifications</button>
  </nav>
</header>

<div class="layout">

  <aside class="left">
    <div class="panel menu">
      <a href="feed.html" class="active">🏠 News Feed</a>
      <a href="profile.html">👤 My Profile</a>
      <a href="#" data-feature="Friends">👥 Friends</a>
      <a href="#" data-feature="Photos">📷 Photos</a>
      <a href="#" data-feature="Videos">🎬 Videos</a>
      <a href="#" data-feature="Music">🎵 Music</a>
      <a href="#" data-feature="Events">🎤 Events</a>
      <a href="#" data-feature="Settings">⚙️ Settings</a>
      <a href="privacy.html">🔒 Privacy Policy</a>
      <a href="terms.html">📄 Terms of Service</a>
    </div>
  </aside>

  <main>

    <section id="featureView" class="panel" hidden>
      <h3 id="featureTitle"></h3>
      <p id="featureDescription" class="muted"></p>
    </section>

    <div id="newsFeedView">
    <section id="storiesRail" class="stories" aria-label="Stories">
      <div class="story"><span>Your Story</span></div>
      <div id="storiesLoading" class="story"><span>Loading Stories</span></div>
    </section>
    <section class="panel">
      <h3 class="composer-title"><span class="composer-avatar" aria-hidden="true">D</span><span>Create a Post</span></h3>

      <textarea
        id="postText"
        maxlength="5000"
        placeholder="What's on your mind?"
      ></textarea>

      <div class="composer-actions">
        <label class="post-audience-control" for="postAudience">
          <span>Audience</span>
          <select id="postAudience" aria-label="Who can see this post">
            <option value="public">🌎 Public</option>
            <option value="friends">👥 Friends</option>
            <option value="private">🔒 Only me</option>
          </select>
        </label>
        <label class="story-share-control"><input id="shareToStory" type="checkbox" checked><span>Share to story (24 hours)</span></label>

        <button class="primary" id="publishBtn">
          Post
        </button>
      </div>
    </section>

    <p id="feedStatus" class="muted" role="status">
      Loading saved posts...
    </p>

    <section id="feed" aria-label="News Feed"></section>
    </div>

  </main>

  <aside class="right">

    <div class="panel">
      <h3>Friends</h3>
      <p class="muted">
        Your friends will appear here.
      </p>
    </div>

    <div class="panel">
      <h3>What's Happening</h3>
      <p class="muted">
        Events and music updates coming soon.
      </p>
    </div>

  </aside>

</div>

<script>

const API_URL =
  "https://api.danzstak.com/secure-posts";

const feed = document.getElementById("feed");
const feedStatus = document.getElementById("feedStatus");
const publishBtn = document.getElementById("publishBtn");
const postText = document.getElementById("postText");
const postAudience = document.getElementById("postAudience");
const shareToStory = document.getElementById("shareToStory");
const storiesRail = document.getElementById("storiesRail");
const newsFeedView = document.getElementById("newsFeedView");
const featureView = document.getElementById("featureView");
const featureTitle = document.getElementById("featureTitle");
const featureDescription = document.getElementById("featureDescription");

const featureCopy = {
  Friends: "Find and connect with artists, DJs, producers, and music fans.",
  Messages: "Your private DANZSTAK conversations will appear here.",
  Notifications: "Your latest reactions, comments, and connection updates will appear here.",
  Photos: "Share and explore photos from the DANZSTAK community.",
  Videos: "Discover performances, music videos, and creator clips.",
  Music: "Explore tracks, releases, playlists, and featured artists.",
  Events: "Find live shows, DJ sets, festivals, and booking opportunities.",
  Settings: "Manage your DANZSTAK account, privacy, and notification preferences."
};

// CREATE THE VISUAL DISPLAY OF A POST
function createPostElement(content, author = "DANZSTAK Member", createdAt = null, audience = "public") {

  const article = document.createElement("article");
  article.className = "post";

  const header = document.createElement("div");
  header.className = "post-header";
  header.textContent = author;

  const time = document.createElement("div");
  time.className = "post-time";

  const parsedDate = createdAt ? new Date(createdAt) : null;

  time.textContent =
    parsedDate && !Number.isNaN(parsedDate.getTime())
      ? parsedDate.toLocaleString()
      : "Just now";

  const audienceLabels = {
    public: "🌎 Public",
    friends: "👥 Friends",
    private: "🔒 Only me"
  };
  const audienceBadge = document.createElement("span");
  audienceBadge.className = "post-audience";
  audienceBadge.textContent = audienceLabels[audience] || audienceLabels.public;
  audienceBadge.setAttribute("aria-label", "Post audience: " + audienceBadge.textContent.replace(/^[^ ]+ /, ""));

  header.append(time, audienceBadge);

  const body = document.createElement("p");
  body.className = "post-content";
  body.textContent = content;

  const actions = document.createElement("div");
  actions.className = "post-actions";

  actions.innerHTML =
    '<button type="button" class="likeBtn">♡ Like</button>' +
    '<button type="button" class="commentBtn">💬 Comment</button>';

  const comments = document.createElement("div");
  comments.className = "comments";
  comments.hidden = true;

  comments.innerHTML =
    '<input aria-label="Write a comment" placeholder="Write a comment and press Enter">' +
    '<div class="commentList"></div>';

  article.append(header, body, actions, comments);

  return article;
}

async function loadStories() {
  try {
    const response = await fetch("https://api.danzstak.com/stories", { credentials: "include", cache: "no-store" });
    if (!response.ok) return;
    const data = await response.json();
    document.getElementById("storiesLoading")?.remove();
    storiesRail.querySelectorAll(".story[data-story-id]").forEach(item => item.remove());
    for (const story of (data.stories || []).slice(0, 12)) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "story";
      item.dataset.storyId = story.storyId;
      item.title = story.content;
      const label = document.createElement("span");
      label.textContent = story.userEmail.split("@")[0] + ": " + story.content.slice(0, 55);
      item.appendChild(label);
      item.addEventListener("click", () => alert(story.content));
      storiesRail.appendChild(item);
    }
  } catch { /* Feed still works if stories are temporarily unavailable. */ }
}

// LOAD SAVED POSTS FROM AWS DYNAMODB
async function loadPosts() {

  feedStatus.textContent = "Loading saved posts...";

  try {

    const response = await fetch(API_URL, {
      method: "GET",
      credentials: "include",
      cache: "no-store"
    });

    if (response.status === 401) {
      feedStatus.textContent = "Your secure session has expired. Please log in again at https://api.danzstak.com/auth/login";
      return;
    }
    if (!response.ok) {
      throw new Error("AWS API returned " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.posts)) {
      throw new Error(
        "AWS did not return a valid posts list."
      );
    }

    feed.replaceChildren();

    if (data.posts.length === 0) {

      feedStatus.textContent =
        "No saved posts yet. Create your first post!";

      return;
    }

    data.posts.forEach(post => {

      if (typeof post.content !== "string") return;

      const article = createPostElement(
        post.content,
        "DANZSTAK Member",
        post.createdAt,
        post.audience
      );

      feed.appendChild(article);

    });

    feedStatus.textContent = "";

    console.log(
      "DANZSTAK: Loaded",
      data.posts.length,
      "saved posts."
    );

  } catch (error) {

    console.error(
      "DANZSTAK feed error:",
      error
    );

    feedStatus.textContent =
      "Unable to load posts: " + error.message;

  }
}

// SAVE NEW POST TO DYNAMODB
publishBtn.addEventListener("click", async () => {

  const content = postText.value.trim();
  const audience = ["public", "friends", "private"].includes(postAudience.value)
    ? postAudience.value
    : "public";

  if (!content) return;
  if (content.length > 5000) {
    alert("Posts must be 5000 characters or fewer.");
    return;
  }

  publishBtn.disabled = true;

  let savedPost;

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ content, audience })
    });

    if (response.status === 401) {
      throw new Error("Session expired. Log in again at https://api.danzstak.com/auth/login");
    }
    if (!response.ok) {
      throw new Error("AWS API returned " + response.status);
    }

    savedPost = await response.json();

    if (shareToStory.checked) {
      const storyResponse = await fetch("https://api.danzstak.com/stories", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ content })
      });
      if (!storyResponse.ok) alert("Your post was saved, but the story could not be published.");
      else await loadStories();
    }

    postText.value = "";

    // Show the new post immediately after AWS confirms saving it
    feed.prepend(
      createPostElement(
        savedPost.content,
        "You",
        savedPost.createdAt,
        savedPost.audience || audience
      )
    );

    feedStatus.textContent = "";

    console.log(
      "DANZSTAK: Post saved",
      savedPost.postId
    );

  } catch (error) {

    console.error(
      "DANZSTAK posting error:",
      error
    );

    alert(
      "Post was not saved: " + error.message
    );

  } finally {

    publishBtn.disabled = false;

  }
});

// LIKE AND COMMENT BUTTONS
feed.addEventListener("click", (event) => {

  const post = event.target.closest(".post");

  if (!post) return;

  if (event.target.classList.contains("likeBtn")) {

    const button = event.target;
    const liked = button.dataset.liked === "true";

    button.dataset.liked = String(!liked);

    button.textContent =
      liked ? "♡ Like" : "♥ Liked";

  }

  if (event.target.classList.contains("commentBtn")) {

    const comments = post.querySelector(".comments");

    comments.hidden = !comments.hidden;

    if (!comments.hidden) {
      comments.querySelector("input").focus();
    }

  }

});

// ADD COMMENTS TO THE SCREEN
feed.addEventListener("keydown", (event) => {

  if (
    event.key !== "Enter" ||
    !event.target.matches(".comments input")
  ) return;

  const value = event.target.value.trim();

  if (!value) return;

  const comment = document.createElement("div");
  comment.className = "comment";

  comment.textContent = "You: " + value;

  event.target.parentElement
    .querySelector(".commentList")
    .appendChild(comment);

  event.target.value = "";

});

// LOAD POSTS AUTOMATICALLY ON PAGE OPEN OR REFRESH
document.querySelector('[data-route="home"]').addEventListener("click", () => {
  window.location.assign("./");
});
document.getElementById("messagesNav").addEventListener("click", () => {
  window.location.assign("messages.html");
});

document.querySelectorAll("[data-feature]").forEach(control => {
  control.addEventListener("click", event => {
    event.preventDefault();
    const feature = control.dataset.feature;
    newsFeedView.hidden = true;
    featureView.hidden = false;
    featureTitle.textContent = feature;
    featureDescription.textContent = featureCopy[feature] || "This DANZSTAK section is being prepared.";
    document.querySelectorAll(".menu a").forEach(link => link.classList.remove("active"));
    if (control.matches(".menu a")) control.classList.add("active");
    featureView.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

loadPosts();
loadStories();

</script>

<script src="assets/feed-enhancements.js?v=20261024-25" defer></script>
<script src="assets/pwa.js" defer></script>
</body>
</html>
