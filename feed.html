<script>

const API_URL =
  "https://api.danzstak.com/secure-posts";

const feed = document.getElementById("feed");
const feedStatus = document.getElementById("feedStatus");
const publishBtn = document.getElementById("publishBtn");
const postText = document.getElementById("postText");
const postAudience = document.getElementById("postAudience");
const shareToStory = document.getElementById("shareToStory");
const shareToReels = document.getElementById("shareToReels");
const storiesRail = document.getElementById("storiesRail");
const newsFeedView = document.getElementById("newsFeedView");
const featureView = document.getElementById("featureView");
const featureTitle = document.getElementById("featureTitle");
const featureDescription = document.getElementById("featureDescription");

async function loadInterestNews() {
  const select = document.getElementById("newsInterest"), container = document.getElementById("interestNews");
  if (!select || !container) return;
  const allowed = ["music", "top", "entertainment", "technology", "sports", "business"];
  const saved = localStorage.getItem("danzstak-news-interest");
  if (allowed.includes(saved)) select.value = saved;
  container.innerHTML = '<p class="muted">Loading news…</p>';
  try {
    const response = await fetch("https://api.danzstak.com/news?interest=" + encodeURIComponent(select.value), { credentials: "include", cache: "no-store" });
    if (!response.ok) throw new Error();
    const data = await response.json();
    container.replaceChildren();
    for (const item of (data.items || []).slice(0, 6)) {
      const link = document.createElement("a"); link.className = "news-card"; link.href = item.url; link.target = "_blank"; link.rel = "noopener noreferrer";
      const title = document.createElement("strong"); title.textContent = item.title;
      const source = document.createElement("small"); source.textContent = item.source || "News";
      link.append(title, source); container.appendChild(link);
    }
    if (!container.children.length) container.innerHTML = '<p class="muted">No headlines available right now.</p>';
  } catch { container.innerHTML = '<p class="muted">News is temporarily unavailable.</p>'; }
}
document.getElementById("newsInterest")?.addEventListener("change", event => { localStorage.setItem("danzstak-news-interest", event.target.value); loadInterestNews(); });
document.getElementById("addNewsInterest")?.addEventListener("click", () => {
  const select = document.getElementById("newsInterest");
  select?.focus();
  if (typeof select?.showPicker === "function") select.showPicker();
});

async function fetchWithDeadline(url, options = {}, timeoutMs = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try { return await fetch(url, { ...options, signal: controller.signal }); }
  finally { clearTimeout(timer); }
}

async function discardUploadedMedia(mediaKey) {
  if (!mediaKey) return;
  await fetchWithDeadline("https://api.danzstak.com/stories", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "discard", mediaKey })
  }).catch(() => null);
}

async function loadOnlineUsers() {
  const container = document.getElementById("feedOnlineUsers");
  try {
    await fetchWithDeadline("https://api.danzstak.com/calls/presence", { method: "POST", credentials: "include" }).catch(() => null);
    const [directoryResult, friendsResult] = await Promise.allSettled([
      fetchWithDeadline("https://api.danzstak.com/calls/directory", { credentials: "include", cache: "no-store" }),
      fetchWithDeadline("https://api.danzstak.com/friends", { credentials: "include", cache: "no-store" })
    ]);
    const directoryResponse = directoryResult.status === "fulfilled" ? directoryResult.value : null;
    const friendsResponse = friendsResult.status === "fulfilled" ? friendsResult.value : null;
    if (directoryResponse?.status === 401 || friendsResponse?.status === 401) return location.replace("./");
    if (!directoryResponse?.ok && !friendsResponse?.ok) throw new Error("User directory unavailable");
    const directoryData = directoryResponse?.ok ? await directoryResponse.json() : { users: [] };
    const friendsData = friendsResponse?.ok ? await friendsResponse.json() : { friends: [] };
    const merged = new Map();
    for (const friend of friendsData.friends || []) {
      const email = String(friend.email || "").toLowerCase();
      if (email) merged.set(email, { ...friend, email, online: false, friendStatus: "friends" });
    }
    for (const user of directoryData.users || []) {
      const email = String(user.email || "").toLowerCase();
      if (email) merged.set(email, { ...(merged.get(email) || {}), ...user, email });
    }
    const users = [...merged.values()].filter(user => user.online === true);
    container.replaceChildren();
    if (!users.length) {
      const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "No users are online right now."; container.appendChild(empty); return;
    }
    for (const user of users) {
      const row = document.createElement("div"); row.className = "feed-online-row";
      const name = document.createElement("a"); name.href = "profile.html?user=" + encodeURIComponent(user.email); name.textContent = "● " + (user.name || user.email);
      const action = document.createElement("button"); action.type = "button";
      if (user.friendStatus === "friends" || user.sharedGroup) {
        action.textContent = user.friendStatus === "friends" ? "Message" : "Group Message";
        action.addEventListener("click", () => openMessageDrawer(user.email));
      }
      else if (user.friendStatus === "incoming") { action.type = "button"; action.textContent = "Accept"; action.addEventListener("click", async () => { await updateFeedFriend("/friends/respond", { email: user.email, accept: true }); }); }
      else if (user.friendStatus === "outgoing") { action.type = "button"; action.textContent = "Requested"; action.disabled = true; }
      else { action.type = "button"; action.textContent = "Add Friend"; action.addEventListener("click", async () => { await updateFeedFriend("/friends/request", { email: user.email }); }); }
      row.append(name, action); container.appendChild(row);
    }
  } catch {
    container.replaceChildren();
    const error = document.createElement("p"); error.className = "muted"; error.textContent = "Users are temporarily unavailable. Retrying…"; container.appendChild(error);
  }
}

async function updateFeedFriend(path, body) {
  const response = await fetch("https://api.danzstak.com" + path, { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify(body) });
  if (response.ok) { loadOnlineUsers(); loadFriends(); }
}

async function loadFriends() {
  const container = document.getElementById("feedFriends");
  try {
    const [friendsResult, directoryResult] = await Promise.allSettled([
      fetchWithDeadline("https://api.danzstak.com/friends", { credentials: "include", cache: "no-store" }),
      fetchWithDeadline("https://api.danzstak.com/calls/directory", { credentials: "include", cache: "no-store" })
    ]);
    const friendsResponse = friendsResult.status === "fulfilled" ? friendsResult.value : null;
    const directoryResponse = directoryResult.status === "fulfilled" ? directoryResult.value : null;
    if (!friendsResponse?.ok) throw new Error("Friends could not be loaded");
    const friends = (await friendsResponse.json()).friends || [];
    const online = new Set(
      directoryResponse?.ok
        ? ((await directoryResponse.json()).users || [])
            .filter(user => user.online === true)
            .map(user => String(user.email || "").toLowerCase())
            .filter(Boolean)
        : []
    );
    container.replaceChildren();
    if (!friends.length) { const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "No friends yet."; container.appendChild(empty); return; }
    for (const friend of friends) {
      const link = document.createElement("a"); link.className = "friend-card"; link.href = "profile.html?user=" + encodeURIComponent(friend.email);
      const avatar = friend.picture ? document.createElement("img") : document.createElement("span");
      avatar.className = "friend-avatar";
      if (friend.picture) { avatar.src = friend.picture; avatar.alt = ""; avatar.referrerPolicy = "no-referrer"; }
      else { avatar.textContent = (friend.name || friend.email).charAt(0).toUpperCase(); avatar.setAttribute("aria-hidden", "true"); }
      const details = document.createElement("span"); details.className = "friend-details";
      const name = document.createElement("strong"); name.textContent = friend.name || friend.email;
      const email = document.createElement("small"); email.textContent = friend.email;
      details.append(name, email);
      const friendIsOnline = online.has(String(friend.email || "").toLowerCase());
      const state = document.createElement("span"); state.className = friendIsOnline ? "friend-presence online" : "friend-presence"; state.title = friendIsOnline ? "Online" : "Offline"; state.setAttribute("aria-label", state.title);
      link.append(avatar, details, state); container.appendChild(link);
    }
  } catch { /* Refresh again on the next interval. */ }
}

// CREATE THE VISUAL DISPLAY OF A POST
function createPostElement(content, author = "DanzStak Member", createdAt = null, audience = "public", mediaUrl = "", mediaType = "", postId = "", isOwner = null, authorEmail = "", commentPolicy = "everyone", editHistory = []) {

  const article = document.createElement("article");
  article.className = "post";
  article.dataset.audience = ["public", "friends", "private"].includes(audience) ? audience : "public";
  if (postId) {
    article.dataset.postId = postId;
    article.id = "post-" + postId;
  }
  if (typeof isOwner === "boolean") article.dataset.isOwner = String(isOwner);
  article.dataset.commentSetting = String(commentPolicy === "friends" ? 1 : commentPolicy === "off" ? 2 : 0);
  article.dataset.editHistory = JSON.stringify(Array.isArray(editHistory) ? editHistory : []);

  const header = document.createElement("div");
  header.className = "post-header";
  const authorLabel = authorEmail ? document.createElement("a") : document.createElement("span");
  authorLabel.className = "post-author";
  authorLabel.textContent = author;
  if (authorEmail) authorLabel.href = isOwner === true ? "profile.html" : "profile.html?user=" + encodeURIComponent(authorEmail);

  const time = document.createElement("div");
  time.className = "post-time";

  const parsedDate = createdAt ? new Date(createdAt) : null;

  time.textContent =
    parsedDate && !Number.isNaN(parsedDate.getTime())
      ? parsedDate.toLocaleString()
      : "Just now";

  const audienceLabels = {
    public: "🌎 Public",
    friends: "👥 Friends",
    private: "🔒 Only me"
  };
  const audienceBadge = document.createElement("span");
  audienceBadge.className = "post-audience";
  audienceBadge.textContent = audienceLabels[audience] || audienceLabels.public;
  audienceBadge.setAttribute("aria-label", "Post audience: " + audienceBadge.textContent.replace(/^[^ ]+ /, ""));

  header.append(authorLabel, time, audienceBadge);

  const body = document.createElement("p");
  body.className = "post-content";
  body.textContent = content;

  const actions = document.createElement("div");
  actions.className = "post-actions";

  actions.innerHTML =
    '<button type="button" class="likeBtn">♡ Like</button>' +
    '<button type="button" class="commentBtn">💬 Comment</button>';

  const comments = document.createElement("div");
  comments.className = "comments";
  comments.hidden = true;

  comments.innerHTML =
    '<input aria-label="Write a comment" placeholder="Write a comment and press Enter">' +
    '<div class="commentList"></div>';

  article.append(header, body);
  if (mediaUrl && ["image", "video"].includes(mediaType)) {
    const media = document.createElement(mediaType === "image" ? "img" : "video");
    media.src = mediaUrl;
    media.className = "post-media";
    media.loading = "lazy";
    if (mediaType === "image") media.alt = "Photo shared by " + author;
    if (mediaType === "video") { media.controls = true; media.playsInline = true; }
    article.appendChild(media);
  }
  article.append(actions, comments);

  return article;
}

let lastStoriesLoad = 0;
let storyViewerPreviousFocus = null;

function openStoryViewer(story) {
  let viewer = document.getElementById("storyViewer");
  if (!viewer) {
    viewer = document.createElement("dialog");
    viewer.id = "storyViewer";
    viewer.className = "story-viewer";
    viewer.setAttribute("aria-labelledby", "storyViewerCaption");
    viewer.innerHTML = '<button type="button" class="story-viewer-close" aria-label="Close Story">×</button><div class="story-viewer-media"></div><p class="story-viewer-caption" id="storyViewerCaption"></p>';
    viewer.querySelector(".story-viewer-close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", event => { if (event.target === viewer) viewer.close(); });
    viewer.addEventListener("close", () => { const video = viewer.querySelector("video"); if (video) video.pause(); storyViewerPreviousFocus?.focus({ preventScroll: true }); storyViewerPreviousFocus = null; });
    document.body.appendChild(viewer);
  }
  const mediaBox = viewer.querySelector(".story-viewer-media");
  mediaBox.replaceChildren();
  const media = document.createElement(story.mediaType === "video" ? "video" : "img");
  media.src = story.mediaUrl;
  if (story.mediaType === "video") { media.controls = true; media.autoplay = true; media.muted = true; media.playsInline = true; }
  else media.alt = story.content || "DanzStak Story";
  mediaBox.appendChild(media);
  viewer.querySelector(".story-viewer-caption").textContent = story.content || "Story";
  storyViewerPreviousFocus = document.activeElement;
  viewer.showModal();
  viewer.querySelector(".story-viewer-close").focus();
}

async function loadStories() {
  try {
    const response = await fetch("https://api.danzstak.com/stories", { credentials: "include", cache: "no-store" });
    if (!response.ok) return;
    const data = await response.json();
    lastStoriesLoad = Date.now();
    document.getElementById("storiesLoading")?.remove();
    storiesRail.querySelectorAll(".story[data-story-id]").forEach(item => item.remove());
    for (const story of (data.stories || []).slice(0, 12)) {
      const item = document.createElement("article");
      item.className = "story";
      item.dataset.storyId = story.storyId;
      item.title = story.content;
      const open = document.createElement("button");
      open.type = "button";
      open.className = "story-open";
      open.setAttribute("aria-label", "Open Story from " + story.userEmail.split("@")[0] + ": " + story.content);
      if (story.mediaType === "image" && story.mediaUrl) {
        item.style.backgroundImage = `linear-gradient(transparent,#0009),url("${story.mediaUrl}")`;
        item.style.backgroundSize = "cover";
        item.style.backgroundPosition = "center";
      } else if (story.mediaType === "video" && story.mediaUrl) {
        const video = document.createElement("video");
        video.src = story.mediaUrl;
        video.muted = true;
        video.autoplay = localStorage.getItem("danzstak_data_saver") !== "1";
        video.loop = true;
        video.playsInline = true;
        video.preload = localStorage.getItem("danzstak_data_saver") === "1" ? "none" : "metadata";
        item.appendChild(video);
      }
      const label = document.createElement("span");
      label.textContent = story.userEmail.split("@")[0] + ": " + story.content.slice(0, 55);
      open.appendChild(label);
      open.addEventListener("click", () => openStoryViewer(story));
      item.appendChild(open);
      if (story.isOwner) {
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "story-delete";
        remove.setAttribute("aria-label", "Delete Story");
        remove.textContent = "×";
        remove.addEventListener("keydown", event => event.stopPropagation());
        remove.addEventListener("click", async event => {
          event.stopPropagation();
          if (!confirm("Delete this Story now?")) return;
          remove.disabled = true;
          const deleted = await fetch("https://api.danzstak.com/stories/" + encodeURIComponent(story.storyId), { method: "DELETE", credentials: "include" });
          if (deleted.ok) item.remove();
          else { remove.disabled = false; alert("Story could not be deleted."); }
        });
        item.appendChild(remove);
      }
      storiesRail.appendChild(item);
    }
  } catch { /* Feed still works if stories are temporarily unavailable. */ }
  finally { document.getElementById("storiesLoading")?.remove(); }
}

const createStoryButton = document.querySelector(".story-create");
const createStoryInput = document.createElement("input");
createStoryInput.type = "file";
createStoryInput.accept = "image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime";
createStoryInput.hidden = true;
createStoryButton?.insertAdjacentElement("afterend", createStoryInput);
createStoryButton?.addEventListener("click", () => {
  if (confirm("Do you certify that you created this photo or video and it contains no unauthorized copyrighted material?")) createStoryInput.click();
});
createStoryInput.addEventListener("change", async () => {
  const file = createStoryInput.files?.[0];
  if (!file) return;
  const mediaType = file.type.startsWith("image/") ? "image" : file.type.startsWith("video/") ? "video" : "";
  if (!mediaType || !createStoryInput.accept.split(",").includes(file.type)) {
    alert("Stories must use a supported photo or video file.");
    createStoryInput.value = "";
    return;
  }
  if (!confirm("Do you certify that you created this Story and own all material in it, including any music inside a video?")) {
    createStoryInput.value = "";
    return;
  }
  createStoryButton.disabled = true;
  createStoryButton.querySelector("span").textContent = "Publishing…";
  let uploadedStoryKey = "";
  try {
    const ticketResponse = await fetch("https://api.danzstak.com/stories", {
      method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contentType: file.type })
    });
    if (!ticketResponse.ok) throw new Error("Story upload could not start.");
    const ticket = await ticketResponse.json();
    const uploadResponse = await fetch(ticket.uploadUrl, { method: "PUT", headers: { "Content-Type": file.type }, body: file });
    if (!uploadResponse.ok) throw new Error("Story media could not be uploaded.");
    uploadedStoryKey = ticket.mediaKey;
    const publishResponse = await fetch("https://api.danzstak.com/stories", {
      method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: file.name || "Your Story", audience: postAudience.value, mediaKey: ticket.mediaKey, mediaType: ticket.mediaType, dedicatedMedia: true, originalContentCertified: true })
    });
    if (!publishResponse.ok) throw new Error("Story could not be published.");
    uploadedStoryKey = "";
    await loadStories();
  } catch (error) {
    await discardUploadedMedia(uploadedStoryKey);
    alert(error.message || "Story could not be published.");
  } finally {
    createStoryInput.value = "";
    createStoryButton.disabled = false;
    createStoryButton.querySelector("span").innerHTML = '<b aria-hidden="true">+</b> Your Story';
  }
});

// LOAD SAVED POSTS FROM AWS DYNAMODB
async function loadPosts() {

  feedStatus.textContent = "Loading saved posts...";

  try {

    const response = await fetch(API_URL, {
      method: "GET",
      credentials: "include",
      cache: "no-store"
    });

    if (response.status === 401) {
      feedStatus.textContent = "Your secure session has expired. Please log in again at https://api.danzstak.com/auth/login";
      return;
    }
    if (!response.ok) {
      throw new Error("AWS API returned " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.posts)) {
      throw new Error(
        "AWS did not return a valid posts list."
      );
    }
    window.danzstakLoadedPosts = data.posts;
    window.dispatchEvent(new CustomEvent("danzstak:posts-loaded", { detail: { posts: data.posts } }));

    feed.replaceChildren();

    if (data.posts.length === 0) {

      feedStatus.textContent =
        "No saved posts yet. Create your first post!";

      return;
    }

    const hiddenPostIds = new Set(JSON.parse(localStorage.getItem("danzstak-hidden-posts") || "[]"));

    data.posts.forEach(post => {

      if (typeof post.content !== "string") return;
      if (post.postId && hiddenPostIds.has(String(post.postId))) return;

      const authorEmail = String(post.authorEmail || post.userEmail || post.email || "").toLowerCase();
      const authorName = post.authorName || post.name || (authorEmail ? authorEmail.split("@")[0] : "DanzStak Member");
      const article = createPostElement(
        post.content,
        authorName,
        post.createdAt,
        post.audience,
        post.mediaUrl,
        post.mediaType,
        post.postId,
        typeof post.isOwner === "boolean" ? post.isOwner : null,
        authorEmail,
        post.commentPolicy,
        post.editHistory
      );

      if (!post.mediaUrl && post.mediaKey && post.mediaType) {
        fetch("https://api.danzstak.com/stories", {
          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
          body: JSON.stringify({ action: "view", mediaKey: post.mediaKey, mediaType: post.mediaType })
        }).then(response => response.ok ? response.json() : null).then(ticket => {
          if (!ticket?.mediaUrl || !article.isConnected) return;
          const media = document.createElement(post.mediaType === "image" ? "img" : "video");
          media.src = ticket.mediaUrl;
          media.className = "post-media";
          media.loading = "lazy";
          if (post.mediaType === "image") media.alt = "Photo shared by " + authorName;
          if (post.mediaType === "video") { media.controls = true; media.playsInline = true; }
          article.querySelector(".post-content")?.insertAdjacentElement("afterend", media);
        });
      }

      feed.appendChild(article);

    });

    const linkedPost = location.hash.startsWith("#post-")
      ? document.getElementById(decodeURIComponent(location.hash.slice(1)))
      : null;
    if (linkedPost) requestAnimationFrame(() => {
      linkedPost.tabIndex = -1;
      linkedPost.focus({ preventScroll: true });
      linkedPost.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    feedStatus.textContent = "";

    console.log(
      "DanzStak: Loaded",
      data.posts.length,
      "saved posts."
    );

  } catch (error) {

    console.error(
      "DanzStak feed error:",
      error
    );

    feedStatus.textContent =
      "Unable to load posts: " + error.message;

  }
}

// SAVE NEW POST TO DYNAMODB
publishBtn.addEventListener("click", async () => {

  const content = postText.value.trim();
  const audience = ["public", "friends", "private"].includes(postAudience.value)
    ? postAudience.value
    : "public";

  const selectedMedia = window.danzstakSelectedMedia;
  if (!content && !selectedMedia) return;
  if (content.length > 5000) {
    alert("Posts must be 5000 characters or fewer.");
    return;
  }
  const certification = document.getElementById("originalContentCertification");
  if (!certification?.checked) {
    alert("Certify that this is your original content before posting.");
    certification?.focus();
    return;
  }

  publishBtn.disabled = true;

  let savedPost;
  let uploadedPostKey = "";

  try {

    let mediaKey = "";
    let mediaType = "";
    let mediaUrl = "";
    if (selectedMedia) {
      const ticketResponse = await fetch("https://api.danzstak.com/stories", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
        body: JSON.stringify({ contentType: selectedMedia.file.type })
      });
      if (!ticketResponse.ok) throw new Error("Media upload could not start");
      const ticket = await ticketResponse.json();
      const uploadResponse = await fetch(ticket.uploadUrl, { method: "PUT", headers: { "Content-Type": selectedMedia.file.type }, body: selectedMedia.file });
      if (!uploadResponse.ok) throw new Error("Media upload failed");
      ({ mediaKey, mediaType } = ticket);
      uploadedPostKey = mediaKey;
      mediaUrl = selectedMedia.url;
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ content: content || "Shared media", audience, mediaKey, mediaType, reel: mediaType === "video" && shareToReels.checked, originalContentCertified: true })
    });

    if (response.status === 401) {
      throw new Error("Session expired. Log in again at https://api.danzstak.com/auth/login");
    }
    if (!response.ok) {
      throw new Error("AWS API returned " + response.status);
    }

    savedPost = await response.json();
    uploadedPostKey = "";

    if (shareToStory.checked && shareToStory.dataset.hasMedia === "true") {
      let uploadedStoryKey = "";
      try {
        const storyTicketResponse = await fetch("https://api.danzstak.com/stories", {
          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
          body: JSON.stringify({ contentType: selectedMedia.file.type })
        });
        if (!storyTicketResponse.ok) throw new Error("Story upload could not start");
        const storyTicket = await storyTicketResponse.json();
        const storyUploadResponse = await fetch(storyTicket.uploadUrl, { method: "PUT", headers: { "Content-Type": selectedMedia.file.type }, body: selectedMedia.file });
        if (!storyUploadResponse.ok) throw new Error("Story media upload failed");
        uploadedStoryKey = storyTicket.mediaKey;
        const storyResponse = await fetch("https://api.danzstak.com/stories", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ content, audience, mediaKey: storyTicket.mediaKey, mediaType: storyTicket.mediaType, dedicatedMedia: true, originalContentCertified: true })
        });
        if (!storyResponse.ok) throw new Error("Story could not be published");
        uploadedStoryKey = "";
        await loadStories();
      } catch (storyError) {
        await discardUploadedMedia(uploadedStoryKey);
        console.error("DanzStak Story error:", storyError);
        alert("Your post was saved, but the Story could not be published.");
      }
    }

    postText.value = "";
    shareToReels.checked = false;
    shareToReels.disabled = true;

    // Show the new post immediately after AWS confirms saving it
    feed.prepend(
      createPostElement(
        savedPost.content,
        "You",
        savedPost.createdAt,
        savedPost.audience || audience,
        mediaUrl,
        mediaType,
        savedPost.postId,
        true
      )
    );
    savedPost.mediaUrl = mediaUrl;
    window.danzstakLoadedPosts = [savedPost, ...(window.danzstakLoadedPosts || [])];
    window.dispatchEvent(new CustomEvent("danzstak:posts-loaded", { detail: { posts: window.danzstakLoadedPosts } }));

    feedStatus.textContent = "";

    console.log(
      "DanzStak: Post saved",
      savedPost.postId
    );

  } catch (error) {

    await discardUploadedMedia(uploadedPostKey);

    console.error(
      "DanzStak posting error:",
      error
    );

    alert(
      "Post was not saved: " + error.message
    );

  } finally {

    publishBtn.disabled = false;

  }
});

// LIKE AND COMMENT BUTTONS
feed.addEventListener("click", (event) => {

  const post = event.target.closest(".post");

  if (!post) return;

  if (event.target.classList.contains("likeBtn")) {

    const button = event.target;
    const liked = button.dataset.liked === "true";

    button.dataset.liked = String(!liked);

    button.textContent =
      liked ? "♡ Like" : "♥ Liked";

  }

  if (event.target.classList.contains("commentBtn")) {

    const comments = post.querySelector(".comments");

    comments.hidden = !comments.hidden;

    if (!comments.hidden) {
      comments.querySelector("input").focus();
    }

  }

});

// ADD COMMENTS TO THE SCREEN
feed.addEventListener("keydown", (event) => {

  if (
    event.key !== "Enter" ||
    !event.target.matches(".comments input")
  ) return;

  const value = event.target.value.trim();

  if (!value) return;

  const comment = document.createElement("div");
  comment.className = "comment";

  comment.textContent = "You: " + value;

  event.target.parentElement
    .querySelector(".commentList")
    .appendChild(comment);

  event.target.value = "";

});

function openMessageDrawer(contact = "", answerCall = false) {
  const launcher = document.getElementById("messagesNav");
  let drawer = document.getElementById("messageDrawer");
  if (!drawer) {
    drawer = document.createElement("section");
    drawer.id = "messageDrawer";
    drawer.className = "message-drawer";
    drawer.setAttribute("role", "dialog");
    drawer.setAttribute("aria-label", "Messages");
    drawer.innerHTML = '<div class="message-drawer-bar"><span>Chats</span><button type="button" class="message-drawer-close" aria-label="Close messages">×</button></div><iframe title="DanzStak messages"></iframe>';
    drawer.querySelector(".message-drawer-close").addEventListener("click", () => { drawer.hidden = true; drawer.querySelector("iframe")?.contentWindow?.postMessage({ type: "danzstak-chat-hidden" }, location.origin); });
    drawer.querySelector(".message-drawer-close").addEventListener("click", () => { launcher.setAttribute("aria-expanded", "false"); launcher.focus(); });
    drawer.addEventListener("keydown", event => { if (event.key === "Escape") { event.preventDefault(); drawer.querySelector(".message-drawer-close").click(); } });
    document.body.appendChild(drawer);
  }
  const frame = drawer.querySelector("iframe");
  const target = new URL("messages.html", location.href);
  target.searchParams.set("embedded", "1");
  if (contact) target.searchParams.set("contact", contact);
  if (answerCall) target.searchParams.set("answer", "1");
  if (!frame.src || contact || answerCall) frame.src = target.href;
  drawer.hidden = false;
  launcher.setAttribute("aria-expanded", "true");
  drawer.querySelector(".message-drawer-close").focus();
}
document.getElementById("messagesNav").addEventListener("click", () => openMessageDrawer());
const requestedMessageContact = new URLSearchParams(location.search).get("message")?.trim().toLowerCase();
if (requestedMessageContact) {
  openMessageDrawer(requestedMessageContact);
  history.replaceState(null, "", location.pathname + location.hash);
}
window.addEventListener("message", event => {
  if (event.origin !== location.origin) return;
  const drawer = document.getElementById("messageDrawer");
  if (!drawer || event.source !== drawer.querySelector("iframe")?.contentWindow) return;
  if (event.data?.type === "danzstak-chat-view") drawer.classList.toggle("is-conversation", event.data.open === true);
  if (event.data?.type === "danzstak-call-mode") drawer.classList.toggle("is-video-call", event.data.mode === "video");
  if (event.data?.type === "danzstak-chat-read") refreshNotificationCount();
  if (event.data?.type === "danzstak-chat-minimize") {
    drawer.setAttribute("hidden", "");
    document.getElementById("messagesNav")?.setAttribute("aria-expanded", "false");
  }
});
