<body class="ds-tool-page">
  <a class="skip-link" href="#recordStoreMain">Skip to record store search</a>
  <header class="tool-header"><a class="tool-brand" href="feed.html" aria-label="DanzStak Your Mix"><img src="assets/danzstak-d-icon.png" alt=""><span>DANZSTAK</span></a><nav aria-label="Music tools"><a href="feed.html">Your Mix</a><a href="booking.html">Booking Agent</a></nav></header>
  <main id="recordStoreMain" class="record-store-main" tabindex="-1">
    <section class="hero" aria-labelledby="recordStoresTitle">
      <span class="record-icon" data-menu-icon="disc" aria-hidden="true"></span>
      <div><p class="eyebrow">Release placement</p><h1 id="recordStoresTitle">Record Stores</h1><p>Find independent shops near home, a gig, or the next town on tour.</p></div>
    </section>
    <section class="search-card" aria-labelledby="releaseTitle">
      <details class="release-details">
        <summary id="releaseTitle">Prepare release outreach</summary>
        <div class="release-grid">
          <label>Artist<input id="releaseArtist" maxlength="120"></label><label>Release title<input id="releaseTitleInput" maxlength="160"></label>
          <label>Format<input id="releaseFormat" maxlength="80" placeholder="LP, 7-inch, CD, cassette"></label><label>Genre<input id="releaseGenre" maxlength="120"></label>
          <label>Release date<input id="releaseDate" type="date"></label><label>Wholesale price<input id="releaseWholesale" maxlength="80" placeholder="Currency and amount"></label>
          <label>Suggested retail<input id="releaseRetail" maxlength="80" placeholder="Currency and amount"></label><label>Public EPK link<input id="releaseEpk" type="url" placeholder="https://"></label>
          <label>Listening link<input id="releaseListen" type="url" placeholder="https://"></label><label>Contact name<input id="releaseContactName" maxlength="120"></label>
          <label>Contact email<input id="releaseContactEmail" type="email" maxlength="254"></label><label>Terms offered<input id="releaseTerms" maxlength="1000" placeholder="Wholesale, consignment, return terms, minimum order"></label>
        </div>
      </details>
      <form id="recordStoreForm" class="store-search-form" novalidate>
        <label for="recordStoreLocation">Where should we look?</label>
        <div class="search-row"><input id="recordStoreLocation" maxlength="120" autocomplete="address-level2" placeholder="City or region" required><button type="submit" data-icon="search" aria-label="Find record stores" title="Find record stores">Find stores</button></div>
      </form>
      <p id="recordStoreStatus" class="store-status" role="status" aria-live="polite">Enter a city or region to find record stores.</p>
    </section>
    <section id="recordStoreResults" class="store-grid" aria-label="Record store results"></section>
    <div class="search-more" id="recordStoreMore" hidden><button type="button" id="loadMoreStores" hidden>Find more stores nearby</button></div>
    <section class="placement-card" aria-labelledby="placementTitle"><div class="placement-heading"><div><p class="eyebrow">Private outreach</p><h2 id="placementTitle">Selected stores</h2></div><button type="button" id="savePlacement">Save workspace</button></div><p id="placementStatus" role="status" aria-live="polite">Loading your store list...</p><div id="placementStores" class="placement-list"></div></section>
  </main>
  <nav class="ds-mobile-nav" aria-label="DanzStak mobile navigation"></nav>
