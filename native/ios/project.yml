name: DanzStak
options:
  bundleIdPrefix: com.danzstak
  deploymentTarget:
    iOS: "17.0"
targets:
  DanzStak:
    type: application
    platform: iOS
    sources:
      - path: DanzStak
        excludes:
          - "**/*.dmg"
          - "**/*.xip"
    info:
      path: DanzStak/Info.plist
      properties:
        CFBundleDisplayName: DanzStak
        NSMicrophoneUsageDescription: Dictate messages and record audio with chat videos.
        NSCameraUsageDescription: Take photos and record videos to review before sending in chat.
        NSSpeechRecognitionUsageDescription: Turn your speech into text so you can review and send your message.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.danzstak.app.auth
            CFBundleURLSchemes: [danzstak]
        LSApplicationCategoryType: public.app-category.social-networking
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danzstak.app
        PRODUCT_NAME: DanzStak
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  DanzStakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DanzStak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danzstak.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5"
schemes:
  DanzStak:
    build:
      targets:
        DanzStak: all
    test:
      targets: [DanzStakUITests]
