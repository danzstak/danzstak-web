<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.danzstak.com; script-src 'self'; style-src 'self'; img-src 'self' data: https://danzstak-call-signaling-mediabucket-abx9qfpinhje.s3.us-west-1.amazonaws.com https://dk7kawr758jtd.cloudfront.net https:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
<title>Shop | DanzStak</title>
<meta name="description" content="A member's shop on DanzStak.">
<link rel="icon" href="assets/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=3" sizes="180x180">
<link rel="stylesheet" href="assets/mobile-design-system.css?v=22">
<link rel="stylesheet" href="assets/shop-public.css?v=1">
<script src="assets/languages.js?v=231" defer></script>
<script src="assets/i18n-music.js?v=17" defer></script>
<script src="assets/i18n.js?v=420" defer></script>
</head>
<!-- Owner 2026-11-22: a shared profile link opened by someone who isn't signed in shows that member's shop and nothing
     else ("can only see the eroticon shop or exit out"). ✕ leaves to the landing page. -->
<body class="shop-public">
<header class="shop-public-bar">
  <span class="shop-public-mark" data-no-translate><img src="assets/danzstak-d-icon.png" alt="" width="28" height="28"><span>DANZSTAK</span></span>
  <a class="shop-public-exit" href="./" aria-label="Leave the shop" title="Leave the shop"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/></svg></a>
</header>
<main id="shopMain">
  <p id="shopStatus" class="shop-public-status" role="status" aria-live="polite">Loading shop…</p>
  <p class="shop-public-status"><button id="shopRetry" class="shop-public-retry" type="button" hidden>Try again</button></p>
  <section id="shop" class="shop-public-shop" aria-labelledby="shopName" hidden>
    <div id="shopCover" class="shop-public-cover" hidden></div>
    <div class="shop-public-head">
      <p class="shop-public-kicker">Shop</p>
      <h1 id="shopName" data-no-translate></h1>
      <p id="shopAbout" class="shop-public-about" data-no-translate hidden></p>
    </div>
    <div id="shopGrid" class="shop-public-grid"></div>
  </section>
</main>
<dialog id="shopItem" class="shop-public-item" aria-labelledby="shopItemTitle">
  <button id="shopItemClose" class="shop-public-item-close" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/></svg></button>
  <div id="shopItemImage" class="shop-public-item-image"></div>
  <div class="shop-public-item-copy">
    <h2 id="shopItemTitle" data-no-translate></h2>
    <p id="shopItemPrice" class="shop-public-item-price"></p>
    <p id="shopItemShipping" class="shop-public-detail"></p>
    <button class="shop-public-checkout" type="button" disabled>Checkout opens soon</button>
    <p id="shopItemAbout" class="shop-public-about" data-no-translate></p>
  </div>
</dialog>
<script src="assets/shop-public.js?v=1" defer></script>
</body>
</html>
