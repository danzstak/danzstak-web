name: Review checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infrastructure/auth-api/package-lock.json
      - name: Install API dependencies
        working-directory: infrastructure/auth-api
        run: npm ci --ignore-scripts
      - name: Run complete local regression suite
        shell: pwsh
        run: .\test-regressions.ps1

  responsive-accessibility-security:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run responsive, accessibility, and security checks
        shell: pwsh
        run: |
          node .\test-mobile-design-system.cjs
          node .\test-navigation-layout.cjs
          node .\test-touch-targets.cjs
          node .\test-feed-csp.cjs
          node .\test-external-link-privacy.cjs
          node .\test-responsive-media.cjs
          node .\test-skip-navigation.cjs
          node .\test-static-link-integrity.cjs
          node .\test-social-origins.cjs
          node .\test-authentication.cjs
          node .\test-booking-workspace-design.cjs

  browser-call-media:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install browser test dependency
        shell: pwsh
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Start local review server
        shell: pwsh
        run: |
          $process = Start-Process python -ArgumentList '-m','http.server','8017','--bind','127.0.0.1' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          "DANZSTAK_SERVER_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8017/messages.html' | Out-Null
              exit 0
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          throw 'Local review server did not become ready.'
      - name: Verify calls and Mix portrait media in real browsers
        shell: pwsh
        env:
          DANZSTAK_LOCAL_URL: http://127.0.0.1:8017
          DANZSTAK_FEED_ORIGIN: http://127.0.0.1:8017
        run: |
          node .\browser-checks\call-video-two-party.cjs
          node .\browser-checks\call-audio-output.cjs
          node .\browser-checks\foreground-call-ringtone.cjs
          node .\browser-checks\mix-portrait-preview.cjs
          node .\browser-checks\original-feed-art-direction.cjs
          node .\browser-checks\marketplace-ticketing.cjs
      - name: Stop local review server
        if: always()
        shell: pwsh
        run: |
          if ($env:DANZSTAK_SERVER_PID) {
            Stop-Process -Id ([int]$env:DANZSTAK_SERVER_PID) -Force -ErrorAction SilentlyContinue
          }

  release-evidence:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify release safeguards and required project guidance
        shell: pwsh
        run: |
          node .\test-pwa-shell-refresh.cjs
          .\test-release-verification.ps1
          .\test-site.ps1
          .\test-infrastructure.ps1
          if (-not (Test-Path -LiteralPath .\docs\QUALITY-ASSURANCE-POLICY.md)) {
            throw 'Missing quality assurance policy.'
          }
          if (-not (Test-Path -LiteralPath .\docs\RELEASE-CHECKLIST.md)) {
            throw 'Missing release checklist.'
          }
          if (-not (Test-Path -LiteralPath .\CLAUDE.md)) {
            throw 'Missing root development brief.'
          }

  browser-account-security:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install browser-check dependency
        shell: pwsh
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Start static review server
        shell: pwsh
        run: |
          $process = Start-Process python -ArgumentList '-m','http.server','8132','--bind','127.0.0.1' -WindowStyle Hidden -PassThru
          "DANZSTAK_SERVER_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8132/feed.html | Out-Null
              exit 0
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          throw 'Static review server did not start.'
      - name: Verify signed-in account flows in real browsers
        shell: pwsh
        env:
          DANZSTAK_BASE_URL: http://127.0.0.1:8132
        run: |
          node .\browser-checks\account-security.cjs
          node .\browser-checks\profile-onboarding-identity.cjs
          node .\browser-checks\push-alert-prompt.cjs
          node .\browser-checks\epk-booking-connected-handoff.cjs
      - name: Stop static review server
        if: always()
        shell: pwsh
        run: |
          if ($env:DANZSTAK_SERVER_PID) {
            Stop-Process -Id $env:DANZSTAK_SERVER_PID -Force -ErrorAction SilentlyContinue
          }
