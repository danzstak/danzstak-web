name: Review checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infrastructure/auth-api/package-lock.json
      - name: Install API dependencies
        working-directory: infrastructure/auth-api
        run: npm ci --ignore-scripts
      - name: Run complete local regression suite
        shell: pwsh
        run: .\test-regressions.ps1

  responsive-accessibility-security:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify responsive, accessible and security boundaries
        shell: pwsh
        run: |
          node test-content-ownership.cjs
          node test-internal-sharing.cjs
          node test-post-deletion.cjs
          node test-mobile-design-system.cjs
          node test-responsive-media.cjs
          node test-touch-targets.cjs
          node test-skip-navigation.cjs
          node test-static-link-integrity.cjs
          node test-social-origins.cjs
          node test-authentication.cjs

  release-evidence:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify releasable PWA and infrastructure evidence
        shell: pwsh
        run: |
          node test-pwa-shell-refresh.cjs
          .\test-release-verification.ps1
          .\test-site.ps1
          .\test-infrastructure.ps1
