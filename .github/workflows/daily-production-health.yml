name: Daily production health

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      booking_provider_smoke:
        description: Run authenticated read-only Booking provider discovery
        required: false
        default: false
        type: boolean
      booking_query:
        description: Public city and genre query (no private data)
        required: false
        default: punk clubs in Tacoma, Washington, United States
        type: string
      booking_worldwide_matrix:
        description: Run the bounded six-locality worldwide Booking benchmark
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-production-health
  cancel-in-progress: false

jobs:
  public-read-only-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check production without charges, email, or user-data mutation
        run: node scripts/production-health-check.cjs

  authenticated-isolated-synthetic:
    if: ${{ vars.DANZSTAK_AUTHENTICATED_HEALTH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DANZSTAK_SYNTHETIC_SESSION_A: ${{ secrets.DANZSTAK_SYNTHETIC_SESSION_A }}
      DANZSTAK_SYNTHETIC_SESSION_B: ${{ secrets.DANZSTAK_SYNTHETIC_SESSION_B }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify private account workflows and remove synthetic data
        run: node scripts/authenticated-production-health-check.cjs

  authenticated-booking-provider-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.booking_provider_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DANZSTAK_SYNTHETIC_SESSION_A: ${{ secrets.DANZSTAK_SYNTHETIC_SESSION_A }}
      DANZSTAK_BOOKING_SMOKE_QUERY: ${{ inputs.booking_query }}
      DANZSTAK_BOOKING_SMOKE_MATRIX: ${{ inputs.booking_worldwide_matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify authenticated real-provider venue discovery without mutations
        run: node scripts/booking-provider-smoke.cjs
