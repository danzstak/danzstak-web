name: Daily production health

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-production-health
  cancel-in-progress: false

jobs:
  public-read-only-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check production without charges, email, or user-data mutation
        run: node scripts/production-health-check.cjs
