<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769e0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.danzstak.com; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="assets/soft-ui.css?v=20261025-11">
<link rel="stylesheet" href="assets/chat.css?v=11">
<title>Messages | DanzStak</title>
</head>
<body>
<header class="chat-header"><a href="feed.html" class="chat-brand"><img src="assets/danzstak-logo.png" alt=""><span>DanzStak</span></a><div><a class="button" href="feed.html">Back to Feed</a> <button class="button" type="button" data-logout>Logout</button></div></header>
<main class="chat-shell">
  <section class="chat-sidebar" aria-labelledby="messagesTitle">
    <div class="chats-heading"><h1 id="messagesTitle">Chats</h1><span aria-hidden="true">•••</span></div>
    <label class="chat-search"><span aria-hidden="true">⌕</span><input id="chatSearch" type="search" placeholder="Search DanzStak messages" aria-label="Search messages"></label>
    <nav class="chat-filters" aria-label="Chat filters"><button type="button" class="active" data-chat-filter="all">All</button><button type="button" data-chat-filter="unread">Unread</button><button type="button" data-chat-filter="groups">Groups</button><button type="button" data-chat-filter="communities">Communities</button></nav>
    <section class="chat-list-panel" aria-labelledby="chatsTitle"><h2 id="chatsTitle" class="sr-only">Saved chats</h2><div id="conversationUsers"><p class="chat-note">Loading saved chats…</p></div></section>
    <input id="contactEmail" type="hidden">
    <section class="online-panel" aria-labelledby="onlineTitle"><h2 id="onlineTitle">Friends and group members</h2><div id="onlineUsers"><p class="chat-note">Loading contacts…</p></div></section>
    <p class="choice-label">Start a conversation</p>
    <div class="call-actions conversation-choices">
      <button id="startText" type="button" class="primary">Text</button>
      <button id="startPhone" type="button" class="primary">Phone</button>
      <button id="startVideo" type="button" class="primary">Video</button>
    </div>
    <button id="enableRinging" type="button" class="secondary answer-button">Enable ringing</button>
    <section id="incomingCall" class="incoming-call" hidden><strong id="incomingLabel">Incoming call</strong><div class="call-actions"><button id="acceptCall" type="button" class="primary">Accept</button><button id="declineCall" type="button" class="danger">Decline</button></div></section>
    <button id="receiverHangUp" type="button" class="danger receiver-hangup" hidden>📞 Hang Up</button>
    <p id="callStatus" class="call-status" role="status">Ready to start a secure call.</p>
    <button id="deleteChat" type="button" class="secondary delete-chat">Delete Chat</button>
  </section>
  <section class="conversation" aria-label="Conversation">
    <header id="conversationHeader" class="conversation-header" hidden><span id="conversationAvatar" class="conversation-avatar" aria-hidden="true">D</span><strong id="conversationName">Select a chat</strong><div class="conversation-header-actions"><button id="headerPhone" type="button" title="Phone call" aria-label="Phone call">☎</button><button id="headerVideo" type="button" title="Video call" aria-label="Video call">▣</button><button id="minimizeConversation" type="button" title="Minimize chat" aria-label="Minimize chat">−</button><button id="closeConversation" type="button" title="Close chat" aria-label="Close chat">×</button></div></header>
    <div id="videoGrid" class="video-grid" hidden>
      <figure><video id="remoteVideo" autoplay playsinline></video><figcaption id="remoteLabel">Waiting for contact</figcaption></figure>
      <figure class="local-video"><video id="localVideo" autoplay muted playsinline></video><figcaption>You</figcaption></figure>
    </div>
    <div id="mediaControls" class="media-controls" aria-label="Call controls" hidden>
      <button id="toggleMic" type="button">Mute</button>
      <button id="toggleCamera" type="button">Camera off</button>
      <button id="hangUp" type="button" class="danger hangup-button" aria-label="Hang up the current call">📞 Hang Up</button>
    </div>
    <div id="messageList" class="message-list" aria-live="polite"><p class="system-message">Select a saved chat or an available friend to begin messaging.</p></div>
    <form id="messageForm" class="message-form">
      <label class="sr-only" for="messageInput">Message</label>
      <div class="emoji-control"><button id="emojiButton" type="button" aria-label="Add emoji">😊</button><div id="emojiPalette" class="emoji-palette" hidden></div></div>
      <input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Write a message" disabled>
      <button type="submit" class="primary" disabled>Send</button>
    </form>
  </section>
</main>
<script src="assets/chat.js?v=16" defer></script>
<script src="assets/direct-messages.js?v=15" defer></script>
<script src="assets/session-activity.js?v=2" defer></script>
<script src="assets/session-cleanup.js?v=1" defer></script>
<script src="assets/logout.js?v=2" defer></script>
<script src="assets/pwa.js?v=20261025-2" defer></script>
</body>
</html>
