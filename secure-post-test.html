
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DANZSTAK Secure Posting Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      margin: 10px 8px 10px 0;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f2f2f2;
      padding: 15px;
    }
  </style>
</head>
<body>
  <h1>DANZSTAK Secure Posting Test</h1>

  <p>
    This page tests secure posting with HttpOnly
    session cookies. It does not change the
    existing DANZSTAK social feed.
  </p>

  <button id="check">Check Login Session</button>

  <h3>Create a Test Post</h3>

  <textarea
    id="content"
    rows="4"
    maxlength="5000"
    placeholder="Enter your test post here..."
  ></textarea>

  <p>
    <button id="post">Create Secure Post</button>
    <button id="load">Load Saved Posts</button>
  </p>

  <h3>Results</h3>
  <pre id="result">Ready to test.</pre>

  <script>
    const api = "https://api.danzstak.com";
    const result = document.getElementById("result");

    async function request(path, options = {}) {
      try {
        const response = await fetch(api + path, {
          credentials: "include",
          ...options
        });

        const data = await response.json();

        result.textContent =
          "HTTP status: " + response.status + "\n" +
          JSON.stringify(data, null, 2);

        return response.ok;
      } catch (error) {
        result.textContent =
          "Request failed: " + error.message;
        return false;
      }
    }

    document.getElementById("check").onclick = () => {
      request("/auth/session");
    };

    document.getElementById("load").onclick = () => {
      request("/secure-posts");
    };

    document.getElementById("post").onclick = async () => {
      const content =
        document.getElementById("content").value.trim();

      if (!content || content.length > 5000) {
        result.textContent =
          "Enter between 1 and 5000 characters.";
        return;
      }

      if (!confirm(
        "Create this test post in the DANZSTAK database?"
      )) {
        return;
      }

      await request("/secure-posts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ content })
      });
    };
  </script>
</body>
</html>
