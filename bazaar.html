<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1769e0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.danzstak.com; style-src 'self'; script-src 'self'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
  <title>DanzStak Bazaar</title>
  <meta name="description" content="Browse fixed-price physical goods from DanzStak artists and members.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon-32.png?v=3" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="assets/mobile-design-system.css?v=19">
  <link rel="stylesheet" href="assets/icon-buttons.css?v=4">
  <link rel="stylesheet" href="assets/bazaar.css?v=1">
</head>
<body>
  <a class="skip-link" href="#bazaarMain">Skip to Bazaar</a>
  <header class="market-header">
    <a class="market-brand" href="feed.html?view=feed" aria-label="DanzStak home"><img src="assets/danzstak-d-icon.png" alt=""><span>DANZSTAK</span></a>
    <nav aria-label="Marketplace navigation"><a aria-current="page" href="bazaar.html">Bazaar</a><a href="store.html">Official</a><a href="store.html?manage=1">My Shop</a></nav>
  </header>
  <main id="bazaarMain" class="bazaar-main" tabindex="-1">
    <section class="bazaar-intro" aria-labelledby="bazaarTitle">
      <p class="market-eyebrow">Fixed price · member shops</p>
      <h1 id="bazaarTitle">DanzStak Bazaar</h1>
      <p>Physical releases, art, gear and tour merchandise sold by the DanzStak community. No bidding.</p>
    </section>
    <form class="bazaar-search" role="search">
      <label for="bazaarQuery">Search the Bazaar</label>
      <div><input id="bazaarQuery" type="search" autocomplete="off" placeholder="Search products or shops"><button type="submit">Search</button></div>
    </form>
    <p id="bazaarStatus" class="market-status" role="status" aria-live="polite">Loading Bazaar…</p>
    <section id="bazaarProducts" class="bazaar-grid" aria-label="Bazaar products"></section>
  </main>
  <nav class="ds-mobile-nav" aria-label="DanzStak mobile navigation">
    <a role="button" data-icon="home" aria-label="Home" title="Home" href="feed.html?view=feed"></a>
    <a role="button" data-icon="users" aria-label="Friends" title="Friends" href="feed.html?view=friends"></a>
    <a role="button" data-icon="chat" aria-label="SYNC" title="SYNC" href="messages.html"></a>
    <a role="button" data-icon="bell" aria-label="Buzz" title="Buzz" href="feed.html?view=notifications"></a>
    <a role="button" data-icon="menu" aria-label="Menu" title="Menu" href="feed.html?view=feed&amp;menu=1" aria-current="page"></a>
  </nav>
  <script src="assets/icon-buttons.js?v=10" defer></script>
  <script src="assets/bazaar.js?v=1" defer></script>
</body>
</html>
